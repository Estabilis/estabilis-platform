apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 60
  template:
    spec:
      serviceAccountName: wait-for-postgres
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: bitnami/kubectl:1.34
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL cluster to be ready..."
              while true; do
                STATUS=$(kubectl get cluster platform-postgres -n cnpg-system -o jsonpath='{.status.phase}' 2>/dev/null)
                if [ "$STATUS" = "Cluster in healthy state" ]; then
                  echo "PostgreSQL cluster is healthy."
                  exit 0
                fi
                echo "Status: $STATUS — waiting..."
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-postgres
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: wait-for-postgres
    namespace: cnpg-system
roleRef:
  kind: Role
  name: wait-for-postgres
  apiGroup: rbac.authorization.k8s.io