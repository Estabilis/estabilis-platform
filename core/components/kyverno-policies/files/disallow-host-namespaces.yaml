apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/description: >-
      Prevents pods from using host PID, IPC, or network namespaces. Sharing
      host namespaces allows containers to access host-level resources and
      breaks the isolation boundary.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: host-namespaces-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must not use host PID, IPC, or network namespaces."
        pattern:
          spec:
            =(hostPID): false
            =(hostIPC): false
            =(hostNetwork): false
    - name: host-namespaces-controllers
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
      validate:
        message: "Pods must not use host PID, IPC, or network namespaces."
        pattern:
          spec:
            template:
              spec:
                =(hostPID): false
                =(hostIPC): false
                =(hostNetwork): false
    - name: host-namespaces-cronjob
      match:
        any:
          - resources:
              kinds:
                - CronJob
      validate:
        message: "Pods must not use host PID, IPC, or network namespaces."
        pattern:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    =(hostPID): false
                    =(hostIPC): false
                    =(hostNetwork): false
