# Custom policies — clients can add their own ClusterPolicies here.
# Each entry renders as a full ClusterPolicy resource.
# Example:
#   customPolicies:
#     require-team-label:
#       spec:
#         validationFailureAction: Audit
#         background: true
#         rules:
#           - name: require-team
#             match:
#               any:
#                 - resources:
#                     kinds:
#                       - Deployment
#             validate:
#               message: "Label 'team' is required."
#               pattern:
#                 metadata:
#                   labels:
#                     team: "?*"
customPolicies: {}
