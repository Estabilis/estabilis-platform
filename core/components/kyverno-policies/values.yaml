# ---------------------------------------------------------------------------
# Kyverno Policies Configuration
# ---------------------------------------------------------------------------
#
# Namespace exclusions in validate policies:
#
# Permanently excluded (by design — cannot be made compliant):
#   - kube-system      : managed by AKS, not under our control
#   - node-exporter    : requires hostPath, hostNetwork, hostPorts, runs as root
#   - trivy-system     : scan jobs require root for container image access
#   - grafana          : Alloy DaemonSet requires root for log collection
#   - kyverno          : webhook/controller have special security requirements
#
# Temporarily whitelisted (have securityContext configured, pending validation):
#   - argocd, cert-manager, cnpg-system, external-dns, external-secrets,
#     kube-state-metrics, opencost, traefik, velero
#
# TODO: validate each whitelisted namespace with kyverno CLI, then remove
# from whitelist one by one. Track in platform issue #48.
#
# App namespaces (app-*) are always validated — no exclusions.
# ---------------------------------------------------------------------------

policies:
  default_deny_network_policy:
    enabled: true
  deny_ingress_platform_ns:
    enabled: true
    action: Audit
  disallow_adding_capabilities:
    enabled: true
    action: Audit
  disallow_default_sa:
    enabled: true
    action: Audit
  disallow_host_namespaces:
    enabled: true
    action: Audit
  disallow_host_path:
    enabled: true
    action: Audit
  disallow_host_ports:
    enabled: true
    action: Audit
  disallow_privileged_containers:
    enabled: true
    action: Audit
  drop_all_capabilities:
    enabled: true
    action: Audit
  generate_pdb:
    enabled: true
  inject_pss_labels:
    enabled: true
  inject_security_context:
    enabled: true
  no_latest_tag:
    enabled: true
    action: Audit
  no_privilege_escalation:
    enabled: true
    action: Audit
  require_image_digest:
    enabled: true
    action: Audit
  require_labels:
    enabled: true
    action: Audit
  require_limit_ranges:
    enabled: true
  require_limits:
    enabled: true
    action: Audit
  require_pod_annotations:
    enabled: true
    action: Audit
  require_probes:
    enabled: true
    action: Audit
  require_resource_quotas:
    enabled: true
  require_run_as_nonroot:
    enabled: true
    action: Audit
  require_seccomp_profile:
    enabled: true
    action: Audit
  restrict_automount_sa_token:
    enabled: true
    action: Audit
  restrict_volume_types:
    enabled: true
    action: Audit
  validate_namespace_name:
    enabled: true
    action: Audit
  require_app_namespace_labels:
    enabled: true
    action: Audit
  block_client_in_platform_ns:
    enabled: true
    action: Audit
customPolicies: {}
