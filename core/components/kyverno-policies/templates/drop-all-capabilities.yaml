{{- if .Values.policies.drop_all_capabilities.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/description: >-
      Requires all containers to explicitly drop ALL Linux capabilities.
      Dropping all capabilities and only adding back specific ones follows
      the principle of least privilege.
spec:
  validationFailureAction: {{ .Values.policies.drop_all_capabilities.action | default "Audit" }}
  background: true
  rules:
    - name: drop-all-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - cnpg-system
                - external-dns
                - external-secrets
                - grafana
                - kube-state-metrics
                - kyverno
                - node-exporter
                - opencost
                - traefik
                - trivy-system
                - velero
      validate:
        message: "Containers must drop ALL capabilities."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{`{{ element.securityContext.capabilities.drop || '' }}`}}"
    - name: drop-all-controllers
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - cnpg-system
                - external-dns
                - external-secrets
                - grafana
                - kube-state-metrics
                - kyverno
                - node-exporter
                - opencost
                - traefik
                - trivy-system
                - velero
      validate:
        message: "Containers must drop ALL capabilities."
        foreach:
          - list: "request.object.spec.template.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{`{{ element.securityContext.capabilities.drop || '' }}`}}"
    - name: drop-all-cronjob
      match:
        any:
          - resources:
              kinds:
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - cnpg-system
                - external-dns
                - external-secrets
                - grafana
                - kube-state-metrics
                - kyverno
                - node-exporter
                - opencost
                - traefik
                - trivy-system
                - velero
      validate:
        message: "Containers must drop ALL capabilities."
        foreach:
          - list: "request.object.spec.jobTemplate.spec.template.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{`{{ element.securityContext.capabilities.drop || '' }}`}}"
{{- end }}
