{{- if .Values.policies.inject_pss_labels.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-pss-labels
  annotations:
    policies.kyverno.io/title: Inject PSS Labels
    policies.kyverno.io/description: >-
      Automatically injects Pod Security Standards (PSS) restricted-level
      labels on new namespaces. This enables the built-in Kubernetes pod
      security admission controller for defense in depth.
spec:
  background: true
  rules:
    - name: inject-pss-restricted
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/enforce-version: latest
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/audit-version: latest
              pod-security.kubernetes.io/warn: restricted
              pod-security.kubernetes.io/warn-version: latest
{{- end }}
