{{- if .Values.policies.require_resource_quotas.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-quotas
  annotations:
    policies.kyverno.io/title: Require Resource Quotas
    policies.kyverno.io/description: >-
      Automatically generates a default ResourceQuota for each new namespace.
      ResourceQuotas prevent a single namespace from consuming all cluster
      resources and ensure fair sharing across tenants.
spec:
  background: true
  rules:
    - name: generate-resource-quota
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
      generate:
        synchronize: true
        apiVersion: v1
        kind: ResourceQuota
        name: default-resource-quota
        namespace: "{{ request.object.metadata.name }}"
        data:
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "8"
              limits.memory: 16Gi
              pods: "50"
              services: "20"
              persistentvolumeclaims: "10"
{{- end }}
