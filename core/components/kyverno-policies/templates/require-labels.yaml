{{- if .Values.policies.require_labels.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/description: >-
      Requires all Deployments, StatefulSets, DaemonSets, Jobs, and CronJobs
      to have the standard Estabilis platform labels for identification and
      ownership tracking. Only applies to client application namespaces.
spec:
  validationFailureAction: {{ .Values.policies.require_labels.action | default "Audit" }}
  background: true
  rules:
    - name: require-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
              namespaces:
                - "app-*"
      exclude:
        any:
          - resources:
              namespaces:
                - argocd
                - cert-manager
                - cnpg-system
                - external-dns
                - external-secrets
                - grafana
                - kube-state-metrics
                - kyverno
                - node-exporter
                - opencost
                - traefik
                - trivy-system
                - velero
      validate:
        message: >-
          The following labels are required: app, team,
          estabilis.io/owner, estabilis.io/service, estabilis.io/tier.
        pattern:
          metadata:
            labels:
              app: "?*"
              team: "?*"
              estabilis.io/owner: "?*"
              estabilis.io/service: "?*"
              estabilis.io/tier: "?*"
{{- end }}
