apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.global.letsencryptEmail | quote }}
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          azureDNS:
            tenantID: {{ .Values.global.tenantId | quote }}
            subscriptionID: {{ .Values.global.subscriptionId | quote }}
            resourceGroupName: {{ .Values.global.resourceGroup | quote }}
            hostedZoneName: {{ .Values.global.domain | quote }}
            managedIdentity:
              clientID: {{ .Values.identity.certManager.clientId | quote }}
