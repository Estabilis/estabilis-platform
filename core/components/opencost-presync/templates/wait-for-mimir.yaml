apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-mimir
  namespace: opencost
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 60
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Mimir gateway..."
              until curl -sf {{ .Values.mimirGatewayUrl }} > /dev/null 2>&1; do
                echo "Mimir not ready yet — retrying in 5s..."
                sleep 5
              done
              echo "Mimir gateway is ready."
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
