# Grafana external ingress — per-app access control.
#
# Provisions a Traefik Middleware (ipAllowList) in the grafana namespace.
# The Grafana chart's own Ingress (enabled via overrides/grafana/values.yaml)
# references this Middleware through the annotation:
#   traefik.ingress.kubernetes.io/router.middlewares: grafana-grafana-ipallowlist@kubernetescrd
#
# Same 2-layer model used by loki-ingress:
#   Layer 1 (NSG): coarse, port-level — controls who reaches the Traefik LB at all
#   Layer 2 (this Middleware): fine, per-hostname — controls who reaches Grafana
#                              after the packet already passed the NSG
#
# A CSV of CIDRs is received from platform-root as helm.parameter (global.grafanaAllowedCidrs).
# Empty CSV means "no IP restriction at Middleware level" — NSG/L7 auth remain.

# Comma-separated CIDRs. Injected by platform-root from var.grafana_allowed_cidrs.
allowedCidrs: ""

# ipStrategy — only set when there is an L7 proxy in front of Traefik that adds
# X-Forwarded-For (e.g. Cloudflare, a WAF). With the Azure Load Balancer alone
# and Service.externalTrafficPolicy=Local (the platform default), the client's
# source IP reaches Traefik directly via TCP remoteAddr — no XFF required, and
# setting ipStrategy.depth>0 would make Traefik look for a header that doesn't
# exist, rejecting all requests as "unknown source". Leave 0/empty for the
# default AKS+Azure LB topology.
ipStrategyDepth: 0
