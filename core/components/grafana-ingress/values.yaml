# Grafana external ingress — ADR 0014 (multi-exposure model).
#
# Mirror of loki-ingress/values.yaml. Each entry in exposures becomes a K8s
# Ingress + Middlewares + Certificate. The Ingress points to the grafana
# Service (the grafana chart's own Ingress must stay disabled — this chart
# owns exposure concerns end-to-end).

# Injected by platform-root as a JSON string parameter.
exposuresJson: "{}"

# KV secret naming prefix for optional BasicAuth (not common for Grafana
# since it has its own auth, but kept for parity with loki-ingress).
kvSecretPrefix: "platform-grafana-ingress-auth"
