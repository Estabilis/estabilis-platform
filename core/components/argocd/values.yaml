# ArgoCD — self-managed configuration
# After bootstrap, ArgoCD manages itself via this values file.
# All configuration changes go here, not in Terraform.

commonLabels:
  estabilis.io/component: argocd

# Disable redis-secret-init hook — the Redis password is managed by
# Terraform (Key Vault) + ExternalSecret, not Helm hooks.
# Hooks cause foregroundDeletion deadlocks on ArgoCD self-manage sync.
redisSecretInit:
  enabled: false

global:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

configs:
  params:
    server.insecure: true
    timeout.reconciliation: "10s"
  rbac:
    policy.default: "role:readonly"
    scopes: "[groups]"
  cm:
    # Force a periodic hard reconcile (re-clone the repo even when
    # refs look unchanged). Upstream default is `0s` which disables
    # hard reconciliation entirely — the application-controller then
    # relies on the repo-server cache, which can go stale after a
    # fresh push (especially on multi-source apps with $values: the
    # `main` ref gets a new SHA but cached manifests stick around).
    # Observed 2026-04-24 on caas-backoffice-topazio-api: writeback
    # PR merged → `git show origin/main` pointed at the new values
    # → Application reported Synced+Healthy with the OLD Deployment
    # spec until `argocd.argoproj.io/refresh=hard` was annotated
    # manually. Setting a non-zero TTL makes that invalidation
    # happen automatically on a cadence (every 1h here — cheap, one
    # re-clone per app per hour, and bounds the worst-case stale
    # window).
    #
    # Better fix is an ADO-to-ArgoCD webhook (invalidate instantly
    # on push) — tracked as a follow-up issue, since it needs a
    # public ArgoCD ingress or tunnel + shared secret setup. 1h is
    # the backstop until that lands.
    timeout.hard.reconciliation: "1h"
    resource.customizations.ignoreDifferences.all: |
      jqPathExpressions:
        - .metadata.labels."estabilis.io/managed-by"
        # ADR 0005 L1 provenance — temporal annotations that change on
        # every promote. Ignored globally to prevent cosmetic OutOfSync.
        - .metadata.annotations."estabilis.io/built-at"
        - .metadata.annotations."estabilis.io/build-id"
        - .metadata.annotations."estabilis.io/git-revision"
        - .metadata.annotations."estabilis.io/git-source"
    # AKS `admissionsenforcer` field manager injects
    # `namespaceSelector.matchExpressions` on every Validating/Mutating
    # WebhookConfiguration to exclude managed-plane namespaces
    # (kubernetes.azure.com/managedby=aks, control-plane=true). The
    # field is owned by the AKS admission controller — git sources
    # declaring `namespaceSelector: {}` will show perpetual drift on
    # live clusters. Ignoring eliminates cosmetic OutOfSync without
    # affecting behavior (the matchExpressions are beneficial and
    # non-deterministically ordered, so declaring them in git would
    # just move the drift around).
    #
    # Safe on non-AKS clusters: jqPathExpressions match no webhooks
    # when admissionsenforcer doesn't exist, so the rule is a no-op
    # elsewhere.
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.namespaceSelector
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.namespaceSelector
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      if obj.status == nil or obj.status.phase == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for cluster initialization"
        return hs
      end
      if obj.status.phase == "Cluster in healthy state" then
        hs.status = "Healthy"
        hs.message = "Cluster is healthy"
      elseif obj.status.phase == "Setting up primary" or obj.status.phase == "Creating primary" then
        hs.status = "Progressing"
        hs.message = obj.status.phase
      else
        hs.status = "Progressing"
        hs.message = obj.status.phase or "Cluster not ready"
      end
      return hs
    resource.customizations.health.postgresql.cnpg.io_Database: |
      hs = {}
      if obj.status == nil or obj.status.applied == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for database reconciliation"
        return hs
      end
      if obj.status.applied then
        hs.status = "Healthy"
        hs.message = obj.status.message or "Database is ready"
      else
        hs.status = "Degraded"
        hs.message = obj.status.message or "Database reconciliation failed"
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
            if condition.type == "Ready" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for secret to sync"
      return hs

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 1
  args:
    - --status-processors=50
    - --operation-processors=25
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

  # Liveness probe override — disable during bootstrap windows.
  #
  # The argo-cd v9.x chart hardcodes the repo-server liveness probe
  # path as `/healthz?full=true` in its Deployment template; the
  # values schema only exposes `enabled`, `timeoutSeconds`,
  # `failureThreshold`, `initialDelaySeconds`, `periodSeconds`,
  # `successThreshold` — there is NO `httpPath`/`httpGet` key. An
  # earlier attempt (v0.17.3) to override `httpGet.path` via values
  # was silently ignored by the chart and did not take effect.
  #
  # The `?full=true` handler cascades through Redis + Git backends +
  # repo cache. On fresh clusters with no Applications configured
  # (bootstrap window), one of those sub-checks hangs and the handler
  # never returns. Every kubelet poll times out regardless of the
  # `timeoutSeconds` budget, kubelet SIGTERMs the container, restart
  # loop — CrashLoopBackOff (observed 2026-04-24 on cortex EKS seed,
  # MNG t3a.medium nodes).
  #
  # Only deterministic fix at the values layer: disable liveness.
  # Without it, kubelet does NOT kill the pod on health-check
  # failures. Readiness still runs and gates the pod's inclusion in
  # the `argocd-repo-server` Service; if the full-check hangs it
  # takes the pod temporarily out of rotation without restart.
  #
  # Once platform-root reconciles and real Applications are
  # configured, the `?full=true` handler completes normally, and
  # operators can re-enable liveness via downstream overrides if
  # desired. For now the safe default is disabled.
  livenessProbe:
    enabled: false
  readinessProbe:
    # Generous timeout so the stuck full-check during bootstrap
    # doesn't flap the pod in and out of the Service too noisily.
    timeoutSeconds: 10

redis:
  serviceAccount:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

notifications:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
