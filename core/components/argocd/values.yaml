# ArgoCD — self-managed configuration
# After bootstrap, ArgoCD manages itself via this values file.
# All configuration changes go here, not in Terraform.

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: argocd

global:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

configs:
  params:
    server.insecure: true
    timeout.reconciliation: "60s"
  rbac:
    policy.default: "role:readonly"
    scopes: "[groups]"
  cm:
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      if obj.status == nil or obj.status.phase == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for cluster initialization"
        return hs
      end
      if obj.status.phase == "Cluster in healthy state" then
        hs.status = "Healthy"
        hs.message = "Cluster is healthy"
      elseif obj.status.phase == "Setting up primary" or obj.status.phase == "Creating primary" then
        hs.status = "Progressing"
        hs.message = obj.status.phase
      else
        hs.status = "Progressing"
        hs.message = obj.status.phase or "Cluster not ready"
      end
      return hs
    resource.customizations.health.postgresql.cnpg.io_Database: |
      hs = {}
      if obj.status == nil or obj.status.applied == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for database reconciliation"
        return hs
      end
      if obj.status.applied then
        hs.status = "Healthy"
        hs.message = obj.status.message or "Database is ready"
      else
        hs.status = "Degraded"
        hs.message = obj.status.message or "Database reconciliation failed"
      end
      return hs

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 270m
      memory: 680Mi
    limits:
      cpu: 2
      memory: 2Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

redis:
  serviceAccount:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

notifications:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
