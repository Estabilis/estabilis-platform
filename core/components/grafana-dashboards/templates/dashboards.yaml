apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-traefik
  namespace: grafana
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Traefik
data:
  traefik.json: |
    {{ .Files.Get "files/traefik.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cert-manager
  namespace: grafana
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Cert-Manager
data:
  cert-manager.json: |
    {{ .Files.Get "files/cert-manager.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-velero
  namespace: grafana
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Velero
data:
  velero.json: |
    {{ .Files.Get "files/velero.json" | nindent 4 }}
