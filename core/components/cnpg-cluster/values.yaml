global:
  provider: ""                         # injected by platform-root (azure|aws|digitalocean)
  # Azure only:
  storageAccountName: ""
  cnpgBackupContainerName: "cnpg-backup"
  # AWS only:
  cnpgBackupBucketName: ""
  region: ""
  # DigitalOcean only: Spaces is S3-compatible, so the same
  # cnpgBackupBucketName is used with an explicit endpoint.
  spacesEndpoint: ""
  # Provider-agnostic:
  cnpgBackupRetentionDays: 7
  cnpgBackupSchedule: "0 2 * * *"
postgres:
  instances: 3

  # HOW HARD THE REPLICAS ARE KEPT APART.
  #
  # CNPG defaults podAntiAffinityType to "preferred" when the field is absent,
  # and the field WAS absent here. That is the wrong default for a three-node
  # HA Postgres and it fails quietly: the scheduler places replicas together
  # whenever spreading them is inconvenient, the Cluster reports three healthy
  # instances, and `instances: 3` reads like three-node redundancy while two of
  # them share a fate. Nothing surfaces it until the node those two are on goes
  # away.
  #
  # "required" converts that into a visible, recoverable state instead: the
  # instance that cannot be placed stays Pending, which the cluster autoscaler
  # answers by adding a node. A pod that is Pending because redundancy cannot
  # be satisfied is a better outcome than a pod that is Running and does not
  # provide it.
  #
  # Left at "preferred" so no existing deployment changes on upgrade. Set it to
  # "required" wherever `instances` is meant literally — and check that the
  # node pool can actually grow to that many, because required anti-affinity
  # with nowhere to go is Pending forever.
  antiAffinity:
    type: preferred
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  storage:
    # Data volume. WAL lives here too — there is no dedicated walStorage — so
    # this has to cover the database AND the WAL floor, not just the data.
    #
    # 4Gi is tight on purpose-built defaults and has proven insufficient in
    # practice: WAL alone occupies ~577Mi at rest under CNPG's defaults
    # (wal_keep_size 512MB), against ~46Mi of actual data on a platform
    # database. Raise it wherever the WAL budget below is raised.
    #
    # CNPG does not shrink volumes: "CloudNativePG does not support automated
    # volume shrinking, as it is a delicate operation that can lead to data
    # loss if performed incorrectly." Size up only when you mean it.
    size: 4Gi

  wal:
    # Upper bound on WAL a replication slot may pin.
    #
    # Postgres defaults max_slot_wal_keep_size to -1, meaning UNLIMITED: a
    # replica that dies or stalls leaves its slot holding WAL forever, and the
    # volume fills. On a CNPG cluster that is a closed trap — the disk fills,
    # the cluster reports "Not enough disk space", and it then cannot create
    # the replacement replica that would release the slot. Observed on a
    # production platform database, which had to be resized by hand to break
    # the deadlock.
    #
    # A finite value converts that into a recoverable failure: Postgres
    # invalidates the offending slot and the replica is rebuilt from scratch.
    # Losing a replica beats losing the cluster.
    #
    # 1GB fits the 4Gi default alongside max_wal_size (1GB) and wal_keep_size
    # (512MB). Raise it together with storage.size, never alone.
    maxSlotKeepSize: "1GB"

  # MORE LOGINS ON THE PLATFORM DATABASE, declared by the deployment.
  #
  # The cluster manages exactly one role, `grafana`, and it is a literal in
  # every provider template: nothing a values file could say would add a
  # second one. So a deployment that wants another tool to keep its data
  # here (a metrics ingester, a report writer) had no declarative path to
  # a role of its own. The options were to hand it Grafana's login, to run
  # CREATE ROLE by hand on the primary and remember that it happened, or to
  # stand up a whole second cluster for one schema.
  #
  # This list is appended verbatim to `spec.managed.roles`, so each entry
  # takes the CNPG role shape (name, ensure, login, passwordSecret, inRoles
  # and so on) and CNPG reconciles it exactly as it does `grafana`. The
  # passwordSecret must exist in the cluster's namespace; an ExternalSecret
  # next to the deployment's other database logins is the usual source.
  #
  # Databases are not declared here on purpose. CNPG has a Database CRD for
  # that, which any Application allowed into the namespace can carry, and it
  # names the owner role that this list creates.
  #
  # Empty by default: no existing deployment changes on upgrade.
  extraRoles: []
  # extraRoles:
  #   - name: reporting
  #     ensure: present
  #     login: true
  #     inherit: true
  #     superuser: false
  #     connectionLimit: -1
  #     passwordSecret:
  #       name: reporting-db-credentials
identity:
  cnpg:
    clientId: ""                       # Azure only (Workload Identity)
    roleArn: ""                        # AWS only (IRSA)

# DigitalOcean only. Spaces has no instance roles, so Barman authenticates
# with a static key — and the key is NOT a value here.
#
# The Secret is provisioned by the deployment's Terraform, out of band, for the
# same reason Velero's is: a key passed as a helm value is rendered in cleartext
# onto the Argo CD Application spec, readable by anyone with Argo CD access.
# This block only names it.
backupCredentialsSecret:
  name: cnpg-spaces-credentials
  accessKeyIdKey: ACCESS_KEY_ID
  secretAccessKeyKey: SECRET_ACCESS_KEY
