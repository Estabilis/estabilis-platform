{{- if eq .Values.global.provider "azure" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: cnpg-system
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  instances: {{ .Values.postgres.instances }}

  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
      memory: {{ .Values.postgres.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
      memory: {{ .Values.postgres.resources.limits.memory | quote }}

  inheritedMetadata:
    labels:
      azure.workload.identity/use: "true"

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1

  # Storage — WAL shares this volume (no dedicated walStorage). Sized via
  # values so a deployment whose WAL budget was raised can follow.
  storage:
    size: {{ .Values.postgres.storage.size }}

  # Bound the WAL a replication slot may pin. Postgres defaults this to -1
  # (unlimited), which lets a dead replica's slot fill the volume and deadlock
  # the cluster: no space means no replacement replica, and the slot is never
  # released. See values.yaml for the incident this came from.
  postgresql:
    parameters:
      max_slot_wal_keep_size: {{ .Values.postgres.wal.maxSlotKeepSize | quote }}

  # Bootstrap — creates the cluster from scratch
  bootstrap:
    initdb:
      database: app
      owner: app

  # Roles managed declaratively
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        inherit: true
        superuser: false
        connectionLimit: -1
        passwordSecret:
          name: grafana-db-credentials

  # Backup to Azure Blob Storage via WAL archiving
  backup:
    barmanObjectStore:
      destinationPath: "https://{{ .Values.global.storageAccountName }}.blob.core.windows.net/{{ .Values.global.cnpgBackupContainerName }}"
      azureCredentials:
        inheritFromAzureAD: true
    retentionPolicy: "{{ .Values.global.cnpgBackupRetentionDays }}d"

  affinity:
    podAntiAffinityType: {{ .Values.postgres.antiAffinity.type | quote }}
    tolerations:
      - key: "estabilis.io/workload-type"
        operator: "Equal"
        value: "platform"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["spot"]
        - weight: 10
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["regular"]
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-daily
  namespace: cnpg-system
spec:
  schedule: "{{ .Values.global.cnpgBackupSchedule }}"
  backupOwnerReference: self
  cluster:
    name: platform-postgres
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-postgres
  namespace: cnpg-system
  annotations:
    azure.workload.identity/client-id: "{{ .Values.identity.cnpg.clientId }}"
  labels:
    azure.workload.identity/use: "true"
{{- end }}
