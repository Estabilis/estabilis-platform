apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: cnpg-system
spec:
  instances: 1

  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
      memory: {{ .Values.postgres.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
      memory: {{ .Values.postgres.resources.limits.memory | quote }}

  inheritedMetadata:
    labels:
      azure.workload.identity/use: "true"

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6

  # Storage
  storage:
    size: 10Gi

  # Bootstrap — creates the cluster from scratch
  bootstrap:
    initdb:
      database: app
      owner: app

  # Roles managed declaratively (databases are provisioned by each component via kind: Database CRD)
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        inherit: true
        superuser: false
        connectionLimit: -1
        passwordSecret:
          name: grafana-db-credentials

  # Backup to Azure Blob Storage via WAL archiving
  backup:
    barmanObjectStore:
      destinationPath: "https://{{ .Values.global.storageAccountName }}.blob.core.windows.net/{{ .Values.global.cnpgBackupContainerName }}"
      azureCredentials:
        inheritFromAzureAD: true
    retentionPolicy: "{{ .Values.global.cnpgBackupRetentionDays }}d"

  affinity:
    tolerations:
      - key: "estabilis.io/workload-type"
        operator: "Equal"
        value: "platform"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["spot"]
        - weight: 10
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["regular"]
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-daily
  namespace: cnpg-system
spec:
  schedule: "{{ .Values.global.cnpgBackupSchedule }}"
  backupOwnerReference: self
  cluster:
    name: platform-postgres
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-postgres
  namespace: cnpg-system
  annotations:
    azure.workload.identity/client-id: "{{ .Values.identity.cnpg.clientId }}"
  labels:
    azure.workload.identity/use: "true"
