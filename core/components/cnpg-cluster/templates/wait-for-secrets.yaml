apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-secrets
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: wait-for-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: alpine/k8s:1.34.5
          command:
            - sh
            - -c
            - |
              echo "Waiting for ExternalSecrets to sync..."
              while true; do
                READY=true
                for secret in grafana-db-credentials; do
                  if ! kubectl get secret "$secret" -n cnpg-system > /dev/null 2>&1; then
                    echo "Secret $secret not found yet..."
                    READY=false
                  fi
                done
                if [ "$READY" = "true" ]; then
                  echo "All secrets are available."
                  exit 0
                fi
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-secrets
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-secrets
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-secrets
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: wait-for-secrets
    namespace: cnpg-system
roleRef:
  kind: Role
  name: wait-for-secrets
  apiGroup: rbac.authorization.k8s.io
