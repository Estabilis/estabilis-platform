{{- if eq .Values.global.provider "aws" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: cnpg-system
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  instances: {{ .Values.postgres.instances }}

  resources:
    requests:
      cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
      memory: {{ .Values.postgres.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
      memory: {{ .Values.postgres.resources.limits.memory | quote }}

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1

  # Storage — WAL shares this volume (no dedicated walStorage). Sized via
  # values so a deployment whose WAL budget was raised can follow.
  storage:
    size: {{ .Values.postgres.storage.size }}

  # Bound the WAL a replication slot may pin. Postgres defaults this to -1
  # (unlimited), which lets a dead replica's slot fill the volume and deadlock
  # the cluster: no space means no replacement replica, and the slot is never
  # released. See values.yaml for the incident this came from.
  postgresql:
    parameters:
      max_slot_wal_keep_size: {{ .Values.postgres.wal.maxSlotKeepSize | quote }}

  # Bootstrap — creates the cluster from scratch
  bootstrap:
    initdb:
      database: app
      owner: app

  # Roles managed declaratively — mirrors the Azure variant.
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        inherit: true
        superuser: false
        connectionLimit: -1
        passwordSecret:
          name: grafana-db-credentials

  # Backup to S3 via Barman Cloud.
  #
  # `s3Credentials.inheritFromIAMRole: true` makes CNPG rely on the IRSA
  # annotation set on the ServiceAccount below (no static keys). The IAM
  # policy is provisioned by providers/aws/iam.tf:
  #   - aws_iam_role.cnpg — trust scoped to cnpg-system:platform-postgres
  #   - aws_iam_role_policy.cnpg_s3 — s3:{Get,Put,Delete,List} on the
  #     cnpg_backup bucket + KMS permissions on aws_kms_key.s3_data.
  backup:
    barmanObjectStore:
      destinationPath: "s3://{{ .Values.global.cnpgBackupBucketName }}/platform-postgres"
      endpointURL: "https://s3.{{ .Values.global.region }}.amazonaws.com"
      s3Credentials:
        inheritFromIAMRole: true
    retentionPolicy: "{{ .Values.global.cnpgBackupRetentionDays }}d"

  # AWS EKS uses generic node pools — no provider-specific taint
  # tolerations. The `estabilis.io/workload-type: platform` toleration
  # matches the MNG node group annotations written by
  # providers/aws/eks.tf.
  affinity:
    podAntiAffinityType: {{ .Values.postgres.antiAffinity.type | quote }}
    tolerations:
      - key: "estabilis.io/workload-type"
        operator: "Equal"
        value: "platform"
        effect: "NoSchedule"
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["spot"]
        - weight: 10
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["regular"]
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-daily
  namespace: cnpg-system
spec:
  schedule: "{{ .Values.global.cnpgBackupSchedule }}"
  backupOwnerReference: self
  cluster:
    name: platform-postgres
---
# IRSA ServiceAccount consumed by the cnpg Cluster above via its
# `inheritFromIAMRole` backup credentials path. The role ARN is
# injected as a helm parameter from the platform-root cnpg.yaml
# template (identity.cnpg.roleArn → aws_iam_role.cnpg.arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-postgres
  namespace: cnpg-system
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.identity.cnpg.roleArn }}"
{{- end }}
