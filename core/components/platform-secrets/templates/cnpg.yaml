{{- /* Grafana's database password, placed where CloudNativePG can read it.
       Gated on grafanaEnabled and not on cnpg: the secret IS grafana's, and a
       CNPG with no Grafana has nothing to do with it. */ -}}
{{- if .Values.grafanaEnabled }}
# grafana-db-credentials in cnpg-system — CNPG managed role secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: cnpg-system
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
    template:
      # NO `type` HERE, AND THAT IS A DELIBERATE REVERSAL.
      #
      # CNPG's docs say "The Secret must be of type kubernetes.io/basic-auth".
      # v0.88.0 set it for conformance and it BROKE THE UPGRADE PATH: a Secret's
      # type is immutable, External Secrets does not recreate to change it, and
      # every deployment with an existing Opaque Secret stopped syncing with
      #
      #   unable to update secret grafana-db-credentials: Secret is invalid:
      #   type: Invalid value: "kubernetes.io/basic-auth": field is immutable
      #
      # measured on a live cluster, not predicted. The v0.88.0 note claimed ESO
      # "recreates the Secret once". It does not — it fails and leaves the
      # ExternalSecret Ready=False.
      #
      # Opaque IS accepted by CNPG 1.29; the password applies from one. So the
      # type buys conformance with a documented contract at the cost of a manual
      # step on every existing deployment, and the contract is not being
      # enforced. Not worth it. Revisit only alongside a documented migration —
      # delete the Secret, let ESO recreate — never as a silent template change.
      metadata:
        labels:
          # WITHOUT THIS THE PASSWORD IS APPLIED LATE, NOT NEVER, and the
          # difference matters for what it costs to diagnose.
          #
          # "Label the Secret with cnpg.io/reload: true ... Password changes in
          # labeled Secrets are applied immediately, while changes in unlabeled
          # Secrets are only applied at a subsequent reconciliation, for example
          # when the operator refreshes its internal cache."
          #
          # Observed on a fresh bootstrap: the ExternalSecret resolved, the
          # Secret existed with the right keys, the Cluster reported the role
          # as `reconciled` — and `pg_authid.rolpassword` was NULL. Nothing in
          # any status said otherwise; `managedRolesStatus.passwordStatus` was
          # missing its `resourceVersion` field, which is the only place the
          # difference shows. A forced reconcile applied it in seconds.
          #
          # It matters most on ROTATION. On first bootstrap the wait is
          # invisible because nothing is connecting yet. Rotate the password
          # later and the new value sits unapplied while Grafana keeps using
          # the old one, until whenever the operator next refreshes.
          cnpg.io/reload: "true"
      data:
        username: grafana
        password: |-
          {{`{{ .password }}`}}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaDbPassword | quote }}
        nullBytePolicy: Ignore
{{- end }}
