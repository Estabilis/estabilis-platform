{{- if .Values.acrLoginServer }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cred-acr-charts
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: cred-acr-charts
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: helm
        enableOCI: "true"
        url: {{ .Values.acrLoginServer | quote }}
        username: argocd-pull
        password: |-
          {{`{{ .token }}`}}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.kvSecrets.acrArgocdToken | quote }}
{{- end }}
