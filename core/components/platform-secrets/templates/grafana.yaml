{{- if .Values.grafanaEnabled }}
# grafana-db-credentials in grafana — Grafana reads GF_DATABASE_PASSWORD env var
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaDbPassword | quote }}
        nullBytePolicy: Ignore
---
# grafana-admin-credentials — persistent admin password from Key Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaAdminPassword | quote }}
        nullBytePolicy: Ignore
---
{{- /* grafana-llm-provisioning ConfigMap is rendered unconditionally.
      The Grafana pod's `extraConfigmapMounts` in
      core/components/grafana-stack/grafana-values.yaml declares this CM
      with no `optional: true` flag, so a missing CM breaks the volume
      mount and the pod fails to start. The plugin auto-enables
      (`auto_enabled: true` in grafana-llm-app's plugin.json) and runs
      idle when no OPENAI_API_KEY env var is injected — handled
      gracefully because the matching `envFromSecrets` entry has
      `optional: true`.

      grafana-llm-credentials ExternalSecret below stays gated on
      `openaiApiKeyEnabled` because its source secret in AWS SM /
      Azure KV is created only when var.openai_api_key != "" (TF count
      gate). Without that gate, ESO reconciles forever with "Secret
      does not exist". The flag is computed by
      providers/{aws,azure}/platform-outputs.tf and flows through the
      platform-infrastructure ConfigMap → platform-root → this chart's
      helm parameters. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-llm-provisioning
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
data:
  llm.yaml: |
    apiVersion: 1
    apps:
      - type: grafana-llm-app
        disabled: false
        jsonData:
          openAI:
            provider: openai
            url: https://api.openai.com
        secureJsonData:
          openAIKey: ${OPENAI_API_KEY}
{{- if .Values.openaiApiKeyEnabled }}
---
# grafana-llm-credentials — OpenAI API key for Grafana LLM plugin
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-llm-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.kvSecrets.openaiApiKey | quote }}
        nullBytePolicy: Ignore
{{- end }}
{{- end }}
