# grafana-db-credentials in grafana — Grafana reads GF_DATABASE_PASSWORD env var
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaDbPassword | quote }}
---
# grafana-admin-credentials — persistent admin password from Key Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaAdminPassword | quote }}
{{- /* grafana-llm-credentials + grafana-llm-provisioning render only when
      the operator populated `var.openai_api_key` in TF (which is what
      writes the source secret to AWS Secrets Manager / Azure Key Vault).
      Without this gate, deployments that don't use Grafana LLM see
      continuous "Secret does not exist" reconcile errors because the
      ExternalSecret points at a path that was never created (TF gate
      `count = var.openai_api_key != "" ? 1 : 0`). The flag is
      computed by providers/{aws,azure}/platform-outputs.tf and flows
      through the platform-infrastructure ConfigMap → platform-root →
      this chart's helm parameters. */}}
{{- if .Values.openaiApiKeyEnabled }}
---
# grafana-llm-credentials — OpenAI API key for Grafana LLM plugin
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-llm-credentials
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.kvSecrets.openaiApiKey | quote }}
---
# ConfigMap for Grafana LLM plugin provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-llm-provisioning
  namespace: grafana
  {{- include "estabilis.metadata" . | nindent 2 }}
data:
  llm.yaml: |
    apiVersion: 1
    apps:
      - type: grafana-llm-app
        disabled: false
        jsonData:
          openAI:
            provider: openai
            url: https://api.openai.com
        secureJsonData:
          openAIKey: ${OPENAI_API_KEY}
{{- end }}
