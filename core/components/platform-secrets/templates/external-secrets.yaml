# grafana-db-credentials in cnpg-system — CNPG uses key "password" to create the role
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaDbPassword | quote }}
---
# grafana-db-credentials in grafana — Grafana reads GF_DATABASE_PASSWORD env var
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.kvSecrets.grafanaDbPassword | quote }}
---
