# Config repo credentials — only created when configRepoUrl is set
configRepoUrl: ""

# Client GitOps repo credentials — only created when clientGitopsRepoUrl is set
clientGitopsRepoUrl: ""

# ACR OCI credentials — only created when acrLoginServer is set
acrLoginServer: ""

# Opencost ExternalSecrets — only created when opencostEnabled is true.
# Set to false on deployments that disable opencost via
# components.opencost: false in platform-root overrides, so the chart
# does not attempt to render ExternalSecrets into a non-existent
# opencost namespace. The platform-root template passes this flag from
# its own `components.opencost` value.
opencostEnabled: true

# Grafana ExternalSecrets — only created when grafanaEnabled is true.
#
# Covers grafana-db-credentials and grafana-admin-credentials in the `grafana`
# namespace AND grafana-db-credentials in `cnpg-system`, which is the same
# password placed where CloudNativePG can create the database user.
#
# Default true so existing deployments render exactly as before. The
# platform-root template passes this from its own `components.grafana`, the
# same way it already does for opencost — without it a deployment that turned
# Grafana off still emitted three ExternalSecrets for keys the store does not
# hold, and sat permanently Degraded on a component it does not run.
grafanaEnabled: true

# argocd-redis ExternalSecret — only created when argocdRedisEnabled is true.
#
# Default true, which is every deployment whose Redis password lives in the
# secret store. Set false where the password is provisioned some other way —
# on DigitalOcean the platform tier's Terraform generates it directly as a
# Kubernetes Secret, and with this on there would be two sources of truth for
# the same value: the ExternalSecret uses creationPolicy Merge, so it does not
# fight for the object, but it does overwrite the `auth` field the moment the
# store holds a different one, restarting Redis and every ArgoCD component
# that authenticates to it.
argocdRedisEnabled: true

# GitHub App credentials Secret is wired by the estabilis-platform
# `github-app-credentials` module (providers/aws/github-app.tf). When
# present, it covers all repos under the configured org via ArgoCD's
# `argocd.argoproj.io/secret-type: repo-creds` prefix match, so the
# per-repo PAT ExternalSecrets (repo-config-client, repo-client-gitops)
# below are redundant AND actively harmful: `type: repository` secrets
# outrank `type: repo-creds` and break auth when their `password` field
# holds a placeholder.
githubAppEnabled: false

# OpenAI API key — gates grafana-llm-credentials ExternalSecret +
# grafana-llm-provisioning ConfigMap. Default false because most deployments
# don't enable Grafana LLM. The platform-root template flips this to true
# when providers/{aws,azure}/platform-outputs.tf detects var.openai_api_key
# is non-empty (which is also the gate for creating the source secret in
# AWS Secrets Manager / Azure Key Vault).
openaiApiKeyEnabled: false

# Key Vault secret names — must exist in Key Vault before platform deploy
kvSecrets:
  configRepoToken: "platform-config-repo-token"
  clientGitopsRepoToken: "platform-client-gitops-repo-token"
  grafanaDbPassword: "platform-grafana-db-password"
  grafanaAdminPassword: "platform-grafana-admin-password"
  openaiApiKey: "platform-openai-api-key"
  opencostServiceKey: "platform-opencost-service-key"
  opencostCloudIntegration: "platform-opencost-cloud-integration"
  acrArgocdToken: "platform-acr-argocd-token"
  argocdRedisPassword: "platform-argocd-redis-password"
