# Velero — Kubernetes backup and restore
# https://velero.io

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: velero

configuration:
  features: EnableCSI

  backupStorageLocation:
    - name: default
      bucket: ""

  volumeSnapshotLocation:
    - name: default

  defaultSnapshotMoveData: false
  defaultVolumesToFsBackup: false

upgradeCRDs: false

credentials:
  useSecret: false

serviceAccount:
  server:
    create: true

schedules:
  platform-daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h0m0s
      snapshotVolumes: true
      includedNamespaces:
        - argocd
        - cert-manager
        - cnpg-system
        - external-dns
        - external-secrets
        - grafana
        - kyverno
        - opencost
        - traefik
        - trivy-system
        - velero

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi
