# Velero — Kubernetes backup and restore
# https://velero.io

commonLabels:
  estabilis.io/component: velero

configuration:
  features: EnableCSI

  backupStorageLocation:
    - name: default
      bucket: ""

  volumeSnapshotLocation:
    - name: default

  defaultSnapshotMoveData: false
  defaultVolumesToFsBackup: false

upgradeCRDs: false

kubectl:
  image:
    repository: alpine/k8s
    tag: "1.32.3"

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsUser: 65534
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

credentials:
  useSecret: false

serviceAccount:
  server:
    create: true

schedules:
  platform-daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h0m0s
      snapshotVolumes: true
      includedNamespaces:
        - argocd
        - cert-manager
        - cnpg-system
        - external-dns
        - external-secrets
        - grafana
        - kyverno
        - opencost
        - traefik
        - trivy-system
        - velero

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

initContainers:
  - name: velero-plugin-for-azure
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
