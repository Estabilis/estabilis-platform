# OpenCost — Kubernetes cost monitoring
# https://www.opencost.io

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: opencost

opencost:
  exporter:
    cloudProviderApiKey: ""
    # Startup probe — opencost blocks on Azure RateCard API during init.
    # Port 9003 only opens after the full init (~35s+), so we need a
    # generous startup window to avoid unnecessary restarts and backoff.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 30
    livenessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 20
      failureThreshold: 3
    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    securityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  carbonCost:
    enabled: true
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: "http://grafana-mimir-gateway.grafana.svc.cluster.local/prometheus"
  ui:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
