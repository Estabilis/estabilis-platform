# OpenCost — Kubernetes cost monitoring
# https://www.opencost.io

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: opencost

opencost:
  exporter:
    cloudProviderApiKey: ""
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
  carbonCost:
    enabled: true
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: "http://grafana-mimir-gateway.grafana.svc.cluster.local/prometheus"

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

ui:
  enabled: true
