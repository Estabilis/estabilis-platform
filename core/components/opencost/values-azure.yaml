# Azure-specific OpenCost values
# Loaded in addition to values.yaml when provider=azure

opencost:
  exporter:
    extraEnv:
      AZURE_SUBSCRIPTION_ID: ""   # injected via ArgoCD helm.parameters
      AZURE_TENANT_ID: ""         # injected via ArgoCD helm.parameters
      AZURE_OFFER_ID: ""          # injected via ArgoCD helm.parameters (auto-detected from subscription quotaId)
    extraVolumeMounts:
      - mountPath: /var/secrets
        name: azure-service-key
        readOnly: true
  cloudCost:
    enabled: true
  cloudIntegrationSecret: opencost-cloud-integration

extraVolumes:
  - name: azure-service-key
    secret:
      secretName: opencost-azure-service-key

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
