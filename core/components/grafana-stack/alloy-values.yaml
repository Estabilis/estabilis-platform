commonLabels:
  estabilis.io/component: alloy

alloy:
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  clustering:
    enabled: true
  mounts:
    extra:
      - name: tmp
        mountPath: /tmp
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  configMap:
    content: |
      // Discover Kubernetes pods for log collection
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      // Forward logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://grafana-loki.grafana.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // Scrape metrics from Kubernetes pods
      discovery.kubernetes "metric_pods" {
        role = "pod"
      }

      discovery.relabel "metric_pods" {
        targets = discovery.kubernetes.metric_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }

        // Build __address__ as <pod_ip>:<annotation_port>. The previous
        // form ("${1}:$0" with only the port annotation as source label)
        // resolved to "<port>:<port>" because both backrefs pointed at
        // the same captured value, leaving the address unreachable.
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
          action        = "replace"
        }

        // Honor prometheus.io/path annotation when present.
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          action        = "replace"
        }
      }

      prometheus.scrape "pod_metrics" {
        targets    = discovery.relabel.metric_pods.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        clustering {
          enabled = true
        }
      }

      // =====================================================================
      // Platform component scrape jobs
      // =====================================================================

      // --- ArgoCD (pod discovery) ---
      discovery.kubernetes "argocd" {
        role = "pod"
        namespaces {
          names = ["argocd"]
        }
      }

      // Application Controller — metrics on port 8082
      discovery.relabel "argocd_app_controller" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "application-controller"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8082"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_app_controller" {
        targets    = discovery.relabel.argocd_app_controller.output
        forward_to = [prometheus.relabel.argocd_app_controller.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_app_controller" {
        rule {
          target_label = "job"
          replacement  = "argocd-application-controller"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Server — metrics on port 8083
      discovery.relabel "argocd_server" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "server"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8083"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_server" {
        targets    = discovery.relabel.argocd_server.output
        forward_to = [prometheus.relabel.argocd_server.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_server" {
        rule {
          target_label = "job"
          replacement  = "argocd-server"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Repo Server — metrics on port 8084
      discovery.relabel "argocd_repo_server" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "repo-server"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8084"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_repo_server" {
        targets    = discovery.relabel.argocd_repo_server.output
        forward_to = [prometheus.relabel.argocd_repo_server.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_repo_server" {
        rule {
          target_label = "job"
          replacement  = "argocd-repo-server"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Notifications Controller — metrics on port 9001
      discovery.relabel "argocd_notifications" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "notifications-controller"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9001"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_notifications" {
        targets    = discovery.relabel.argocd_notifications.output
        forward_to = [prometheus.relabel.argocd_notifications.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_notifications" {
        rule {
          target_label = "job"
          replacement  = "argocd-notifications-controller"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // ApplicationSet Controller — metrics on port 8080
      discovery.relabel "argocd_applicationset" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "applicationset-controller"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8080"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_applicationset" {
        targets    = discovery.relabel.argocd_applicationset.output
        forward_to = [prometheus.relabel.argocd_applicationset.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "argocd_applicationset" {
        rule {
          target_label = "job"
          replacement  = "argocd-applicationset-controller"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- cert-manager ---
      prometheus.scrape "cert_manager" {
        targets = [{
          __address__ = "cert-manager.cert-manager.svc.cluster.local:9402",
        }]
        forward_to = [prometheus.relabel.cert_manager.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cert_manager" {
        rule {
          target_label = "job"
          replacement  = "cert-manager"
        }
        rule {
          target_label = "namespace"
          replacement  = "cert-manager"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Traefik ---
      discovery.kubernetes "traefik" {
        role = "pod"
        namespaces {
          names = ["traefik"]
        }
      }

      discovery.relabel "traefik" {
        targets = discovery.kubernetes.traefik.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "traefik"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9100"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "traefik" {
        targets    = discovery.relabel.traefik.output
        forward_to = [prometheus.relabel.traefik.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "traefik" {
        rule {
          target_label = "job"
          replacement  = "traefik"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Velero ---
      prometheus.scrape "velero" {
        targets = [{
          __address__ = "velero.velero.svc.cluster.local:8085",
        }]
        forward_to = [prometheus.relabel.velero.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "velero" {
        rule {
          target_label = "job"
          replacement  = "velero"
        }
        rule {
          target_label = "namespace"
          replacement  = "velero"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Kyverno (all controllers via pod discovery) ---
      discovery.kubernetes "kyverno" {
        role = "pod"
        namespaces {
          names = ["kyverno"]
        }
      }

      discovery.relabel "kyverno" {
        targets = discovery.kubernetes.kyverno.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
          action        = "keep"
          regex         = "kyverno"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8000"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      prometheus.scrape "kyverno" {
        targets         = discovery.relabel.kyverno.output
        forward_to      = [prometheus.relabel.kyverno.receiver]
        scrape_interval = "30s"
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "kyverno" {
        rule {
          target_label = "job"
          replacement  = "kyverno"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- OpenCost ---
      prometheus.scrape "opencost" {
        targets = [{
          __address__ = "opencost.opencost.svc.cluster.local:9003",
        }]
        forward_to = [prometheus.relabel.opencost.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "opencost" {
        rule {
          target_label = "job"
          replacement  = "opencost"
        }
        rule {
          target_label = "namespace"
          replacement  = "opencost"
        }
        rule {
          source_labels = ["exported_instance"]
          regex         = "(.+)"
          target_label  = "instance"
        }
        rule {
          action = "labeldrop"
          regex  = "exported_instance"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- kube-state-metrics ---
      prometheus.scrape "kube_state_metrics" {
        targets = [{
          __address__ = "kube-state-metrics.kube-state-metrics.svc.cluster.local:8080",
        }]
        forward_to = [prometheus.relabel.kube_state_metrics.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "kube_state_metrics" {
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
        // NOTE: do NOT add a `target_label = "namespace"` rewrite here.
        // KSM emits metrics ABOUT OTHER PODS — each carries the real
        // namespace of the reported pod (e.g. namespace="app-foo").
        // Overwriting the namespace label destroys that information,
        // breaking KRR / Goldilocks / Grafana dashboards filtering by
        // namespace / Mimir alerts on `kube_*{namespace="X"}` / cost-
        // allocation tooling. Originating bug: commit d4eed7a
        // (2026-03-13). Fixed: 2026-04-30.
        rule {
          action = "labeldrop"
          regex  = "instance"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- External Secrets Operator ---
      // The svc `external-secrets-metrics` referenced previously does NOT
      // exist on this chart version — only `external-secrets-webhook` is
      // shipped. Switched to pod-discovery so we scrape the controller
      // pod (which exposes /metrics on container port 8080) directly.
      discovery.kubernetes "external_secrets" {
        role = "pod"
        namespaces {
          names = ["external-secrets"]
        }
      }

      discovery.relabel "external_secrets" {
        targets = discovery.kubernetes.external_secrets.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "external-secrets"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8080"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "external_secrets" {
        targets    = discovery.relabel.external_secrets.output
        forward_to = [prometheus.relabel.external_secrets.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "external_secrets" {
        rule {
          target_label = "job"
          replacement  = "external-secrets"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Node Exporter ---
      discovery.kubernetes "node_exporter" {
        role = "pod"
        namespaces {
          names = ["node-exporter"]
        }
      }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.node_exporter.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "prometheus-node-exporter"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9100"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "node_exporter" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [prometheus.relabel.node_exporter.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "node_exporter" {
        rule {
          target_label = "job"
          replacement  = "node-exporter"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- CNPG (operator + postgres instances) ---
      discovery.kubernetes "cnpg" {
        role = "pod"
        namespaces {
          names = ["cnpg-system"]
        }
      }

      // CNPG Operator — metrics on port 8080
      discovery.relabel "cnpg_operator" {
        targets = discovery.kubernetes.cnpg.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "cloudnative-pg"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8080"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "cnpg_operator" {
        targets    = discovery.relabel.cnpg_operator.output
        forward_to = [prometheus.relabel.cnpg_operator.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cnpg_operator" {
        rule {
          target_label = "job"
          replacement  = "cnpg-operator"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // CNPG Postgres instances — metrics on port 9187
      discovery.relabel "cnpg_instances" {
        targets = discovery.kubernetes.cnpg.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
          action        = "keep"
          regex         = ".+"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9187"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
          target_label  = "cnpg_cluster"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_role"]
          target_label  = "role"
        }
      }

      prometheus.scrape "cnpg_instances" {
        targets    = discovery.relabel.cnpg_instances.output
        forward_to = [prometheus.relabel.cnpg_instances.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cnpg_instances" {
        rule {
          target_label = "job"
          replacement  = "cnpg-cluster"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Kubelet / cAdvisor ---
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // Kubelet metrics
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc.cluster.local:443"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          replacement   = "/api/v1/nodes/$1/proxy/metrics"
        }
      }

      prometheus.scrape "kubelet" {
        targets      = discovery.relabel.kubelet.output
        scheme       = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.relabel.kubelet.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "kubelet" {
        rule {
          target_label = "job"
          replacement  = "kubelet"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // cAdvisor metrics (container_*)
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc.cluster.local:443"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
        }
      }

      prometheus.scrape "cadvisor" {
        targets      = discovery.relabel.cadvisor.output
        scheme       = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        forward_to = [prometheus.relabel.cadvisor.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "cadvisor" {
        rule {
          target_label = "job"
          replacement  = "cadvisor"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Trivy Operator ---
      prometheus.scrape "trivy_operator" {
        targets = [{
          __address__ = "trivy-operator.trivy-system.svc.cluster.local:8080",
        }]
        forward_to = [prometheus.relabel.trivy_operator.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "trivy_operator" {
        rule {
          target_label = "job"
          replacement  = "trivy-operator"
        }
        rule {
          target_label = "namespace"
          replacement  = "trivy-system"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Trivy Server (vulnerability DB ClientServer) ---
      prometheus.scrape "trivy_server" {
        targets = [{
          __address__ = "trivy-service.trivy-system.svc.cluster.local:4954",
        }]
        forward_to = [prometheus.relabel.trivy_server.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "trivy_server" {
        rule {
          target_label = "job"
          replacement  = "trivy-server"
        }
        rule {
          target_label = "namespace"
          replacement  = "trivy-system"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Vault (HashiCorp) ---
      // Requires `unauthenticated_metrics_access = true` in the vault
      // listener telemetry block — set in the vault helm values upstream.
      // Without it the /v1/sys/metrics endpoint returns 403.
      // Targets the active-leader service (only the leader serves real
      // metrics on the standalone path; HA standbys forward request to
      // leader which then 403s on the auth check).
      prometheus.scrape "vault" {
        targets = [{
          __address__   = "vault-active.vault.svc.cluster.local:8200",
          __metrics_path__ = "/v1/sys/metrics",
        }]
        params      = { format = ["prometheus"] }
        forward_to  = [prometheus.relabel.vault.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "vault" {
        rule {
          target_label = "job"
          replacement  = "vault"
        }
        rule {
          target_label = "namespace"
          replacement  = "vault"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // =====================================================================
      // Self-monitoring — grafana stack scrapes itself
      // =====================================================================
      // Each component in the stack exposes its own /metrics. Without
      // self-scrape we have no visibility into mimir ingestion errors,
      // alloy WAL backlog, loki query latency, etc. Self-monitoring is
      // the standard pattern; see grafana-agent-mixin / mimir-mixin
      // upstream dashboards which require these targets.

      // --- Mimir self ---
      // mimir-distributed exposes /metrics on container port 8080 across
      // every component (distributor/ingester/querier/etc.). Pod
      // discovery + label-based filter keeps the scrape generic; new
      // components added by chart upgrades are picked up automatically.
      discovery.kubernetes "grafana_ns" {
        role = "pod"
        namespaces {
          names = ["grafana"]
        }
      }

      discovery.relabel "mimir_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "mimir"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8080"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
      }

      prometheus.scrape "mimir_self" {
        targets    = discovery.relabel.mimir_self.output
        forward_to = [prometheus.relabel.mimir_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "mimir_self" {
        rule {
          target_label = "job"
          replacement  = "mimir"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Loki self ---
      discovery.relabel "loki_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "loki"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:3100"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "loki_self" {
        targets    = discovery.relabel.loki_self.output
        forward_to = [prometheus.relabel.loki_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "loki_self" {
        rule {
          target_label = "job"
          replacement  = "loki"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Grafana self ---
      // Grafana metrics are on port 3000 path /metrics. Restricted to
      // pods labeled `app.kubernetes.io/name=grafana` to avoid scraping
      // sidecars (sc-dashboard, sc-datasources).
      discovery.relabel "grafana_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "grafana"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:3000"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "grafana_self" {
        targets    = discovery.relabel.grafana_self.output
        forward_to = [prometheus.relabel.grafana_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "grafana_self" {
        rule {
          target_label = "job"
          replacement  = "grafana"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Tempo self ---
      discovery.relabel "tempo_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "tempo"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:3100"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "tempo_self" {
        targets    = discovery.relabel.tempo_self.output
        forward_to = [prometheus.relabel.tempo_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "tempo_self" {
        rule {
          target_label = "job"
          replacement  = "tempo"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Pyroscope self ---
      discovery.relabel "pyroscope_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "pyroscope"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:4040"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "pyroscope_self" {
        targets    = discovery.relabel.pyroscope_self.output
        forward_to = [prometheus.relabel.pyroscope_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "pyroscope_self" {
        rule {
          target_label = "job"
          replacement  = "pyroscope"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Alloy self ---
      // Each alloy pod scrapes itself (clustering NOT enabled here so
      // every replica reports its own state — for fleet-wide alloy
      // diagnostics we WANT all replicas' samples in Mimir).
      discovery.relabel "alloy_self" {
        targets = discovery.kubernetes.grafana_ns.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "alloy"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:12345"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "alloy_self" {
        targets    = discovery.relabel.alloy_self.output
        forward_to = [prometheus.relabel.alloy_self.receiver]
        clustering {
          enabled = true
        }
      }

      prometheus.relabel "alloy_self" {
        rule {
          target_label = "job"
          replacement  = "alloy"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // =====================================================================
      // OTLP collection — traces → Tempo, metrics → Mimir, logs → Loki
      // =====================================================================
      // The receiver previously routed traces only; metrics and logs were
      // dropped silently. Workloads emitting OTLP metrics (e.g. Beyla,
      // OpenTelemetry-instrumented apps) now reach Mimir, and OTLP logs
      // reach Loki.

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces  = [otelcol.processor.batch.traces.input]
          metrics = [otelcol.processor.batch.metrics.input]
          logs    = [otelcol.processor.batch.logs.input]
        }
      }

      // --- Traces → Tempo ---
      otelcol.processor.batch "traces" {
        timeout         = "5s"
        send_batch_size = 1024
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "grafana-tempo.grafana.svc.cluster.local:4317"
          tls {
            insecure             = true
            insecure_skip_verify = true
          }
        }
      }

      // --- Metrics → Mimir (via existing prometheus.remote_write "mimir") ---
      otelcol.processor.batch "metrics" {
        timeout         = "5s"
        send_batch_size = 1024
        output {
          metrics = [otelcol.exporter.prometheus.mimir.input]
        }
      }

      otelcol.exporter.prometheus "mimir" {
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Logs → Loki (via existing loki.write "default") ---
      otelcol.processor.batch "logs" {
        timeout         = "5s"
        send_batch_size = 1024
        output {
          logs = [otelcol.exporter.loki.default.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // =====================================================================
      // Continuous profiling (eBPF → Pyroscope)
      // =====================================================================

      // Discover pods on the same node for eBPF profiling
      discovery.kubernetes "profile_pods" {
        role = "pod"
        selectors {
          field = "spec.nodeName=" + sys.env("HOSTNAME")
          role  = "pod"
        }
      }

      discovery.relabel "profile_pods" {
        targets = discovery.kubernetes.profile_pods.targets

        rule {
          action        = "replace"
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "service_name"
        }
      }

      // Collect CPU profiles via eBPF (no application changes needed)
      pyroscope.ebpf "local" {
        targets    = discovery.relabel.profile_pods.output
        forward_to = [pyroscope.write.default.receiver]
      }

      // Forward profiles to Pyroscope
      pyroscope.write "default" {
        endpoint {
          url = "http://grafana-pyroscope.grafana.svc.cluster.local:4040"
        }
      }

      // Forward metrics to Mimir
      prometheus.remote_write "mimir" {
        external_labels = {
          cluster = "estabilis",
        }
        endpoint {
          url = "http://grafana-mimir-gateway.grafana.svc.cluster.local/api/v1/push"
        }
      }

      // ====================================================================
      // Downstream extension point — `alloy.configMap.extraContent`
      //
      // The Alloy chart applies `tpl` to this entire content string at
      // render time (see chart's templates/configmap.yaml). Any River
      // components supplied by an override values file under the
      // `alloy.configMap.extraContent` key are appended below — they can
      // reference upstream-defined exporters/receivers by ID (e.g.
      // `forward_to = [prometheus.remote_write.mimir.receiver]`).
      //
      // Typical use cases: prometheus.exporter.* embeds (blackbox, snmp,
      // unix), extra discovery.kubernetes blocks for non-default service
      // discovery, prometheus.scrape jobs targeting endpoints that
      // pod-annotation discovery cannot reach (external URLs, headless
      // services, multi-target exporters that need relabel rewrites).
      //
      // Default = empty → byte-identical rendered ConfigMap to the
      // pre-hook version, so existing clients see zero behavior change
      // until they opt in. See CHANGELOG [0.49.1].
      // ====================================================================
      {{- with .Values.alloy.configMap.extraContent }}
      {{ tpl . $ | trim }}
      {{- end }}

controller:
  type: daemonset
  hostPID: true
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

# `controller.tolerations`, NOT top-level. The alloy chart nests its workload
# settings under `controller` — unlike loki, mimir, tempo, grafana and
# pyroscope, whose charts read `tolerations` at the root, which is why the same
# stanza is correct in their files and was wrong here.
#
# A top-level `tolerations` on this chart is accepted by Helm, written into no
# object, and silently ignored. Measured on a live cluster: the DaemonSet's
# tolerations list was EMPTY while this file had one.
#
# It cost nothing for as long as no node carried a taint. The first tainted
# node is where it surfaces — as a DaemonSet quietly having one fewer pod than
# the cluster has nodes, which is not an error anywhere.
controller:
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

serviceAccount:
  create: true

configReloader:
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 128Mi

rbac:
  create: false
