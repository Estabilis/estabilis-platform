alloy:
  configMap:
    content: |
      // Discover Kubernetes pods for log collection
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      // Forward logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://grafana-loki.grafana.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // Scrape metrics from Kubernetes pods
      discovery.kubernetes "metric_pods" {
        role = "pod"
      }

      discovery.relabel "metric_pods" {
        targets = discovery.kubernetes.metric_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port"]
          target_label  = "__address__"
          regex         = "(.+)"
          replacement   = "${1}:$0"
          action        = "replace"
        }
      }

      prometheus.scrape "pod_metrics" {
        targets    = discovery.relabel.metric_pods.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // =====================================================================
      // Platform component scrape jobs
      // =====================================================================

      // --- ArgoCD (pod discovery) ---
      discovery.kubernetes "argocd" {
        role = "pod"
        namespaces {
          names = ["argocd"]
        }
      }

      // Application Controller — metrics on port 8082
      discovery.relabel "argocd_app_controller" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "application-controller"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8082"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_app_controller" {
        targets    = discovery.relabel.argocd_app_controller.output
        forward_to = [prometheus.relabel.argocd_app_controller.receiver]
      }

      prometheus.relabel "argocd_app_controller" {
        rule {
          target_label = "job"
          replacement  = "argocd-application-controller"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Server — metrics on port 8083
      discovery.relabel "argocd_server" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "server"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8083"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_server" {
        targets    = discovery.relabel.argocd_server.output
        forward_to = [prometheus.relabel.argocd_server.receiver]
      }

      prometheus.relabel "argocd_server" {
        rule {
          target_label = "job"
          replacement  = "argocd-server"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Repo Server — metrics on port 8084
      discovery.relabel "argocd_repo_server" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "repo-server"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:8084"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_repo_server" {
        targets    = discovery.relabel.argocd_repo_server.output
        forward_to = [prometheus.relabel.argocd_repo_server.receiver]
      }

      prometheus.relabel "argocd_repo_server" {
        rule {
          target_label = "job"
          replacement  = "argocd-repo-server"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Notifications Controller — metrics on port 9001
      discovery.relabel "argocd_notifications" {
        targets = discovery.kubernetes.argocd.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          action        = "keep"
          regex         = "notifications-controller"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9001"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "argocd_notifications" {
        targets    = discovery.relabel.argocd_notifications.output
        forward_to = [prometheus.relabel.argocd_notifications.receiver]
      }

      prometheus.relabel "argocd_notifications" {
        rule {
          target_label = "job"
          replacement  = "argocd-notifications-controller"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- cert-manager ---
      prometheus.scrape "cert_manager" {
        targets = [{
          __address__ = "cert-manager.cert-manager.svc.cluster.local:9402",
        }]
        forward_to = [prometheus.relabel.cert_manager.receiver]
      }

      prometheus.relabel "cert_manager" {
        rule {
          target_label = "job"
          replacement  = "cert-manager"
        }
        rule {
          target_label = "namespace"
          replacement  = "cert-manager"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Traefik ---
      discovery.kubernetes "traefik" {
        role = "pod"
        namespaces {
          names = ["traefik"]
        }
      }

      discovery.relabel "traefik" {
        targets = discovery.kubernetes.traefik.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "traefik"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          target_label  = "__address__"
          replacement   = "$1:9100"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "traefik" {
        targets    = discovery.relabel.traefik.output
        forward_to = [prometheus.relabel.traefik.receiver]
      }

      prometheus.relabel "traefik" {
        rule {
          target_label = "job"
          replacement  = "traefik"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Velero ---
      prometheus.scrape "velero" {
        targets = [{
          __address__ = "velero.velero.svc.cluster.local:8085",
        }]
        forward_to = [prometheus.relabel.velero.receiver]
      }

      prometheus.relabel "velero" {
        rule {
          target_label = "job"
          replacement  = "velero"
        }
        rule {
          target_label = "namespace"
          replacement  = "velero"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- Kyverno (all controllers) ---
      discovery.kubernetes "kyverno" {
        role = "endpoints"
        namespaces {
          names = ["kyverno"]
        }
      }

      discovery.relabel "kyverno" {
        targets = discovery.kubernetes.kyverno.targets

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          action        = "keep"
          regex         = "kyverno-admission-controller-metrics|kyverno-background-controller-metrics|kyverno-cleanup-controller-metrics|kyverno-reports-controller-metrics"
        }

        rule {
          source_labels = ["__meta_kubernetes_endpoint_port_name"]
          action        = "keep"
          regex         = "metrics"
        }

        rule {
          source_labels = ["__meta_kubernetes_service_name"]
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      prometheus.scrape "kyverno" {
        targets         = discovery.relabel.kyverno.output
        forward_to      = [prometheus.relabel.kyverno.receiver]
        scrape_interval = "30s"
        job_name        = "kyverno"
      }

      prometheus.relabel "kyverno" {
        rule {
          target_label = "job"
          replacement  = "kyverno"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- OpenCost ---
      prometheus.scrape "opencost" {
        targets = [{
          __address__ = "opencost.opencost.svc.cluster.local:9003",
        }]
        forward_to = [prometheus.relabel.opencost.receiver]
      }

      prometheus.relabel "opencost" {
        rule {
          target_label = "job"
          replacement  = "opencost"
        }
        rule {
          target_label = "namespace"
          replacement  = "opencost"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- kube-state-metrics ---
      prometheus.scrape "kube_state_metrics" {
        targets = [{
          __address__ = "kube-state-metrics.kube-state-metrics.svc.cluster.local:8080",
        }]
        forward_to = [prometheus.relabel.kube_state_metrics.receiver]
      }

      prometheus.relabel "kube_state_metrics" {
        rule {
          target_label = "job"
          replacement  = "kube-state-metrics"
        }
        rule {
          target_label = "namespace"
          replacement  = "kube-state-metrics"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // --- External Secrets Operator ---
      prometheus.scrape "external_secrets" {
        targets = [{
          __address__ = "external-secrets-metrics.external-secrets.svc.cluster.local:8080",
        }]
        forward_to = [prometheus.relabel.external_secrets.receiver]
      }

      prometheus.relabel "external_secrets" {
        rule {
          target_label = "job"
          replacement  = "external-secrets"
        }
        rule {
          target_label = "namespace"
          replacement  = "external-secrets"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      // Forward metrics to Mimir
      prometheus.remote_write "mimir" {
        external_labels = {
          cluster = "estabilis",
        }
        endpoint {
          url = "http://grafana-mimir-gateway.grafana.svc.cluster.local/api/v1/push"
        }
      }

controller:
  type: daemonset
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

serviceAccount:
  create: true
