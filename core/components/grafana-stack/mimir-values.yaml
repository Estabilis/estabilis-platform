# Single-binary mode for v0-alpha (homolog/dev)
# Scale to distributed in production via downstream override

minio:
  enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["spot"]
        - weight: 10
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["regular"]
