# Mimir distributed — minimal for v0-alpha
# Scale up in production via downstream override

commonLabels:
  estabilis.io/component: mimir

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

mimir:
  structuredConfig:
    usage_stats:
      enabled: false
    # Disable Kafka-based ingest (chart v6 default)
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        zone_awareness_enabled: false
        replication_factor: 1
    store_gateway:
      sharding_ring:
        zone_awareness_enabled: false
        replication_factor: 1
    ruler:
      alertmanager_url: http://grafana-mimir-alertmanager-headless.grafana.svc.cluster.local:8080/alertmanager
      rule_path: /data/ruler
    ruler_storage:
      backend: local
      local:
        directory: /data/rules
    alertmanager:
      data_dir: /data/am-data
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/am-store
    limits:
      compactor_blocks_retention_period: "2160h"  # 90 days
      max_label_names_per_series: 60              # AKS nodes carry ~47 labels via kube_node_labels
      # Per-tenant active series cap. Default 150,000 was too low for a
      # cluster with KSM + kyverno + cnpg + alloy + 6-component grafana
      # self-monitoring — alloy logs on cortex prd 2026-04-30 showed:
      #   "non-recoverable error ... err='per-user series limit of
      #    150000 exceeded (err-mimir-max-series-per-user)' ... 2000
      #    samples failed"
      # New series (kyverno_*, cnpg_*) were silently dropped; old indexed
      # labels stayed visible in /api/v1/label/__name__/values but
      # `count({__name__=~\"kyverno_.*\"})` returned 0 instances.
      # Bumped to 500k — covers KSM (~50k) + kyverno (~30k) + cnpg
      # (~10k) + alloy/mimir/loki self-monitoring (~80k) + cortex apps
      # (~20k) with 4× headroom for high-cardinality metrics like
      # alloy's per-target histograms.
      max_global_series_per_user: 500000

# Disable embedded minio (we use cloud storage)
minio:
  enabled: false

# Disable Kafka
kafka:
  enabled: false

# Alertmanager — receives alerts from ruler, visible in Grafana
alertmanager:
  enabled: true
  replicas: 1
  persistentVolume:
    size: 4Gi
  fallbackConfig: |
    route:
      receiver: 'default'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: 'default'
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

# Ruler — evaluates alerting rules against Mimir data
ruler:
  enabled: true
  replicas: 1
  # Rules are loaded from ConfigMap mimir-alerting-rules (created by mimir-rules component)
  # mounted at /data/rules/anonymous/ — matches ruler_storage.filesystem.dir + tenant ID
  extraVolumes:
    - name: alerting-rules
      configMap:
        name: mimir-alerting-rules
        optional: true
  extraVolumeMounts:
    - name: alerting-rules
      mountPath: /data/rules/anonymous
      readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

ruler_querier:
  enabled: false
ruler_query_frontend:
  enabled: false
ruler_query_scheduler:
  enabled: false
overrides_exporter:
  enabled: false
rollout_operator:
  enabled: false
smoke_test:
  enabled: false
continuous_test:
  enabled: false
metaMonitoring:
  enabled: false

# Disable caches (lightweight setup)
chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false

# Minimal replicas — 1 each for v0-alpha
distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

ingester:
  # HA write path: 2 replicas + hard topology spread.
  #
  # Promoted from cortex prd override 2026-05-17 after cortex hml hit the
  # same failure prd had on 2026-05-01: the chart's stock 512Mi memory
  # limit isn't enough to load the WAL on restart. With ~395 segments
  # accumulated, the ingester OOMKills mid-replay before /ready returns
  # 200, restart loops forever, and the Mimir Application sits at
  # Synced+Progressing indefinitely.
  #
  # 2Gi limit covers WAL replay storms with ~3× headroom over the
  # observed peak (krr 14d --use-oomkill-data put peak ~1Gi on a fleet
  # carrying 500k active series under replay churn). Request stays at
  # 384Mi so Karpenter reserves the steady-state working set accurately
  # without over-allocating.
  #
  # CPU limit bumped 200m → 500m so WAL segments load in 2-3s each
  # instead of 5-9s — shrinks the readiness-probe failure window.
  replicas: 2
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 2Gi
  # `DoNotSchedule` (hard) — the chart default is `ScheduleAnyway` (soft),
  # which lets the scheduler bin-pack both ingester pods onto the same
  # node under capacity pressure. With replication_factor: 2, co-location
  # defeats the entire HA story: one node failure takes both ingesters
  # down. cortex prd 2026-05-01 cascaded exactly this: bin-pack →
  # OOMKill → corrupted WAL → split-brain → forced node drain.
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_frontend:
  replicas: 1
  # 2026-05-03 incident — cortex prd query-frontend OOMKilled in a loop
  # (5 restarts in 24h, exit 137). Symptom on Grafana side: ArgoCD /
  # Operational / Overview dashboard's "gRPC Requests Handled" panel
  # (and any panel with similar grouping cardinality) returned HTTP 502
  # Bad Gateway from the mimir gateway nginx because the query-frontend
  # connection died mid-response. Live diagnosis: 3817 grpc_server_handled_total
  # series with 17 grpc_service x 83 grpc_method x 17 grpc_code distinct
  # values (~1411 effective combinations × 360 timestamps for a 6h
  # query_range step=60), parsing/aggregation buffer in query-frontend
  # peaked above 128Mi. Idle steady-state was ~27Mi, so the limit was
  # only adequate for trivial queries.
  #
  # Fix: bump memory limit 128Mi -> 384Mi (3× over former limit, ~14×
  # over idle steady state). Request bumped 64Mi -> 128Mi so the
  # scheduler reserves the realistic working-set rather than the idle
  # baseline. Cpu unchanged — query-frontend isn't CPU-bound on these
  # workloads.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 384Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

compactor:
  replicas: 1
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"
