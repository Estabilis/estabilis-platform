# Mimir distributed — minimal for v0-alpha
# Scale up in production via downstream override

mimir:
  structuredConfig:
    # Disable Kafka-based ingest (chart v6 default)
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        zone_awareness_enabled: false
        replication_factor: 1
    store_gateway:
      sharding_ring:
        zone_awareness_enabled: false
        replication_factor: 1
    limits:
      compactor_blocks_retention_period: "2160h"  # 90 days

# Disable embedded minio (we use cloud storage)
minio:
  enabled: false

# Disable Kafka
kafka:
  enabled: false

# Disable components not needed for v0-alpha
alertmanager:
  enabled: false
ruler:
  enabled: false
ruler_querier:
  enabled: false
ruler_query_frontend:
  enabled: false
ruler_query_scheduler:
  enabled: false
overrides_exporter:
  enabled: false
rollout_operator:
  enabled: false
smoke_test:
  enabled: false
continuous_test:
  enabled: false
metaMonitoring:
  enabled: false

# Disable caches (lightweight setup)
chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false

# Minimal replicas — 1 each for v0-alpha
distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_scheduler:
  replicas: 1
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

compactor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"
