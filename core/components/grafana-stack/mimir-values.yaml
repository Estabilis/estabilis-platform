# Mimir distributed — minimal for v0-alpha
# Scale up in production via downstream override

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: mimir

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

mimir:
  structuredConfig:
    usage_stats:
      enabled: false
    # Disable Kafka-based ingest (chart v6 default)
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        zone_awareness_enabled: false
        replication_factor: 1
    store_gateway:
      sharding_ring:
        zone_awareness_enabled: false
        replication_factor: 1
    ruler:
      alertmanager_url: http://grafana-mimir-alertmanager-headless.grafana.svc.cluster.local:8080/alertmanager
      rule_path: /data/ruler
    ruler_storage:
      backend: local
      local:
        directory: /data/rules
    alertmanager:
      data_dir: /data/am-data
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/am-store
    limits:
      compactor_blocks_retention_period: "2160h"  # 90 days
      max_label_names_per_series: 60              # AKS nodes carry ~47 labels via kube_node_labels

# Disable embedded minio (we use cloud storage)
minio:
  enabled: false

# Disable Kafka
kafka:
  enabled: false

# Alertmanager — receives alerts from ruler, visible in Grafana
alertmanager:
  enabled: true
  replicas: 1
  persistentVolume:
    size: 4Gi
  fallbackConfig: |
    route:
      receiver: 'default'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: 'default'
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

# Ruler — evaluates alerting rules against Mimir data
ruler:
  enabled: true
  replicas: 1
  # Rules are loaded from ConfigMap mimir-alerting-rules (created by mimir-rules component)
  # mounted at /data/rules/anonymous/ — matches ruler_storage.filesystem.dir + tenant ID
  extraVolumes:
    - name: alerting-rules
      configMap:
        name: mimir-alerting-rules
        optional: true
  extraVolumeMounts:
    - name: alerting-rules
      mountPath: /data/rules/anonymous
      readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

ruler_querier:
  enabled: false
ruler_query_frontend:
  enabled: false
ruler_query_scheduler:
  enabled: false
overrides_exporter:
  enabled: false
rollout_operator:
  enabled: false
smoke_test:
  enabled: false
continuous_test:
  enabled: false
metaMonitoring:
  enabled: false

# Disable caches (lightweight setup)
chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false

# Minimal replicas — 1 each for v0-alpha
distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

query_scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

compactor:
  replicas: 1
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"

gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"
