# Grafana Tempo — distributed tracing backend
# https://grafana.com/docs/tempo/latest/

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: tempo

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

tempo:
  retention: 720h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  securityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]

persistence:
  enabled: true
  size: 4Gi

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

