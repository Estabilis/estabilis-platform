# Grafana Tempo — distributed tracing backend
# https://grafana.com/docs/tempo/latest/

commonLabels:
  estabilis.io/component: tempo

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

tempo:
  retention: 720h
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://grafana-mimir-gateway.grafana.svc.cluster.local/api/v1/push"
    # local-blocks processor is required by Grafana Drilldown/Traces (TraceQL
    # metrics queries). flush_to_storage=true persists the metric blocks to
    # the trace backend so queries survive ingester restarts.
    processor:
      local_blocks:
        flush_to_storage: true
  # Tempo standard overrides — chart >=1.16 templatizes this path; the legacy
  # extraConfig.overrides.defaults block on chart 1.10 was a no-op because the
  # template hard-coded the processor list when metricsGenerator.enabled=true.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 3Gi
  securityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]

persistence:
  enabled: true
  size: 4Gi

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]
