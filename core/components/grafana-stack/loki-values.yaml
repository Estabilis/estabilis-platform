commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: loki

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  rulerConfig:
    storage:
      type: local
      local:
        directory: /tmp/loki/rules
  limits_config:
    retention_period: 720h
    ingestion_rate_mb: 30
    per_stream_rate_limit: 10MB
  compactor:
    retention_enabled: true

# --- Disable components that default to enabled ---

# Canary — health check pod that generates synthetic logs, not needed
lokiCanary:
  enabled: false

# Self-monitoring — creates ServiceMonitors expecting Prometheus, conflicts with Mimir
selfMonitoring:
  enabled: false
  grafanaAgent:
    installOperator: false

# Test framework — not needed
test:
  enabled: false

# Caches
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# --- Single-binary deployment ---
singleBinary:
  replicas: 1
  persistence:
    size: 4Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  tolerations:
    - key: "estabilis.io/workload-type"
      operator: "Equal"
      value: "platform"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["spot"]
        - weight: 10
          preference:
            matchExpressions:
              - key: "estabilis.io/pool-type"
                operator: In
                values: ["regular"]

sidecar:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

minio:
  enabled: false

gateway:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
