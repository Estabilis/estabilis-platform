deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    azure:
      accountName: ""          # injected via ArgoCD helm.parameters: global.storageAccountName
      containerName: loki-chunks
      endpointSuffix: blob.core.windows.net
      useFederatedToken: true
      useManagedIdentityToAuthenticate: true
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 10Gi

minio:
  enabled: false

gateway:
  enabled: false

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/use: "true"
    azure.workload.identity/client-id: ""  # injected via ArgoCD helm.parameters: identity.loki.clientId

podLabels:
  azure.workload.identity/use: "true"

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
