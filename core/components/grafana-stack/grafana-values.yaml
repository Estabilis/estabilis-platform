commonLabels:
  estabilis.io/component: grafana

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://grafana-mimir-gateway.grafana.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          timeInterval: 30s
          httpHeaderName1: X-Scope-OrgID
          # Surface mimir-rules groups under Alerting -> Alert rules
          # natively (no datasource view toggle needed in the UI).
          manageAlerts: true
          manageAlertingRules: true
          # Tell Grafana this Prometheus is Mimir-flavored so it uses
          # the Mimir Ruler config API path (/config/v1/rules/<ns>)
          # instead of vanilla Prometheus paths. Validated 2026-05-03 via
          # /api/datasources/uid/mimir/health -> features.rulerApiEnabled=true.
          # Lets the Alerting -> Alert rules UI create/edit "Data source-
          # managed" rules directly in Mimir Ruler (S3-backed on AWS,
          # filesystem on Azure).
          # CAVEAT: editing one of the platform rules shipped via the
          # mimir-rules ConfigMap from the UI creates drift between git
          # (ConfigMap) and the Ruler backend. Convention: rules that
          # should live in git stay in the ConfigMap; ad-hoc/experimental
          # rules are created via UI.
          prometheusType: Mimir
          prometheusVersion: "3.0.1"
        secureJsonData:
          httpHeaderValue1: anonymous
      - name: Mimir Alertmanager
        uid: mimir-alertmanager
        type: alertmanager
        access: proxy
        # NOTE: URL is the gateway ROOT, not /alertmanager. The Grafana
        # proxy calls `<url>/api/v1/alerts` for tenant config; with the
        # /alertmanager suffix the call hit the deprecated AM v1 API and
        # got HTTP 410 (validated 2026-05-03 in cortex prd). Root URL
        # routes correctly to Mimir's multitenant config endpoint.
        url: http://grafana-mimir-gateway.grafana.svc.cluster.local
        jsonData:
          implementation: mimir
          httpHeaderName1: X-Scope-OrgID
          # Allow Grafana UI to surface this AM's contact points + routing
          # tree, and accept Grafana-managed alert routing through this AM
          # (mimir-alertmanager-config chart's grafana-ngalert-external-am
          # Job sets alertmanagersChoice=external + external_alertmanager_uid
          # = mimir-alertmanager so Grafana auto-discovers this datasource
          # as the dispatch target).
          manageAlerts: true
          handleGrafanaManagedAlerts: true
        secureJsonData:
          httpHeaderValue1: anonymous
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://grafana-loki.grafana.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        # Chart tempo>=1.20 defaults tempo.server.http_listen_port to 3200
        # (was 3100 on chart 1.10). Service follows the binary port.
        url: http://grafana-tempo.grafana.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: mimir
          tracesToProfiles:
            datasourceUid: pyroscope
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://grafana-pyroscope.grafana.svc.cluster.local:4040

plugins:
  - grafana-llm-app
  - grafana-lokioperational-app
  - grafana-github-datasource
  - yesoreyeram-infinity-datasource

sidecar:
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

extraConfigmapMounts:
  - name: llm-provisioning
    mountPath: /etc/grafana/provisioning/plugins/llm.yaml
    subPath: llm.yaml
    configMap: grafana-llm-provisioning
    readOnly: true

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

extraVolumes:
  - name: tmp
    emptyDir: {}

persistence:
  enabled: false

grafana.ini:
  database:
    type: postgres
    host: platform-postgres-rw.cnpg-system.svc.cluster.local:5432
    name: grafana
    user: grafana
    ssl_mode: require
    # password injected via GF_DATABASE_PASSWORD env var

envFromSecrets:
  - name: grafana-db-credentials
    optional: false
  - name: grafana-llm-credentials
    optional: true

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true

testFramework:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
