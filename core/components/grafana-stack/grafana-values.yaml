commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: grafana

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://grafana-mimir-gateway.grafana.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          timeInterval: 30s
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: anonymous
      - name: Mimir Alertmanager
        uid: mimir-alertmanager
        type: alertmanager
        access: proxy
        url: http://grafana-mimir-gateway.grafana.svc.cluster.local/alertmanager
        jsonData:
          implementation: mimir
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: anonymous
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://grafana-loki.grafana.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://grafana-tempo.grafana.svc.cluster.local:3100
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: mimir
          tracesToProfiles:
            datasourceUid: pyroscope
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://grafana-pyroscope.grafana.svc.cluster.local:4040

plugins:
  - grafana-llm-app

sidecar:
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

extraVolumes:
  - name: tmp
    emptyDir: {}

persistence:
  enabled: false

grafana.ini:
  database:
    type: postgres
    host: platform-postgres-rw.cnpg-system.svc.cluster.local:5432
    name: grafana
    user: grafana
    ssl_mode: require
    # password injected via GF_DATABASE_PASSWORD env var

envFromSecrets:
  - name: grafana-db-credentials
    optional: false

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true

testFramework:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
