datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://grafana-mimir-nginx.grafana.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        type: loki
        access: proxy
        url: http://grafana-loki-gateway.grafana.svc.cluster.local
        jsonData:
          maxLines: 1000

sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

persistence:
  enabled: false

database:
  type: postgres
  host: platform-postgres-rw.cnpg-system.svc.cluster.local
  port: 5432
  name: grafana
  user: grafana
  # password injected via environment variable from external secret

env:
  GF_DATABASE_SSL_MODE: require

extraEnvFrom:
  - secretRef:
      name: grafana-db-credentials

adminUser: admin
# Admin password should be provided via external secret
# adminPassword: set-via-external-secret

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["spot"]
      - weight: 10
        preference:
          matchExpressions:
            - key: "estabilis.io/pool-type"
              operator: In
              values: ["regular"]

serviceAccount:
  create: true

testFramework:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
