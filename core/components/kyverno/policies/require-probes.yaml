apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Probes
    policies.kyverno.io/description: >-
      Requires all Deployment containers to define liveness and readiness probes.
      Probes enable Kubernetes to detect unhealthy pods and route traffic only to
      healthy instances.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-probes-deployment
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: "All containers must define livenessProbe and readinessProbe."
        foreach:
          - list: "request.object.spec.template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.livenessProbe || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.readinessProbe || '' }}"
                    operator: Equals
                    value: ""
