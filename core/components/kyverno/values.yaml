commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: kyverno

# ---------------------------------------------------------------------------
# Global namespace exclusion via webhook namespaceSelector
# Namespaces with label kyverno.io/exclude=true are completely ignored
# by Kyverno — no admission, no validation, no mutation.
#
# Permanently excluded:
#   kube-system, kyverno, node-exporter, trivy-system, grafana
# Temporarily excluded (pending validation):
#   argocd, cert-manager, cnpg-system, external-dns, external-secrets,
#   kube-state-metrics, opencost, traefik, velero
# ---------------------------------------------------------------------------
config:
  webhooks:
    - namespaceSelector:
        matchExpressions:
          - key: kyverno.io/exclude
            operator: DoesNotExist

admissionController:
  replicas: 1
  container:
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  metricsService:
    create: true

backgroundController:
  enabled: true
  backgroundScanInterval: 5m
  container:
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  metricsService:
    create: true
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["create", "update", "delete", "get", "list"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies"]
          verbs: ["create", "update", "delete", "get", "list"]
        - apiGroups: [""]
          resources: ["resourcequotas", "limitranges"]
          verbs: ["create", "update", "delete", "get", "list"]

cleanupController:
  enabled: true
  container:
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi
  metricsService:
    create: true

reportsController:
  enabled: true
  container:
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  metricsService:
    create: true

grafana:
  enabled: false
