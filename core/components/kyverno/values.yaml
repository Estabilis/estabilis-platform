commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: kyverno

admissionController:
  replicas: 1
  metricsService:
    create: true

backgroundController:
  enabled: true
  metricsService:
    create: true
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["create", "update", "delete", "get", "list"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies"]
          verbs: ["create", "update", "delete", "get", "list"]
        - apiGroups: [""]
          resources: ["resourcequotas", "limitranges"]
          verbs: ["create", "update", "delete", "get", "list"]

cleanupController:
  enabled: true
  metricsService:
    create: true

reportsController:
  enabled: true
  metricsService:
    create: true

grafana:
  enabled: false
