{{- if .Values.allowedCidrs }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-ingress-ipallowlist
  namespace: grafana
spec:
  ipAllowList:
    sourceRange:
      {{- range splitList "," .Values.allowedCidrs }}
      - {{ trim . | quote }}
      {{- end }}
    ipStrategy:
      depth: 1
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-ingress-auth
  namespace: grafana
spec:
  basicAuth:
    secret: loki-ingress-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-external-tls
  namespace: grafana
spec:
  secretName: loki-external-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - loki.{{ .Values.global.domain }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-external
  namespace: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki.{{ .Values.global.domain }}`) && PathPrefix(`/loki/api/v1/push`)
      kind: Rule
      middlewares:
        {{- if .Values.allowedCidrs }}
        - name: loki-ingress-ipallowlist
        {{- end }}
        - name: loki-ingress-auth
      services:
        - name: grafana-loki-gateway
          port: 80
  tls:
    secretName: loki-external-tls
---
# ExternalSecret for BasicAuth credentials — pull htpasswd from Key Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-ingress-auth
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: loki-ingress-auth
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: {{ .Values.kvSecrets.lokiIngressAuth | quote }}
