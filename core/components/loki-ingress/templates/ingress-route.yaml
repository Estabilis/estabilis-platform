apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-ingress-auth
  namespace: grafana
spec:
  basicAuth:
    secret: loki-ingress-auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-external-tls
  namespace: grafana
spec:
  secretName: loki-external-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - loki.{{ .Values.global.domain }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-external
  namespace: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`loki.{{ .Values.global.domain }}`) && PathPrefix(`/loki/api/v1/push`)
      kind: Rule
      middlewares:
        - name: loki-ingress-auth
      services:
        - name: grafana-loki-gateway
          port: 80
  tls:
    secretName: loki-external-tls
