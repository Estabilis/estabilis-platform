# =============================================================================
# grafana namespace
# Components: grafana, loki, mimir, tempo, alloy
# =============================================================================
{{- if .Values.policies.grafana.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
  namespace: grafana
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from traefik (ingress controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    # Allow internal comms (loki/mimir/tempo/alloy/grafana)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
    # Allow from all namespaces (alloy receives metrics from all pods)
    - from:
        - namespaceSelector: {}
  egress:
{{ include "network-policies.dns-egress" . }}
    # PostgreSQL to cnpg-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
    # Azure storage private endpoints (HTTPS)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Alloy needs egress to ALL namespaces for log collection
    - to:
        - namespaceSelector: {}
{{- end }}
---
# =============================================================================
# argocd namespace
# Needs broad egress: github, chart registries, kubernetes API
# =============================================================================
{{- if .Values.policies.argocd.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (github, chart registries, kubernetes API)
    - to: []
{{- end }}
---
# =============================================================================
# cert-manager namespace
# Needs broad egress: Let's Encrypt ACME, Azure DNS API
# Ingress: webhook from API server
# =============================================================================
{{- if (index .Values.policies "cert-manager").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cert-manager
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook callbacks from API server (validating/mutating admission)
    - ports:
        - protocol: TCP
          port: 10250
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (Let's Encrypt ACME, Azure DNS API)
    - to: []
{{- end }}
---
# =============================================================================
# external-secrets namespace
# Needs broad egress: Azure Key Vault
# Ingress: webhook from API server, metrics scraping from grafana
# =============================================================================
{{- if (index .Values.policies "external-secrets").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-secrets
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook callbacks from API server (validating admission)
    - ports:
        - protocol: TCP
          port: 10250
    # Metrics scraping from grafana namespace (Alloy)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (Azure Key Vault)
    - to: []
{{- end }}
---
# =============================================================================
# external-dns namespace
# Needs broad egress: Azure DNS API
# =============================================================================
{{- if (index .Values.policies "external-dns").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-dns
  namespace: external-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (Azure DNS API)
    - to: []
{{- end }}
---
# =============================================================================
# cnpg-system namespace
# Needs broad egress: Azure Blob for WAL backup
# Ingress: webhook from API server, postgres clients from grafana
# =============================================================================
{{- if (index .Values.policies "cnpg-system").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-system
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Webhook callbacks from API server (mutating/validating admission)
    - ports:
        - protocol: TCP
          port: 9443
    # PostgreSQL clients from grafana namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
      ports:
        - protocol: TCP
          port: 5432
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (Azure Blob for WAL backup)
    - to: []
{{- end }}
---
# =============================================================================
# kyverno namespace
# Needs broad egress: kubernetes API for webhooks
# Ingress: all (webhook callbacks from API server)
# =============================================================================
{{- if .Values.policies.kyverno.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kyverno
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # All ingress (webhook callbacks from API server, source IP unpredictable)
    - from: []
  egress:
{{ include "network-policies.dns-egress" . }}
    # All egress (kubernetes API for webhooks)
    - to: []
{{- end }}
---
# =============================================================================
# traefik namespace
# Egress: DNS, grafana namespace (backend routing)
# Ingress: all (Azure Load Balancer, external traffic)
# =============================================================================
{{- if .Values.policies.traefik.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # All ingress (Azure Load Balancer, external traffic)
    - from: []
  egress:
{{ include "network-policies.dns-egress" . }}
    # Backend routing to grafana namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
{{- end }}
---
