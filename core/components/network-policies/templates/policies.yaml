# policy-reporter namespace
# Kyverno sub-component: reads policy results, exposes metrics
# Ingress: grafana namespace (Alloy metrics scraping)
# Egress: DNS + kubernetes API
# =============================================================================
{{- if (index .Values.policies "policy-reporter").enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-policy-reporter
  namespace: policy-reporter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Alloy scraping metrics from grafana namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
  egress:
{{ include "network-policies.dns-egress" . }}
    # Kubernetes API (read policy results)
    - to: []
{{- end }}