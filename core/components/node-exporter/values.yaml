# Prometheus Node Exporter — node-level OS metrics
# https://github.com/prometheus/node_exporter

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: node-exporter

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi