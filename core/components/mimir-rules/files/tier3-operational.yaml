groups:
- name: platform-operational
  interval: 1m
  rules:
  - alert: DeploymentReplicasMismatch
    # Covers core platform + client app namespaces (app-*). Tier 3 (info)
    # signal — useful for spotting partial-outage states (e.g. 1/3 ready)
    # that don't trigger the all-down Tier 1 alerts.
    expr: kube_deployment_spec_replicas{namespace=~"argocd|grafana|cert-manager|kyverno|external-secrets|external-dns|traefik|velero|aws-load-balancer-controller|karpenter|vault|app-.*"} != kube_deployment_status_available_replicas
    for: 15m
    labels:
      severity: info
      tier: '3'
      component: '{{ $labels.namespace }}'
    annotations:
      summary: Deployment {{ $labels.deployment }} has replica mismatch
      description: Deployment {{ $labels.deployment }} in {{ $labels.namespace }} wants {{ $labels.spec_replicas }} replicas but only has {{ $labels.available_replicas }} available for 15 minutes.

  - alert: HighCpuThrottling
    # Covers core platform + client app namespaces (app-*). Throttling
    # >50% sustained means the workload is wedged on its CPU limit.
    expr: rate(container_cpu_cfs_throttled_periods_total{namespace=~"argocd|grafana|cert-manager|kyverno|cnpg-system|external-secrets|external-dns|aws-load-balancer-controller|karpenter|vault|velero|app-.*", container!=""}[5m]) / clamp_min(rate(container_cpu_cfs_periods_total[5m]), 1) > 0.5
    for: 15m
    labels:
      severity: info
      tier: '3'
      component: '{{ $labels.namespace }}'
    annotations:
      summary: Container {{ $labels.container }} is heavily CPU throttled
      description: Container {{ $labels.container }} in pod {{ $labels.pod }} ({{ $labels.namespace }}) is throttled {{ $value | humanizePercentage }} of the time. Consider increasing CPU limits.

  - alert: KyvernoPolicyViolation
    # Kyverno renamed kyverno_policy_results -> kyverno_policy_results_total
    # in v1.10 (Counter convention). The old name returns 0 series, so the
    # alert was silently dead. Validated against live cortex prd: the
    # _total form returns ~150 active series.
    expr: increase(kyverno_policy_results_total{rule_result="fail"}[1h]) > 100
    for: 15m
    labels:
      severity: info
      tier: '3'
      component: kyverno
    annotations:
      summary: High rate of Kyverno policy violations
      description: More than 100 policy violations in the last hour. Policy {{ $labels.policy_name }} rule {{ $labels.rule_name }}.

  - alert: NodeDiskPressure
    expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
    for: 5m
    labels:
      severity: info
      tier: '3'
      component: infrastructure
    annotations:
      summary: Node {{ $labels.node }} has disk pressure
      description: Node {{ $labels.node }} is under disk pressure. Pods may be evicted.

  - alert: NodeMemoryPressure
    expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
    for: 5m
    labels:
      severity: info
      tier: '3'
      component: infrastructure
    annotations:
      summary: Node {{ $labels.node }} has memory pressure
      description: Node {{ $labels.node }} is under memory pressure. Pods may be evicted.

  - alert: PvcGrowthVelocity
    # Predicts whether each PVC will run out of space in the next 6 hours
    # based on the recent 6h growth rate. Complements the existing
    # threshold-based PvcAlmostFull (Tier 2 @ 85%) and PvcFull (Tier 2
    # @ 95%) — those catch slow growth after the fact; this catches a
    # fast-filling PVC before it hits 85%. Guard with > 70% used so we
    # don't alert on early-life PVCs that haven't established a stable
    # baseline yet (predict_linear is noisy on small fill levels).
    expr: |
      (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.7
      and
      predict_linear(kubelet_volume_stats_available_bytes[6h], 6 * 3600) < 0
    for: 30m
    labels:
      severity: info
      tier: '3'
      component: storage
    annotations:
      summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will run out of space in 6h
      description: PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }}
        is currently at {{ $value | humanizePercentage }} usage and projected
        to be empty within 6 hours at the current growth rate. Plan a resize
        or cleanup before the absolute thresholds (PvcAlmostFull @ 85%,
        PvcFull @ 95%) fire.

  - alert: TrivyOperatorDown
    # Tier 3 (info) — vulnerability scanner. Loss = scans stop but
    # cluster keeps functioning; existing scan results stay valid.
    # Promote to Tier 2 if compliance reporting depends on freshness.
    expr: kube_deployment_status_replicas_available{namespace="trivy-system", deployment="trivy-operator"}
      == 0
    for: 10m
    labels:
      severity: info
      tier: '3'
      component: trivy
    annotations:
      summary: Trivy operator is down
      description: Trivy operator deployment has zero available replicas.
        Vulnerability scans on new images and re-scans of existing
        workloads have stopped.
