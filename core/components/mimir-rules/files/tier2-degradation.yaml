groups:
- name: platform-degradation
  interval: 1m
  rules:
  - alert: VeleroBackupFailed
    expr: increase(velero_backup_failure_total{schedule!=""}[24h]) > 0 or increase(velero_backup_partial_failure_total{schedule!=""}[24h])
      > 0
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: velero
    annotations:
      summary: Velero backup failed or partially failed
      description: Backup schedule {{ $labels.schedule }} had failures in the last
        24 hours.
  - alert: VeleroBslUnavailable
    expr: velero_backup_location_status_gauge == 0
    for: 10m
    labels:
      severity: warning
      tier: '2'
      component: velero
    annotations:
      summary: Velero backup storage location is unavailable
      description: BSL {{ $labels.backup_location_name }} is not accessible. Backups
        will fail.
  - alert: CertificateExpiring14d
    expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: cert-manager
    annotations:
      summary: Certificate {{ $labels.name }} expires in less than 14 days
      description: Certificate {{ $labels.name }} in namespace {{ $labels.namespace
        }} expires in {{ $value | humanizeDuration }}.
  - alert: CertificateExpiring3d
    expr: certmanager_certificate_expiration_timestamp_seconds - time() < 259200
    for: 5m
    labels:
      severity: warning
      tier: '2'
      component: cert-manager
    annotations:
      summary: 'URGENT: Certificate {{ $labels.name }} expires in less than 3 days'
      description: Certificate {{ $labels.name }} in namespace {{ $labels.namespace
        }} expires in {{ $value | humanizeDuration }}. Immediate action required.
  - alert: PvcAlmostFull
    expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes >
      0.85
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: storage
    annotations:
      summary: PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage
        }} full
      description: PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace
        }} is over 85% capacity.
  - alert: PvcFull
    expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes >
      0.95
    for: 5m
    labels:
      severity: warning
      tier: '2'
      component: storage
    annotations:
      summary: 'CRITICAL: PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage
        }} full'
      description: PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace
        }} is over 95% capacity. Imminent data loss risk.
  - alert: MimirIngestionErrors
    expr: rate(cortex_discarded_samples_total[5m]) > 100
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: mimir
    annotations:
      summary: Mimir discarding more than 100 samples/sec
      description: Mimir is discarding {{ $value }} samples per second. Metrics data
        is being lost.
  - alert: LokiHighErrorRate
    expr: sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) /
      clamp_min(sum(rate(loki_request_duration_seconds_count[5m])), 1) > 0.05
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: loki
    annotations:
      summary: Loki error rate above 5%
      description: Loki has a {{ $value | humanizePercentage }} error rate. Log ingestion
        may be degraded.
  - alert: ExternalDnsDown
    # Renamed from ExternalDnsErrors (was based on
    # external_dns_source_errors_total). The external-dns chart in this
    # platform doesn't ship Prometheus scrape annotations enabled by
    # default — the metrics endpoint exists on the Pod but Alloy's
    # metric_pods discovery never reaches it, so 0 external_dns_*
    # metrics ever land in Mimir. Until scrape coverage is added
    # (separate follow-up), the controller-down signal is the strongest
    # one available: if the Deployment goes to 0 ready replicas, DNS
    # records stop syncing.
    expr: kube_deployment_status_replicas_available{namespace="external-dns", deployment="external-dns"}
      == 0
    for: 5m
    labels:
      severity: warning
      tier: '2'
      component: external-dns
    annotations:
      summary: ExternalDNS controller is down
      description: ExternalDNS deployment has zero available replicas for 5 minutes.
        New Ingress hostnames will not be created in DNS and changes to existing
        ones will not propagate.
  - alert: ExternalSecretsNotSynced
    expr: externalsecret_status_condition{condition="Ready", status="False"} > 0
    for: 30m
    labels:
      severity: warning
      tier: '2'
      component: external-secrets
    annotations:
      summary: ExternalSecret {{ $labels.name }} is not syncing
      description: ExternalSecret {{ $labels.name }} in namespace {{ $labels.namespace
        }} has been in Failed state for 30 minutes. Secrets are stale.
  - alert: AlloyScrapeFailure
    expr: up{job=~"argocd-server|cert-manager|velero|kyverno|cnpg-cluster"} == 0
    for: 10m
    labels:
      severity: warning
      tier: '2'
      component: alloy
    annotations:
      summary: Alloy cannot scrape {{ $labels.job }}
      description: Metrics collection for {{ $labels.job }} ({{ $labels.instance }})
        has been down for 10 minutes. Monitoring is blind for this component.
  - alert: HighMemoryUsage
    # Covers core platform + client app namespaces (app-*). Min limit
    # threshold (134217728 = 128Mi) skips tiny utility pods where 95%
    # of a small limit isn't actionable.
    expr: container_memory_working_set_bytes{namespace=~"argocd|grafana|cert-manager|kyverno|cnpg-system|external-secrets|external-dns|aws-load-balancer-controller|karpenter|vault|velero|app-.*",
      container!=""} / container_spec_memory_limit_bytes > 0.95 and container_spec_memory_limit_bytes
      > 134217728
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: '{{ $labels.namespace }}'
    annotations:
      summary: Pod {{ $labels.pod }} memory at {{ $value | humanizePercentage }}
      description: Container {{ $labels.container }} in pod {{ $labels.pod }} ({{
        $labels.namespace }}) is using over 95% of memory limit. OOM kill imminent.
  - alert: PodCrashLoopingWarning
    # Tier 2 = degradation. Catches client app crashloops (app-*) plus
    # secondary platform components. Tier 1 (PodCrashLoopingCritical)
    # covers core platform whose loss makes the cluster unusable.
    expr: increase(kube_pod_container_status_restarts_total{namespace=~"grafana|velero|opencost|trivy-system|external-dns|node-exporter|kube-state-metrics|envoy-gateway-system|policy-reporter|metrics-server|app-.*"}[1h])
      > 5
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: '{{ $labels.namespace }}'
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping
      description: Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has
        restarted {{ $value }} times in the last hour.
  - alert: VeleroNoRecentBackup
    expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 86400
    for: 15m
    labels:
      severity: warning
      tier: '2'
      component: velero
    annotations:
      summary: No successful backup in the last 24 hours
      description: Schedule {{ $labels.schedule }} has not completed a successful
        backup in over 24 hours. Data protection is at risk.
  - alert: ImagePullBackOff
    # Catches deploy mistakes silent until now — wrong ECR tag, podre
    # digest, missing IAM permissions, network egress to registry blocked.
    # Pre-existing PodCrashLoopingCritical/Warning rules only catch
    # restart loops AFTER the container starts; ImagePullBackOff is the
    # state where the container never starts.
    expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"}
      > 0
    for: 5m
    labels:
      severity: warning
      tier: '2'
      component: '{{ $labels.namespace }}'
    annotations:
      summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull image
      description: Container {{ $labels.container }} in pod {{ $labels.pod }}
        ({{ $labels.namespace }}) is in {{ $labels.reason }} state for over
        5 minutes. Check the deployment image tag/digest and registry
        permissions.
  - alert: MimirIngesterPartialFailure
    # Tier 1 (MimirIngesterDown) only fires when ALL ingesters are down
    # (replicas_ready == 0). On a 2-ingester cluster (cortex prd default),
    # losing 1/2 means write replication is gone — single point of failure
    # if the remaining one dies. Catch this earlier as Tier 2.
    expr: kube_statefulset_status_replicas_ready{namespace="grafana", statefulset="grafana-mimir-ingester"}
      < kube_statefulset_replicas{namespace="grafana", statefulset="grafana-mimir-ingester"}
    for: 5m
    labels:
      severity: warning
      tier: '2'
      component: mimir
    annotations:
      summary: Mimir Ingester quorum at risk
      description: Mimir Ingester has fewer ready replicas than desired
        ({{ $value }} ready). Write path replication is degraded — losing
        another replica triggers MimirIngesterDown (critical).
  - alert: TempoMetricsGeneratorFailures
    # Tempo's metrics-generator (local-blocks + service-graphs +
    # span-metrics processors) feeds Grafana Drilldown/Traces. Failures
    # in the registry collection cycle (which exports Prometheus-format
    # metrics out of the in-memory series store) or spans being
    # discarded by the processor mean Drilldown queries silently return
    # incomplete data. Requires tempo /metrics scrape annotations
    # (tempo-values.yaml `podAnnotations` block) — without scrape, the
    # metric simply doesn't exist and the alert is inert.
    expr: |
      rate(tempo_metrics_generator_registry_collections_failed_total[5m]) > 0
      or
      rate(tempo_metrics_generator_spans_discarded_total[5m]) > 0
    for: 10m
    labels:
      severity: warning
      tier: '2'
      component: tempo
    annotations:
      summary: Tempo metrics-generator is dropping data
      description: Tempo metrics-generator on {{ $labels.pod }} is failing
        ({{ $value }}/s — collections_failed and/or spans_discarded).
        Drilldown/Traces queries may return incomplete data.
