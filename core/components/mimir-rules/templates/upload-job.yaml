apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-rules-upload-{{ .Release.Revision }}
  namespace: grafana
  labels:
    estabilis.io/managed-by: platform
    estabilis.io/component: mimir-rules
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: upload
          image: python:3.12-alpine
          command:
            - python3
            - -c
            - |
              import yaml, urllib.request, json, os, glob

              gateway = "{{ .Values.mimirGatewayUrl }}"
              tenant = "{{ .Values.tenantId }}"
              ns = "{{ .Values.rulesNamespace }}"

              print("==> Uploading alerting rules to Mimir Ruler...")

              for filepath in sorted(glob.glob("/rules/*.yaml")):
                  filename = os.path.basename(filepath)
                  with open(filepath) as f:
                      data = yaml.safe_load(f)

                  for group in data.get("groups", []):
                      group_yaml = yaml.dump(group, default_flow_style=False, sort_keys=False)
                      url = f"{gateway}/prometheus/config/v1/rules/{ns}"

                      req = urllib.request.Request(
                          url,
                          data=group_yaml.encode(),
                          headers={
                              "X-Scope-OrgID": tenant,
                              "Content-Type": "application/yaml",
                          },
                          method="POST",
                      )
                      try:
                          resp = urllib.request.urlopen(req)
                          result = json.loads(resp.read())
                          print(f"  OK: {filename} group '{group['name']}' ({len(group.get('rules', []))} rules)")
                      except urllib.error.HTTPError as e:
                          body = e.read().decode()
                          print(f"  FAIL: {filename} group '{group['name']}': {e.code} {body}")
                          raise

              print("==> All rules uploaded successfully")
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: mimir-alerting-rules