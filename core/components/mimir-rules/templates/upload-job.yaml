apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-rules-upload-{{ .Release.Revision }}
  namespace: grafana
  labels:
    app: mimir-rules-upload
    team: platform
    estabilis.io/managed-by: platform
    estabilis.io/component: mimir-rules
    estabilis.io/owner: platform
    estabilis.io/service: mimir-rules
    estabilis.io/tier: platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mimir-rules-upload
        team: platform
        estabilis.io/managed-by: platform
        estabilis.io/owner: platform
        estabilis.io/service: mimir-rules
        estabilis.io/tier: platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      serviceAccountName: mimir-rules-upload
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upload
          image: python@sha256:7747d47f92cfca63a6e2b50275e23dba8407c30d8ae929a88ddd49a5d3f2d331
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              pip install --user -q pyyaml 2>/dev/null
              python3 /scripts/upload.py
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: mimir-alerting-rules
        - name: script
          configMap:
            name: mimir-rules-upload-script
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir-rules-upload
  namespace: grafana
  labels:
    app: mimir-rules-upload
    estabilis.io/managed-by: platform
    estabilis.io/component: mimir-rules
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-rules-upload-script
  namespace: grafana
  labels:
    app: mimir-rules-upload
    team: platform
    estabilis.io/managed-by: platform
    estabilis.io/component: mimir-rules
    estabilis.io/owner: platform
    estabilis.io/service: mimir-rules
    estabilis.io/tier: platform
data:
  upload.py: |
    import urllib.request, json, os, glob, sys

    # Install yaml if needed
    try:
        import yaml
    except ImportError:
        os.system("pip install --user -q pyyaml")
        import yaml

    gateway = os.environ.get("MIMIR_GATEWAY", "{{ .Values.mimirGatewayUrl }}")
    tenant = os.environ.get("MIMIR_TENANT", "{{ .Values.tenantId }}")
    ns = os.environ.get("MIMIR_RULES_NS", "{{ .Values.rulesNamespace }}")

    print("==> Uploading alerting rules to Mimir Ruler...")

    errors = 0
    for filepath in sorted(glob.glob("/rules/*.yaml")):
        filename = os.path.basename(filepath)
        with open(filepath) as f:
            data = yaml.safe_load(f)

        for group in data.get("groups", []):
            group_yaml = yaml.dump(group, default_flow_style=False, sort_keys=False)
            url = f"{gateway}/prometheus/config/v1/rules/{ns}"

            req = urllib.request.Request(
                url,
                data=group_yaml.encode(),
                headers={
                    "X-Scope-OrgID": tenant,
                    "Content-Type": "application/yaml",
                },
                method="POST",
            )
            try:
                resp = urllib.request.urlopen(req)
                result = json.loads(resp.read())
                rules_count = len(group.get("rules", []))
                print(f"  OK: {filename} group '{group['name']}' ({rules_count} rules)")
            except urllib.error.HTTPError as e:
                body = e.read().decode()
                print(f"  FAIL: {filename} group '{group['name']}': {e.code} {body}")
                errors += 1

    if errors > 0:
        print(f"==> {errors} errors occurred")
        sys.exit(1)
    else:
        print("==> All rules uploaded successfully")
