# Rule groups — each can be enabled/disabled by the client
ruleGroups:
  platformDown:
    enabled: true
  platformDegradation:
    enabled: true
  platformOperational:
    enabled: true
    # Traefik 5xx rule — only meaningful on clusters where Traefik
    # serves as the ingress controller. AWS overlay flips this off
    # because AWS clients use the AWS Load Balancer Controller (ALB),
    # where `traefik_*` metrics never exist.
    traefik: true

# Custom rule groups — clients can add their own alerting rules here.
# Each entry renders as a separate YAML file uploaded to Mimir Ruler.
# Example:
#   customRuleGroups:
#     app-alerts:
#       rules:
#         - alert: MyAppDown
#           expr: up{job="my-app"} == 0
#           for: 5m
#           labels:
#             severity: critical
#           annotations:
#             summary: "My app is down"
customRuleGroups: {}

# ============================================================================
# Per-alert overrides (v0.47.1+) — disable or customize platform-shipped
# alerts without forking the chart.
#
# Override key MUST match the `alert:` field exactly (case-sensitive). A
# typo silently no-ops because the chart cannot validate against names
# that don't exist in your installed version. Cross-check via:
#   kubectl get configmap mimir-alerting-rules -n grafana -o yaml \
#     | grep "alert:"
#
# Behavior:
#   - `enabled: false`       → rule is dropped from the rendered ConfigMap
#   - any other field        → SHALLOW-merged onto the upstream rule.
#                              Override wins on collision. Providing a
#                              complex field like `labels:` REPLACES the
#                              entire labels map (you must include every
#                              label you want, not just the changed one).
#
# Threshold tweaks: provide the complete new `expr:` string. The chart
# does not parse PromQL; surgical edit of a single number inside an expr
# is intentionally not supported.
#
# Group-level toggles (ruleGroups.<group>.enabled) and customRuleGroups
# continue to work as before; alertOverrides is independent and stacks
# on top.
#
# Example — disable a noisy alert + adjust other fields:
#   alertOverrides:
#     TempoMetricsGeneratorFailures:
#       enabled: false
#     HighMemoryUsage:
#       for: 30m
#     PvcAlmostFull:
#       expr: |
#         (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.95
#       for: 30m
# ============================================================================
alertOverrides: {}

# Upload mechanism for rules — defaults to OFF.
#
# When enabled=false (default, used on Azure):
#   The ConfigMap `mimir-alerting-rules` is mounted directly into the
#   Mimir Ruler pod at /data/rules/anonymous/ (via extraVolumeMounts in
#   core/components/grafana-stack/mimir-values.yaml). The Ruler reads
#   rules from local filesystem because Azure overlay leaves
#   ruler_storage.backend = local (the upstream default).
#
# When enabled=true (used on AWS — see values-aws.yaml):
#   The mount above is a no-op because mimir-values-aws.yaml flips
#   ruler_storage.backend to s3 (chart validator requires distinct
#   bucket+prefix per storage class — see comment in mimir-values-aws.yaml).
#   This Job runs as a PostSync hook and uses `mimirtool rules sync` to
#   upload each rule file to the Mimir Ruler API, which then persists
#   them to S3 under `<bucket>/ruler/<tenant>/`.
uploadJob:
  enabled: false
  # mimirtool image. Pin a known-good tag; bump deliberately.
  image: grafana/mimirtool:3.0.6
  # Address of the Mimir gateway (or ruler) inside the cluster.
  # Gateway is preferred — nginx routes /api/v1/rules/* to the ruler.
  mimirAddress: http://grafana-mimir-gateway.grafana.svc.cluster.local
  # Tenant ID used for X-Scope-OrgID. Matches the tenant Alloy writes
  # to (gateway nginx injects `anonymous` when no header is sent).
  tenantId: anonymous
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
