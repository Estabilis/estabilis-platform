# Azure-specific Traefik values
# Loaded in addition to values.yaml when provider=azure

service:
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /ping

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
