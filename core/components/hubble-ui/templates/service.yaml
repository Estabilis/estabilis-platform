{{- include "hubble-ui.validateMode" . }}
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui
  namespace: kube-system
  {{- include "estabilis.metadata" . | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hubble-ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8081
      protocol: TCP
