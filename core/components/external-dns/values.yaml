commonLabels:
  estabilis.io/component: external-dns

txtOwnerId: ""  # injected via ArgoCD helm.parameters (global.clusterName)

policy: upsert-only

sources:
  - service
  - ingress

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

domainFilters: []  # injected via ArgoCD helm.parameters
