# Cloudflare-specific values for ExternalDNS.
# Loaded in addition to values.yaml when dnsProvider=cloudflare.
#
# Authentication: API token (scope Zone:Read + DNS:Edit on the target zone)
# mounted from the external-dns-cloudflare-config Secret rendered by the
# external-dns-config chart. No Workload Identity / Azure AD involved.

provider:
  name: cloudflare

# No ServiceAccount annotations — Cloudflare provider authenticates purely
# via the CF_API_TOKEN env var. Keep the chart's default SA.
serviceAccount:
  create: true

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare-config
        key: api-token

# DNS-only mode is the external-dns default for the Cloudflare provider
# (cfg.CloudflareProxied = false), so we don't pass --cloudflare-proxied
# here. Attempting to pass "--cloudflare-proxied=false" crashes the pod
# with "flag parsing error: unexpected false" on external-dns v0.20.0 —
# for that provider, the boolean flag only accepts the bare form (enable).
# To enable proxying in the future, set `extraArgs: [--cloudflare-proxied]`
# and configure Traefik to trust Cloudflare's source IPs (preserves client
# IP through the proxy).
