# Azure-specific values for ExternalDNS
# Loaded in addition to values.yaml when provider=azure

provider:
  name: azure

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/use: "true"
    azure.workload.identity/client-id: ""  # injected via ArgoCD helm.parameters

podLabels:
  azure.workload.identity/use: "true"

secretConfiguration:
  enabled: true
  mountPath: /etc/kubernetes
  subPath: azure.json
  data:
    azure.json: |
      {
        "tenantId": "",
        "subscriptionId": "",
        "resourceGroup": "",
        "useManagedIdentityExtension": true,
        "userAssignedIdentityID": ""
      }
