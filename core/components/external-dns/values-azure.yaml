# Azure-specific values for ExternalDNS
# Loaded in addition to values.yaml when provider=azure

provider:
  name: azure

serviceAccount:
  create: true
  annotations:
    azure.workload.identity/use: "true"
    azure.workload.identity/client-id: ""  # injected via ArgoCD helm.parameters

podLabels:
  azure.workload.identity/use: "true"

extraVolumes:
  - name: azure-config
    secret:
      secretName: external-dns-azure-config

extraVolumeMounts:
  - name: azure-config
    mountPath: /etc/kubernetes
    readOnly: true
