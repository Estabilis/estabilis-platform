# Trivy Operator — continuous vulnerability scanning in-cluster
# https://github.com/aquasecurity/trivy-operator

commonLabels:
  estabilis.io/component: trivy-operator

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# --- Trivy server mode ---
# builtInTrivyServer deploys a StatefulSet with trivy-server in-cluster.
# It overrides trivy.mode to ClientServer and sets serverURL automatically.
# Server keeps DB in memory, scan jobs are lightweight clients.
trivy:
  ignoreUnfixed: true
  storageSize: "4Gi"
  # Resources for the trivy CLI container inside scan job pods.
  # 512Mi was OOMing on real-world image scans (anon-rss ~520MB during
  # layer extraction even in ClientServer mode — observed Transfero HML
  # 2026-04-16). 1Gi gives headroom for typical multi-layer images
  # without going overboard. Bump if a specific client has very large
  # images that still OOM.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 1Gi
  server:
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# --- Operator ---
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 1
  scanJobRetryAfter: 30s
  # 10 retries × OOM = 10 noisy events for the same scan failure.
  # Cap at 3: a job that doesn't fit in trivy.resources.limits.memory
  # after 3 attempts won't fit on the 4th either. The image is the
  # problem, not transient cluster pressure.
  scanJobBackoffLimit: 3
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: false

# --- Scan job security (scan jobs run as root for image access) ---
trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
