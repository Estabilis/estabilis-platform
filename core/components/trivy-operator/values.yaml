# Trivy Operator — continuous vulnerability scanning in-cluster
# https://github.com/aquasecurity/trivy-operator

commonLabels:
  estabilis.io/component: trivy-operator

podLabels:
  app: trivy-operator
  team: platform
  estabilis.io/owner: platform
  estabilis.io/service: trivy-operator
  estabilis.io/tier: security

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# --- Trivy server mode ---
# builtInTrivyServer deploys a StatefulSet with trivy-server in-cluster.
# It overrides trivy.mode to ClientServer and sets serverURL automatically.
# Server keeps DB in memory, scan jobs are lightweight clients.
trivy:
  ignoreUnfixed: true
  storageSize: "4Gi"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  server:
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# --- Operator ---
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 1
  scanJobRetryAfter: 30s
  scanJobBackoffLimit: 10
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: false

# --- Scan job security (scan jobs run as root for image access) ---
trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
