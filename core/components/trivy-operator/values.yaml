# Trivy Operator — continuous vulnerability scanning in-cluster
# https://github.com/aquasecurity/trivy-operator

commonLabels:
  estabilis.io/managed-by: platform
  estabilis.io/component: trivy-operator

podLabels:
  app: trivy-operator
  team: platform
  estabilis.io/owner: platform
  estabilis.io/service: trivy-operator
  estabilis.io/tier: security

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

trivy:
  ignoreUnfixed: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

operator:
  scanJobsConcurrentLimit: 1
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  infraAssessmentScannerEnabled: false

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault

tolerations:
  - key: "estabilis.io/workload-type"
    operator: "Equal"
    value: "platform"
    effect: "NoSchedule"
