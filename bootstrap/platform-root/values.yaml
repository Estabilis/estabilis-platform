# Platform Root — Helm values
#
# Values marked "# injected by terraform" are passed as helm.parameters
# from platform-root.tf and override these defaults.
# All other values are defaults that can be overridden by the client
# via the multi-source mechanism.

platformRepoUrl: ""       # injected by terraform
platformVersion: ""       # injected by terraform
configRepoUrl: ""         # injected by terraform
configRepoVersion: ""     # injected by terraform

# ---------------------------------------------------------------------------
# Supply-chain provenance — ADR 0005 Phase 2
# ---------------------------------------------------------------------------
# The four L1 annotations emitted onto managed namespaces (and, in a
# follow-up Phase 2b, onto resources rendered by internal charts).
#
# Injected as helm.parameters by the CLI (`estabilis upstart` /
# `estabilis promote`) at render time, sourced from
# `scripts/generate-provenance-values.sh` in estabilis-platform-tools.
# When any of the four is empty, the namespace helper skips rendering
# the block (guarded by gitRevision). Pipelines that do not run the
# wrapper script — or local helm template invocations without values —
# produce manifests without provenance annotations, which is valid.
#
# Reference: estabilis-platform-tools/docs/adr/0005-supply-chain-provenance.md
# ---------------------------------------------------------------------------

# estabilis-platform-gitops — repo that owns workload bootstrap manifests.
# See ADR 0001 (estabilis-platform-tools/docs/adr/0001-workload-bootstrap-strategy.md).
# Default values below; downstream can override via overrides/platform-root/values.yaml.
platformGitopsRepoUrl: "https://github.com/Estabilis/estabilis-platform-gitops.git"
platformGitopsVersion: "v0.1.0"

global:
  # Provenance — injected at runtime by the CLI (see block above).
  # Empty defaults mean "not populated"; the helper skips the block.
  provenance:
    gitRevision: ""
    gitSource: ""
    builtAt: ""
    buildId: ""

  # Client configuration — injected by terraform from client tfvars
  provider: ""            # injected by terraform
  domain: ""              # injected by terraform (base domain)
  effectiveDomain: ""     # injected by terraform (computed: may include env subdomain)
  hostPattern: "subdomain" # injected by terraform (subdomain | prefix | suffix)
  environment: ""         # injected by terraform
  letsencryptEmail: ""    # injected by terraform

  # Azure resource outputs — injected by terraform
  clusterName: ""
  resourceGroup: ""
  tenantId: ""
  subscriptionId: ""
  azureOfferId: ""
  storageAccountName: ""
  keyVaultName: ""
  keyVaultUri: ""
  cnpgStorageAccountName: ""
  cnpgBackupContainerName: ""
  veleroStorageAccountName: ""
  veleroBackupContainerName: ""

  # Backup/Observability — injected by terraform from client tfvars (with defaults in variables.tf)
  veleroBackupSchedule: ""
  veleroBackupRetentionHours: ""
  cnpgBackupRetentionDays: ""
  cnpgBackupSchedule: ""
  lokiExternalIngressEnabled: ""
  lokiAllowedCidrs: ""
  acrLoginServer: ""

# Workload Identity client IDs — injected by terraform
identity:
  externalDns:
    clientId: ""
  externalSecrets:
    clientId: ""
  loki:
    clientId: ""
  mimir:
    clientId: ""
  cnpg:
    clientId: ""
  certManager:
    clientId: ""
  velero:
    clientId: ""

# ---------------------------------------------------------------------------
# Component Toggles
# ---------------------------------------------------------------------------
# Controls which platform components are deployed. Downstream can override
# to disable optional components via overrides/platform-root/values.yaml.
#
# Classification:
#   core        — CANNOT be disabled, platform breaks without them
#   optional    — CAN be disabled by downstream
#   observability — CAN be disabled individually or as a group
#   conditional — enabled based on provider or feature flags
#
# Dependencies (if disabling, must also disable):
#   cnpg        → grafana (uses postgres), argocd-db
#   mimir       → mimir-rules
#   loki        → loki-ingress
#   traefik     → loki-ingress
#   observability (group) → grafana, loki, mimir, alloy, tempo, dashboards, mimir-rules
components:
  # --- core (do not disable) ---
  cert-manager: true         # core: TLS for all services
  external-secrets: true     # core: secrets management via Key Vault
  kyverno: true              # core: security policies, PSS enforcement
  cnpg: true                 # core: PostgreSQL for Grafana and ArgoCD
  argocd: true               # core: self-managed GitOps controller

  # --- optional ---
  network-policies: true     # optional: network segmentation (disable if using alternative)
  traefik: false             # optional: ingress controller — enable only when exposing apps (L7 ingress + NSG rules + LB)
  traefik-internal: false    # optional: second Traefik for VNet-only exposures (ADR 0014 internal class)
  opencost: true             # optional: cost tracking (disable if not needed)
  trivy: true                # optional: vulnerability scanning (disable if using alternative)
  velero: true               # optional: backup/restore (disable if handled externally)
  external-dns: true         # optional: DNS record management (disable if manual DNS)

  # --- observability (disable individually or set all to false) ---
  grafana: true              # observability: dashboards and visualization
  loki: true                 # observability: log aggregation
  mimir: true                # observability: metrics storage
  alloy: true                # observability: telemetry collector (DaemonSet)
  tempo: true                # observability: distributed tracing
  pyroscope: true            # observability: continuous profiling
  grafana-dashboards: true   # observability: pre-built dashboards
  mimir-rules: true          # observability: alerting rules
  kube-state-metrics: true   # observability: Kubernetes state metrics
  node-exporter: true        # observability: node-level metrics
  hubble-ui: false           # observability: Cilium network flows UI (opt-in, ACNS only)
  workload-bootstrap: false  # optional: bootstraps Kyverno + baseline on registered workload clusters (ADR 0001)

# Platform Add-ons — private components deployed via OCI Helm charts.
# Downstream activates add-ons via overrides/platform-root/values.yaml.
# Each entry creates an ArgoCD Application with project: platform.
platformAddons: {}

# Custom Applications — clients can deploy their own apps via overrides.
# Each entry creates an ArgoCD Application that references the client's
# downstream repo. The client controls the path and content.
customApps: {}

# ---------------------------------------------------------------------------
# Client GitOps repo (ADR 0008 Tier 3 — per-client override source)
# ---------------------------------------------------------------------------
# When set, each Application gains a $gitops source pointing at the
# client's gitops repo. Override path convention:
#   $gitops/platforms/{deploymentId}/overrides/{component}/values.yaml
#
# Set by the CLI at render time (same mechanism as global.provenance.*).
clientGitopsRepoUrl: ""
clientGitopsRepoVersion: ""
deploymentId: ""

# Scheduling policy per component (ADR 0012 — tracked in
# Estabilis/estabilis-platform-tools#97). Empty by default — each
# Application template uses its opinionated mode ("auto" for most,
# "regular-only" for stateful: velero, tempo, loki-ingester, mimir-ingester).
# Override per-component in the downstream overrides/platform-root/values.yaml:
#   scheduling:
#     argocd: regular-only
#     velero: spot-only
scheduling: {}
