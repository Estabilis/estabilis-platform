# Platform Root — Helm values
#
# Values marked "# injected by terraform" are passed as helm.parameters
# from platform-root.tf and override these defaults.
# All other values are defaults that can be overridden by the client
# via the multi-source mechanism.

platformRepoUrl: ""       # injected by terraform
platformVersion: ""       # injected by terraform
configRepoUrl: ""         # injected by terraform
configRepoVersion: ""     # injected by terraform

global:
  # Client configuration — injected by terraform from client tfvars
  provider: ""            # injected by terraform
  domain: ""              # injected by terraform
  environment: ""         # injected by terraform
  letsencryptEmail: ""    # injected by terraform

  # Azure resource outputs — injected by terraform
  clusterName: ""
  resourceGroup: ""
  tenantId: ""
  subscriptionId: ""
  azureOfferId: ""
  storageAccountName: ""
  keyVaultName: ""
  keyVaultUri: ""
  cnpgStorageAccountName: ""
  cnpgBackupContainerName: ""
  veleroStorageAccountName: ""
  veleroBackupContainerName: ""

  # Backup/Observability — injected by terraform from client tfvars (with defaults in variables.tf)
  veleroBackupSchedule: ""
  veleroBackupRetentionHours: ""
  cnpgBackupRetentionDays: ""
  cnpgBackupSchedule: ""
  lokiExternalIngressEnabled: ""
  lokiAllowedCidrs: ""

# Workload Identity client IDs — injected by terraform
identity:
  externalDns:
    clientId: ""
  externalSecrets:
    clientId: ""
  loki:
    clientId: ""
  mimir:
    clientId: ""
  cnpg:
    clientId: ""
  certManager:
    clientId: ""
  velero:
    clientId: ""

# Custom Applications — clients can deploy their own apps via overrides.
# Each entry creates an ArgoCD Application that references the client's
# downstream repo. The client controls the path and content.
# Example:
#   customApps:
#     my-app:
#       namespace: my-app
#       path: apps/my-app
#       syncWave: "10"
customApps: {}
