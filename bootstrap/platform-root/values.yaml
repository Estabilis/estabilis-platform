# Platform Root — Helm values
#
# Values marked "# injected by terraform" are passed as helm.parameters
# from platform-root.tf and override these defaults.
# All other values are defaults that can be overridden by the client
# via the multi-source mechanism.

platformRepoUrl: ""         # injected by terraform
platformVersion: ""         # injected by terraform
configRepoUrl: ""           # injected by terraform

# Git ref for the config repo. Prefer `configRepoRevision` (added
# v0.13.0 per ADR 0020) which accepts branches (main / release/<env>)
# for continuous reconciliation OR tags for pinned releases.
# `configRepoVersion` is retained for backcompat — when both are set,
# `configRepoRevision` wins.
configRepoRevision: ""      # injected by terraform (new)
configRepoVersion: ""       # DEPRECATED: use configRepoRevision

# ---------------------------------------------------------------------------
# Supply-chain provenance — ADR 0005 Phase 2
# ---------------------------------------------------------------------------
# The four L1 annotations emitted onto managed namespaces (and, in a
# follow-up Phase 2b, onto resources rendered by internal charts).
#
# Injected as helm.parameters by the CLI (`estabilis upstart` /
# `estabilis promote`) at render time, sourced from
# `scripts/generate-provenance-values.sh` in estabilis-platform-tools.
# When any of the four is empty, the namespace helper skips rendering
# the block (guarded by gitRevision). Pipelines that do not run the
# wrapper script — or local helm template invocations without values —
# produce manifests without provenance annotations, which is valid.
#
# Reference: estabilis-platform-tools/docs/adr/0005-supply-chain-provenance.md
# ---------------------------------------------------------------------------

# estabilis-platform-gitops — repo that owns workload bootstrap manifests.
# See ADR 0001 (estabilis-platform-tools/docs/adr/0001-workload-bootstrap-strategy.md).
# Default values below; downstream can override via overrides/platform-root/values.yaml.
platformGitopsRepoUrl: "https://github.com/Estabilis/estabilis-platform-gitops.git"
platformGitopsVersion: "v0.39.14"

global:
  # Provenance — injected at runtime by the CLI (see block above).
  # Empty defaults mean "not populated"; the helper skips the block.
  provenance:
    gitRevision: ""
    gitSource: ""
    builtAt: ""
    buildId: ""

  # Client configuration — injected by terraform from client tfvars
  provider: ""            # injected by terraform (cloud: azure | aws)
  dnsProvider: ""         # injected by terraform (dns: azure | cloudflare) — defaults to provider when empty
  domain: ""              # injected by terraform (DNS zone root, e.g. estabilis.io)
  environment: ""         # injected by terraform
  letsencryptEmail: ""    # injected by terraform
  cloudflareZoneId: ""    # injected by terraform when dnsProvider=cloudflare
  cloudflareApiToken: ""  # injected by terraform when dnsProvider=cloudflare (sensitive)

  # Key of the Cloudflare token INSIDE the platform's secret store, for
  # deployments that have one. When this is set, cert-manager-config takes its
  # ExternalSecret branch and the token never appears on an Application spec;
  # when it is empty, `cloudflareApiToken` above is rendered in cleartext and
  # anyone with Argo CD read access can see it.
  #
  # AWS does not need this: its key is derived from `secretsPathPrefix`, which
  # predates this value and keeps working untouched.
  cloudflareApiTokenSecretKey: ""

  # --- Google Secret Manager, for deployments whose cloud has no secret store
  #
  # DigitalOcean is the case this exists for. Empty on every other provider,
  # and empty here means "no store": the cluster-secret-store Application does
  # not render at all rather than rendering one that cannot authenticate.
  gcpSecretManagerProject: ""

  # Google service account External Secrets impersonates after federating.
  # Access is then authorised by ITS bindings — typically
  # roles/secretmanager.secretAccessor scoped to one secret — rather than on
  # the federated principal, which keeps IAM written against one stable member.
  gcpSecretManagerServiceAccount: ""

  # The workload identity pool PROVIDER path, in the `//iam.googleapis.com/...`
  # form. Only this form is stored: the `aud` the projected Kubernetes token
  # must carry is the same path with an `https:` prefix, and the templates
  # derive it rather than take a second value that can drift out of step with
  # this one.
  gcpWorkloadIdentityAudience: ""

  # Azure resource outputs — injected by terraform
  clusterName: ""
  resourceGroup: ""
  tenantId: ""
  subscriptionId: ""
  azureOfferId: ""
  storageAccountName: ""
  keyVaultName: ""
  keyVaultUri: ""
  cnpgStorageAccountName: ""
  cnpgBackupContainerName: ""
  veleroStorageAccountName: ""
  veleroBackupContainerName: ""

  # Backup/Observability — injected by terraform from client tfvars (with defaults in variables.tf)
  veleroBackupSchedule: ""
  veleroBackupRetentionHours: ""
  cnpgBackupRetentionDays: ""
  cnpgBackupSchedule: ""
  lokiExternalIngressEnabled: ""
  lokiAllowedCidrs: ""
  acrLoginServer: ""
  sharedAcrLoginServer: "" # injected by terraform — shared ACR for workload images (Image Updater)

# Per-cloud workload identity references — injected by terraform.
#
# Each entry exposes both:
#   - clientId: Azure Workload Identity client ID (MSI object ID)
#   - roleArn:  AWS IAM role ARN for IRSA
#
# Templates select the right field based on `.Values.global.provider`.
# Fields not relevant to the active cloud stay empty and are not rendered.
identity:
  externalDns:
    clientId: ""
    roleArn: ""
  externalSecrets:
    clientId: ""
    roleArn: ""
  loki:
    clientId: ""
    roleArn: ""
  mimir:
    clientId: ""
    roleArn: ""
  cnpg:
    clientId: ""
    roleArn: ""
  certManager:
    clientId: ""
    roleArn: ""
  velero:
    clientId: ""
    roleArn: ""
  # Vault (v0.28.0+ — multi-provider opt-in). Empty defaults so the
  # vault.yaml Application template can render even when vault_enabled
  # is false (or when terraform hasn't injected helm.parameters yet).
  vault:
    clientId: ""
    roleArn: ""

# Vault infrastructure values — populated by terraform helm.parameters from
# the platform-infrastructure-sensitive Secret when vault_enabled=true.
# Defaults below are empty strings so the vault.yaml template doesn't trip
# on nil pointers during initial render.
vault:
  # AWS path
  kmsKeyId: ""
  kmsRegion: ""
  backupBucketName: ""
  # Azure path
  keyVaultName: ""
  unsealKeyName: ""
  backupStorageAccount: ""
  backupContainer: ""
  # DigitalOcean path — auto-unseal on GCP Cloud KMS.
  #
  # DigitalOcean has no managed key management service, so auto-unseal there has
  # no in-provider option: either an external KMS, or operator-held unseal shares
  # re-entered on every pod restart. These four locate the key.
  gcpKmsProject: ""
  gcpKmsRegion: ""
  gcpKmsKeyRing: ""
  gcpKmsCryptoKey: ""
  # Workload Identity Federation, so no Google service account key is placed in
  # the cluster. `gcpWifAudience` MUST be the full WIF provider path, in the
  # `https://iam.googleapis.com/projects/.../providers/...` form the projected
  # token uses — Google rejects the exchange on any mismatch.
  gcpWifAudience: ""
  # ConfigMap in the `vault` namespace holding credential-configuration.json.
  # Provisioned by the deployment's Terraform, like platform-infrastructure
  # (ADR 0010); the chart only references it.
  gcpWifConfigMap: "vault-gcp-wif"

# ---------------------------------------------------------------------------
# Chart versions
# ---------------------------------------------------------------------------
#
# Pin a third-party chart to a version other than the one this release was
# tested against. Keyed by the chart's OWN name, as it appears in the `chart:`
# field of the Application — `argo-cd`, not `argocd`; `cloudnative-pg`, not
# `cnpg`; `prometheus-node-exporter`, not `node-exporter`. One `traefik` entry
# covers both the public and the internal Application, because they are the
# same chart.
#
# Empty or absent means "use the tested default", which is what every entry
# below is. Nothing here changes unless a deployment sets it.
#
# ⚠️ Bumping a chart bumps everything inside it. There is no separate knob for
# the contents, and there should not be — the chart is what was tested together.
# argo-cd 9.5.6 to 10.4.0, for instance, moves every Argo CD image from v3.3.8
# to v3.5.1 and Redis from 8.2.3 to 8.6.4.
#
# The tested defaults, for reference (they live in the templates, not here, so
# that a release cannot ship a default this file disagrees with):
#
#   argo-cd 9.5.6            cert-manager 1.20.0        kyverno 3.7.1
#   vault 0.29.1             cloudnative-pg 0.28.0      external-dns 1.20.0
#   traefik 39.0.5           velero 11.4.0              trivy-operator 0.32.0
#   grafana 10.5.15          loki 6.54.0                mimir-distributed 6.0.5
#   alloy 1.6.2              tempo 1.24.4               pyroscope 1.19.0
#   opencost 2.3.2           kube-state-metrics 5.27.0  beyla 1.16.5
#   prometheus-node-exporter 4.43.1                     argocd-image-updater 0.14.0
#   karpenter 1.12.0         karpenter-crd 1.12.0       metrics-server 3.12.2
#   aws-load-balancer-controller 1.17.1
#
chartVersions: {}

# Argo CD Helm chart version. Superseded by `chartVersions.argo-cd`, which is
# where new deployments should set this; kept because deployments already set
# it, and `chartVersions` wins when both are present.
#
# Declared here rather than left to the template's `default` function. The
# equivalent `vaultChartVersion` is not, and cannot be found without reading
# vault.yaml — a value nobody can discover is not really configurable.
#
# Must agree with what the deployment's bootstrap installed. Argo CD manages
# itself through the Application this feeds, so a bootstrap ahead of this value
# is silently pulled back to it on the first sync.
argocdChartVersion: ""

# ---------------------------------------------------------------------------
# Component Toggles
# ---------------------------------------------------------------------------
# Controls which platform components are deployed. Downstream can override
# to disable optional components via overrides/platform-root/values.yaml.
#
# Classification:
#   core        — CANNOT be disabled, platform breaks without them
#   optional    — CAN be disabled by downstream
#   observability — CAN be disabled individually or as a group
#   conditional — enabled based on provider or feature flags
#
# Dependencies (if disabling, must also disable):
#   cnpg        → grafana (uses postgres), argocd-db
#   mimir       → mimir-rules
#   loki        → loki-ingress
#   traefik     → loki-ingress
#   observability (group) → grafana, loki, mimir, alloy, tempo, dashboards, mimir-rules
# ---------------------------------------------------------------------------
# Component Configuration — per-component overridable settings (chart
# versions, install flags, etc.). Separate from `components.<name>: bool`
# above, which only toggles deployment.
#
# Downstream overrides via `overrides/platform-root/values.yaml` deep-merge
# with the defaults below — set only the keys you need to override.
# ---------------------------------------------------------------------------
componentConfig:
  externalSecrets:
    # ESO Helm chart version (charts.external-secrets.io). Bump in lockstep
    # with the CRD version applied by the upstart pipeline
    # (`externalSecretsCrdVersion` in spec/upstart/upstart.yaml — they must
    # match or be compatible to avoid schema/controller drift like the
    # cortex-prd incident on 2026-05-20, where chart was at 2.1.0 but
    # platform-secrets emitted `nullBytePolicy: Ignore` which the
    # cluster's old CRD didn't declare → ArgoCD ComparisonError).
    chartVersion: "2.1.0"
    # When `true`, the ESO Helm chart installs/upgrades the CRDs alongside
    # the controller. When `false` (default), CRDs are managed out-of-band
    # by the upstart `Operator CRDs` wave so the lifecycle is decoupled
    # from the controller upgrade. Flip to `true` only if downstream
    # explicitly wants Helm to take ownership of the CRDs (be aware that
    # CRDs pre-applied by the upstart pipeline will have a `kubectl
    # kube-apiserver` field manager that Helm will need to override).
    installCRDs: false

components:
  # --- core (do not disable) ---
  cert-manager: true         # core: TLS for all services
  external-secrets: true     # core: secrets management via Key Vault
  kyverno: true              # core: security policies, PSS enforcement
  cnpg: true                 # core: PostgreSQL for Grafana and ArgoCD
  argocd: true               # core: self-managed GitOps controller

  # --- optional ---
  network-policies: true     # optional: network segmentation (disable if using alternative)
  traefik: false             # optional: ingress controller — enable only when exposing apps (L7 ingress + NSG rules + LB)
  traefik-internal: false    # optional: second Traefik for VNet-only exposures (ADR 0014 internal class)
  opencost: false            # optional: AWS cost tracking via opencost — REQUIRES cost_export_enabled=true in terraform.tfvars (provisions AWS CUR + Athena integration). Without CUR the chart still installs but its ExternalSecrets (opencost-cloud-service-key, opencost-cloud-integration) point to AWS Secrets Manager paths terraform never created, producing permanent Synced/Degraded state. Opt-in by setting `components.opencost: true` in overrides/platform-root/values.yaml AND `cost_export_enabled = true` in terraform.tfvars. opencost.yaml additionally gates on global.curBucketName (defense in depth) so an opt-in without CUR cleanly skips rather than degrading.
  trivy: true                # optional: vulnerability scanning (disable if using alternative)
  velero: true               # optional: backup/restore (disable if handled externally)
  external-dns: true         # optional: DNS record management (disable if manual DNS)
  argocd-image-updater: false # optional: auto-update container images via registry polling (opt-in)
  # ResourceQuotas for the platform namespaces. Had no key at all until now,
  # so it was the one component nothing could switch off.
  resource-quotas: true
  policy-reporter: false     # optional: kubernetes policy report dashboards (disabled by default — opt-in)
  metrics-server: true       # optional: AWS-only — Resource Metrics API server (kubectl top, HPA). Azure AKS provides natively
  snapshot-controller: true  # optional: AWS-only — VolumeSnapshotClass for Velero CSI backups (snapshot-controller addon installs CRDs+Deployment via providers/aws/eks.tf)
  karpenter: true            # optional: AWS-only — node autoscaler. Activates when global.autoscaler is `karpenter` or `hybrid`
  karpenter-resources: true  # optional: AWS-only — default NodePool + EC2NodeClass. Same activation as karpenter
  aws-load-balancer-controller: true  # optional: AWS-only — provisions ALB/NLB from Ingress/Service. Activates when global.ingressController == "alb"
  vault: false              # optional: HashiCorp Vault — multi-provider opt-in. Activated by vault_enabled=true in terraform.tfvars (provisions cloud unseal infra). Auto-unseal: KMS (AWS) / Key Vault (Azure). Foundation only — bootstrap (auth, policies, KV mount) is downstream.

  # --- observability (disable individually or set all to false) ---
  grafana: true              # observability: dashboards and visualization
  loki: true                 # observability: log aggregation
  mimir: true                # observability: metrics storage
  alloy: true                # observability: telemetry collector (DaemonSet)
  tempo: true                # observability: distributed tracing
  pyroscope: true            # observability: continuous profiling
  beyla: false               # observability: eBPF auto-instrumentation. Opt-in per cluster; per-pod opt-in via `estabilis.io/instrument-with-beyla: "true"` label.
  grafana-dashboards: true   # observability: pre-built dashboards
  mimir-rules: true          # observability: alerting rules
  kube-state-metrics: true   # observability: Kubernetes state metrics
  node-exporter: true        # observability: node-level metrics
  hubble-ui: false           # observability: Cilium network flows UI (opt-in, ACNS only)
  workload-bootstrap: false  # optional: bootstraps Kyverno + baseline on registered workload clusters (ADR 0001)

# Platform Add-ons — private components deployed via OCI Helm charts.
# Downstream activates add-ons via overrides/platform-root/values.yaml.
# Each entry creates an ArgoCD Application with project: platform.
platformAddons: {}

# Custom Applications — clients can deploy their own apps via overrides.
# Each entry creates an ArgoCD Application that references the client's
# downstream repo. The client controls the path and content.
customApps: {}

# ---------------------------------------------------------------------------
# Client GitOps repo (ADR 0008 Tier 3 — per-client override source)
# ---------------------------------------------------------------------------
# When set, each Application gains a $gitops source pointing at the
# client's gitops repo. Override path convention:
#   $gitops/platforms/{deploymentId}/overrides/{component}/values.yaml
#
# Set by the CLI at render time (same mechanism as global.provenance.*).
clientGitopsRepoUrl: ""

# Git ref for the client gitops repo. Prefer `clientGitopsRepoRevision`
# (added v0.13.0 per ADR 0020) which accepts branches (main /
# release/<env>) for continuous reconciliation OR tags for pinned
# releases. `clientGitopsRepoVersion` is retained for backcompat —
# when both are set, `clientGitopsRepoRevision` wins.
clientGitopsRepoRevision: ""
clientGitopsRepoVersion: ""  # DEPRECATED: use clientGitopsRepoRevision

deploymentId: ""

# ---------------------------------------------------------------------------
# Hub-targeted client applications (ADR 0017)
# ---------------------------------------------------------------------------
# Namespaces on the hub that `platform-client-infra` AppProject is
# authorized to deploy into. Each entry adds a `server=kubernetes.default.svc,
# namespace=<ns>` to the project's destinations list and allows the
# hub-client-apps ApplicationSet to create Applications whose manifests
# target that namespace.
#
# Empty list = no hub-apps authorized (safe default). Every namespace
# declared in a `hub-apps/{name}/manifests/namespace.yaml` MUST appear
# in this list, otherwise ArgoCD rejects the Application for violating
# its project.
#
# Operator-managed via overrides/platform-root/values.yaml in the
# client's platform downstream — NOT client-mutable.
clientHubAppNamespaces: []

# ---------------------------------------------------------------------------
# Extra sourceRepos for the `platform-apps` AppProject (ADR 0027).
# ---------------------------------------------------------------------------
# By default `platform-apps` accepts only `configRepoUrl` (the wrapper
# repo) as a source. If a client business app needs to pull from an
# upstream chart host, declare it here in the wrapper override:
#
#   platformAppsExtraSourceRepos:
#     - "https://charts.bitnami.com/bitnami"
#     - "oci://my-oci-registry/charts"
#
# No wildcards — every host must be explicit (so the AppProject
# scope-creep is auditable in code review).
platformAppsExtraSourceRepos: []

# ---------------------------------------------------------------------------
# Extra sourceRepos for the `workload-apps` AppProject (ADR 0027).
# ---------------------------------------------------------------------------
# Same mechanism as platformAppsExtraSourceRepos but scoped to
# workload clusters. Default: clientGitopsRepoUrl + sharedAcrLoginServer
# (when present). Add upstream chart hosts as needed:
#
#   workloadAppsExtraSourceRepos:
#     - "https://charts.bitnami.com/bitnami"
workloadAppsExtraSourceRepos: []

# ---------------------------------------------------------------------------
# Client-managed Applications — gating of auto-sync at bootstrap time.
# ---------------------------------------------------------------------------
# Two ApplicationSets generate workload Applications from the client's
# gitops repo:
#   • `client-apps` (in workload-bootstrap chart, hub-rendered) —
#     `platforms/{deploymentId}/apps/*`
#   • `hub-client-apps` (this chart, hub-rendered) —
#     `platforms/{deploymentId}/hub-apps/*`
#
# Default is `false` (manual sync required) — flip to `true` to opt
# back into pure GitOps continuous reconciliation.
#
# Why default manual:
#   1. Cold-cluster bootstrap is race-free. Workload Apps stay
#      OutOfSync until operator triggers sync, so they never thrash
#      while ESO/ALB/CNPG/image-updater are still coming up.
#   2. Production-safe by default. Every workload deploy goes through
#      an explicit gate (operator, CI pipeline, or argocd-image-updater
#      writeback). No accidental rollout if a gitops-repo merge slips
#      through.
#   3. Aligns with how workloads are typically deployed on Estabilis:
#      a CI pipeline builds an image, writes back to gitops, and
#      either triggers `argocd app sync` or relies on
#      argocd-image-updater. Operator gating happens at the pipeline
#      level, not at every reconcile loop.
#
# Set `clientApps.autoSync: true` per-cluster in the wrapper override
# (overrides/platform-root/values.yaml) when the cluster runs purely
# GitOps continuous reconciliation with no CI-driven deploy gating.
clientApps:
  autoSync: false

# Additional cluster-scoped resource kinds authorized for the
# `platform-client-infra` AppProject. Appended to the project's
# `clusterResourceWhitelist` baseline (which already includes
# Namespace, ClusterRole, ClusterRoleBinding, CRD,
# admissionregistration.k8s.io/*, networking.k8s.io/*, and
# kyverno.io/PolicyException).
#
# Why this exists: legitimate hub-apps sometimes ship resources the
# baseline doesn't cover (e.g. KEDA registers an APIService in
# apiregistration.k8s.io for its external-metrics adapter; Istio and
# other service meshes register networking.istio.io types). Upstream
# defines the GOVERNANCE CLASSES permitted; the client declares the
# specific kinds their own hub-apps need. This follows ADR 0017's
# "upstream proposes, client disposes" principle and avoids forcing
# a platform PR for every new hub-app kind.
#
# Client sets this in overrides/platform-root/values.yaml:
#   clientHubAppExtraClusterResources:
#     - group: apiregistration.k8s.io
#       kind: APIService
#
# Default empty — no extras beyond the baseline.
clientHubAppExtraClusterResources: []

# ---------------------------------------------------------------------------
# Extra sourceRepos for the `platform-client-infra` AppProject (ADR 0017).
# ---------------------------------------------------------------------------
# By default `platform-client-infra` accepts only `clientGitopsRepoUrl`
# (the client's gitops repo) as a source. When the client splits gitops
# content across multiple repos — e.g. a per-project provisioning repo
# alongside the runtime gitops repo — declare the additional repos here:
#
#   clientHubAppExtraSourceRepos:
#     - "https://github.com/<org>/<client>-projects.git"
#     - "https://github.com/<org>/<client>-policies.git"
#
# Mirrors the platformAppsExtraSourceRepos / workloadAppsExtraSourceRepos
# pattern. No wildcards — every repo must be explicit (auditable in
# review). Operator-managed via overrides/platform-root/values.yaml.
clientHubAppExtraSourceRepos: []

# Scheduling policy per component (ADR 0012 — tracked in
# Estabilis/estabilis-platform-tools#97). Empty by default — each
# Application template uses its opinionated mode ("auto" for most,
# "regular-only" for stateful: velero, tempo, loki-ingester, mimir-ingester).
# Override per-component in the downstream overrides/platform-root/values.yaml:
#   scheduling:
#     argocd: regular-only
#     velero: spot-only
scheduling: {}
