{{- /* observability: downstream can disable via components.grafana: false */ -}}
{{- if ne (index .Values.components "grafana") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  source:
    repoURL: {{ .Values.platformRepoUrl }}
    targetRevision: {{ .Values.platformVersion }}
    path: core/components/grafana-db
    {{- if .Values.global.provenance.gitRevision }}
    helm:
      parameters:
        {{- include "platform-root.provenanceParameters" . | nindent 8 }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: "10.5.15"
      helm:
        valueFiles:
          - $values/core/components/grafana-stack/grafana-values.yaml
          - $values/core/components/grafana-stack/grafana-values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "grafana" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "grafana"))
             ) | nindent 10 }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcludedPrivileged" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
---
{{- /* observability: downstream can disable via components.loki: false */ -}}
{{- if ne (index .Values.components "loki") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "6.54.0"
      helm:
        valueFiles:
          - $values/core/components/grafana-stack/loki-values.yaml
          - $values/core/components/grafana-stack/loki-values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "loki" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — loki-distributed uses per-component paths */}}
          {{- $mode := default "auto" (index .Values.scheduling "loki") }}
          {{- $modeIngester := default "regular-only" (index .Values.scheduling "loki-ingester") }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $mode
                "paths" (list "gateway" "distributor" "querier" "queryFrontend" "queryScheduler" "ruler" "compactor" "indexGateway")
             ) | nindent 10 }}
          {{- /* ingester: default regular-only (in-memory WAL, eviction = data loss risk) */}}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $modeIngester
                "paths" (list "ingester")
             ) | nindent 10 }}
        parameters:
          {{- if eq .Values.global.provider "azure" }}
          - name: loki.storage.azure.accountName
            value: "{{ .Values.global.storageAccountName }}"
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.loki.clientId }}"
          {{- else if eq .Values.global.provider "aws" }}
          # AWS — to be implemented
          # - name: loki.storage.s3.bucketname
          #   value: "{{ .Values.global.lokiBucket }}"
          # - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
          #   value: "{{ .Values.identity.loki.roleArn }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcludedPrivileged" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
