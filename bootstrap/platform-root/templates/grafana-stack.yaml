apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "6.37.0"
      helm:
        valueFiles:
          - $values/core/components/grafana-stack/loki-values.yaml
        parameters:
          - name: loki.storage.azure.accountName
            value: "{{ .Values.global.storageAccountName }}"
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.loki.clientId }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
