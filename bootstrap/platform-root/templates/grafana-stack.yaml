apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: mimir-distributed
      targetRevision: "6.0.5"
      helm:
        valueFiles:
          - $values/core/components/grafana-stack/mimir-values.yaml
          - $values/core/components/grafana-stack/mimir-values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "mimir" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — mimir-distributed per-component */}}
          {{- $mode := default "auto" (index .Values.scheduling "mimir") }}
          {{- $modeIngester := default "auto" (index .Values.scheduling "mimir-ingester") }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $mode
                "paths" (list "gateway" "distributor" "querier" "query_frontend" "query_scheduler" "ruler" "compactor" "store_gateway" "alertmanager" "overrides_exporter")
                "provider" .Values.global.provider) | nindent 10 }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $modeIngester
                "paths" (list "ingester")
                "provider" .Values.global.provider) | nindent 10 }}
