{{- /* Gated on components.external-secrets rather than a key of its own: a
       ClusterSecretStore is an External Secrets custom resource, so without
       that operator it is an object no controller reconciles. */ -}}
{{- if ne (index .Values.components "external-secrets" | toString) "false" }}
{{- /* core: secrets store — conditional on provider, cannot be disabled */ -}}
{{- if has .Values.global.provider (list "aws" "azure" "digitalocean") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/cluster-secret-store
      helm:
        valueFiles:
          - $values/components/cluster-secret-store/values.yaml
          - $values/values/platform/cluster-secret-store.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cluster-secret-store" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "cluster-secret-store" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: provider
            value: "{{ .Values.global.provider }}"
          {{- if eq .Values.global.provider "azure" }}
          - name: vaultUrl
            value: "{{ .Values.global.keyVaultUri }}"
          - name: tenantId
            value: "{{ .Values.global.tenantId }}"
          {{- else if eq .Values.global.provider "aws" }}
          - name: region
            value: "{{ .Values.global.region }}"
          {{- end }}
          {{- /* Pass-through of components.vault toggle: when the
                operator activates Vault (which renders the Vault
                Application via vault.yaml), the cluster-secret-store
                chart simultaneously renders the `app-secret-store`
                ClusterSecretStore pointing at in-cluster Vault. The
                cortex `common-app` chart hardcodes that storeName.
                Gitops side is gated by `.Values.vault.enabled` —
                default off when this parameter is not passed. */}}
          - name: vault.enabled
            value: "{{ ne (index .Values.components "vault") false }}"
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
