{{- /* Gated on components.external-secrets rather than a key of its own: a
       ClusterSecretStore is an External Secrets custom resource, so without
       that operator it is an object no controller reconciles. */ -}}
{{- if ne (index .Values.components "external-secrets" | toString) "false" }}
{{- /* core: secrets store — conditional on provider, cannot be disabled */ -}}
{{- /* The store BACKEND, which is not always the cloud. aws and azure each
       have a managed one; DigitalOcean has none, so it reads from Google
       Secret Manager when the deployment has provisioned it. Empty project =
       no store, and then no Application: a ClusterSecretStore that cannot
       authenticate is worse than none, because it syncs green and every
       ExternalSecret referring to it fails somewhere else. */ -}}
{{- $storeBackend := "" -}}
{{- if has .Values.global.provider (list "aws" "azure") -}}
{{- $storeBackend = .Values.global.provider -}}
{{- else if and (eq .Values.global.provider "digitalocean") .Values.global.gcpSecretManagerProject -}}
{{- $storeBackend = "gcpsm" -}}
{{- end -}}
{{- if $storeBackend }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/cluster-secret-store
      helm:
        valueFiles:
          - $values/components/cluster-secret-store/values.yaml
          - $values/values/platform/cluster-secret-store.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cluster-secret-store" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "cluster-secret-store" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: provider
            value: "{{ $storeBackend }}"
          {{- if eq $storeBackend "azure" }}
          - name: vaultUrl
            value: "{{ .Values.global.keyVaultUri }}"
          - name: tenantId
            value: "{{ .Values.global.tenantId }}"
          {{- else if eq $storeBackend "aws" }}
          - name: region
            value: "{{ .Values.global.region }}"
          {{- else if eq $storeBackend "gcpsm" }}
          - name: gcpsm.projectID
            value: "{{ .Values.global.gcpSecretManagerProject }}"
          {{- /* TWO AUDIENCES, ONE VALUE. `audience` is the STS audience, in
                 the `//iam.googleapis.com/...` form. The ServiceAccount
                 audience is the `aud` of the projected Kubernetes token, which
                 Google requires as the same path with an `https:` prefix.
                 Deriving the second means they cannot drift apart — and a
                 mismatch fails at the token exchange, with an error that names
                 neither of them. */}}
          - name: gcpsm.audience
            value: "{{ .Values.global.gcpWorkloadIdentityAudience }}"
          - name: gcpsm.serviceAccount.audiences[0]
            value: "https:{{ .Values.global.gcpWorkloadIdentityAudience }}"
          {{- if .Values.global.gcpSecretManagerServiceAccount }}
          - name: gcpsm.gcpServiceAccountEmail
            value: "{{ .Values.global.gcpSecretManagerServiceAccount }}"
          {{- end }}
          {{- end }}
          {{- /* Pass-through of components.vault toggle: when the
                operator activates Vault (which renders the Vault
                Application via vault.yaml), the cluster-secret-store
                chart simultaneously renders the `app-secret-store`
                ClusterSecretStore pointing at in-cluster Vault. The
                cortex `common-app` chart hardcodes that storeName.
                Gitops side is gated by `.Values.vault.enabled` —
                default off when this parameter is not passed. */}}
          - name: vault.enabled
            value: "{{ ne (index .Values.components "vault") false }}"
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
