{{- /* optional: downstream can disable via components.kube-state-metrics: false */ -}}
{{- if ne (index .Values.components "kube-state-metrics") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "kube-state-metrics" "default" "5.27.0" "root" $) }}"
      helm:
        valueFiles:
          - $values/values/platform/kube-state-metrics.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "kube-state-metrics" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "kube-state-metrics" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "kube-state-metrics"))
             "provider" .Values.global.provider
             ) | nindent 10 }}
        {{- include "platform-root.provenanceParametersBlock" $ | nindent 8 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-state-metrics
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
