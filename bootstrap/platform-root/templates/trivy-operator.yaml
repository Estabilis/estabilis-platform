{{- /* optional: downstream can disable via components.trivy: false */ -}}
{{- if ne (index .Values.components "trivy") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts
      chart: trivy-operator
      targetRevision: "0.32.0"
      helm:
        valueFiles:
          - $values/core/components/trivy-operator/values.yaml
          - $values/core/components/trivy-operator/values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "trivy-operator" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97)
                trivy-operator 0.32.0:
                  - operator deployment reads top-level tolerations/affinity
                  - scan jobs created at runtime by the operator receive
                    trivy.scanJobTolerations / trivy.scanJobAffinity. */}}
          {{- $mode := default "auto" (index .Values.scheduling "trivy-operator") }}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" $mode
                "provider" .Values.global.provider) | nindent 10 }}
          trivy:
            scanJobTolerations:
              {{- include "platform-root.schedulingTolerations" (dict "provider" .Values.global.provider) | nindent 14 }}
            scanJobAffinity:
              {{- include "platform-root.schedulingAffinity" (dict "mode" $mode) | nindent 14 }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
