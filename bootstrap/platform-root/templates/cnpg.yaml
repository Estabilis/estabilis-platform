apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.23.0"
      helm:
        valueFiles:
          - $values/core/components/cnpg/values.yaml
          - $values/core/components/cnpg/values-{{ .Values.global.provider }}.yaml
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/cnpg-cluster
      helm:
        valueFiles:
          - $values/core/components/cnpg-cluster/values.yaml
        parameters:
          - name: global.storageAccountName
            value: "{{ .Values.global.storageAccountName }}"
          - name: global.cnpgBackupRetentionDays
            value: "{{ .Values.global.cnpgBackupRetentionDays }}"
          - name: global.cnpgBackupSchedule
            value: "{{ .Values.global.cnpgBackupSchedule }}"
          - name: identity.cnpg.clientId
            value: "{{ .Values.identity.cnpg.clientId }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
