{{- /* core: this component cannot be disabled — platform depends on it */ -}}
{{- /*
  Split into two Applications:
  1. cnpg-crds: installs only CRDs (no controller pods)
  2. cnpg-operator: installs controller (CRDs already exist)
  This avoids chicken-and-egg: controller needs CRDs to start, but CRDs
  are installed by the same chart.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-crds
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.27.1"
      helm:
        parameters:
          - name: crds.create
            value: "true"
          - name: replicaCount
            value: "0"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.27.1"
      helm:
        valueFiles:
          - $values/core/components/cnpg/values.yaml
          - $values/core/components/cnpg/values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cnpg" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        parameters:
          - name: crds.create
            value: "false"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/cnpg-cluster
      helm:
        valueFiles:
          - $values/core/components/cnpg-cluster/values.yaml
        parameters:
          - name: global.storageAccountName
            value: "{{ .Values.global.cnpgStorageAccountName }}"
          - name: global.cnpgBackupContainerName
            value: "{{ .Values.global.cnpgBackupContainerName }}"
          - name: global.cnpgBackupRetentionDays
            value: "{{ .Values.global.cnpgBackupRetentionDays }}"
          - name: global.cnpgBackupSchedule
            value: "{{ .Values.global.cnpgBackupSchedule }}"
          - name: identity.cnpg.clientId
            value: "{{ .Values.identity.cnpg.clientId }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
