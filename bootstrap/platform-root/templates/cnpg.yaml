apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.23.0"
      helm:
        valueFiles:
          - $values/core/components/cnpg/values.yaml
          - $values/core/components/cnpg/values-{{ .Values.global.provider }}.yaml
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  source:
    repoURL: {{ .Values.platformRepoUrl }}
    targetRevision: {{ .Values.platformVersion }}
    path: core/components/cnpg-cluster
    directory:
      include: "cluster-{{ .Values.global.provider }}.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
