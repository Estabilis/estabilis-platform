{{- /* Honours components.cnpg. This wraps ONLY the operator, the first
       document in this file. The cnpg-cluster document below carries its
       own provider gate and its own reasons. */ -}}
{{- if ne (index .Values.components "cnpg" | toString) "false" }}
{{- /* core: this component cannot be disabled — platform depends on it */ -}}
{{- /* CRDs are applied by the upstart pipeline before this Application syncs */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "cloudnative-pg" "default" "0.28.0" "root" $) }}"
      helm:
        valueFiles:
          - $values/core/components/cnpg/values.yaml
          - $values/core/components/cnpg/values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cnpg" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — cnpg-operator chart Deployment */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "cnpg"))
             "provider" .Values.global.provider
             ) | nindent 10 }}
        parameters:
          - name: crds.create
            value: "false"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
---
{{- /* cnpg-cluster — provider-aware rendering (v0.20.0+).

      The chart under core/components/cnpg-cluster carries two templates:
        - cluster-azure.yaml: Barman Cloud → Azure Blob Storage, auth
          via Azure Workload Identity (inheritFromAzureAD: true).
        - cluster-aws.yaml: Barman Cloud → S3, auth via IRSA
          (s3Credentials.inheritFromIAMRole: true).

      Each template is gated on `.Values.global.provider`, so this
      Application emits exactly one Cluster CR + ScheduledBackup +
      ServiceAccount per cluster.

      The AWS branch lands in v0.20.0, replacing the Azure-only gate
      that used to guard this Application. Closes the gap flagged in
      Estabilis/estabilis-platform-tools#186. */ -}}
{{- /* DigitalOcean joins the gate. It is not optional there the way it might
       look: grafana-values.yaml hardcodes
       platform-postgres-rw.cnpg-system.svc.cluster.local with
       persistence.enabled false, and grafana-db declares a Database against
       `platform-postgres` by name, so Grafana has no database without this
       Cluster. */ -}}
{{- if has .Values.global.provider (list "azure" "aws" "digitalocean") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/cnpg-cluster
      helm:
        valueFiles:
          - $values/core/components/cnpg-cluster/values.yaml
          {{- /* Storage size and the WAL bound are deployment-specific: a
                 cluster that had to be grown to escape a full volume cannot
                 be shrunk back, so without an override the Application stays
                 permanently OutOfSync against a value it can never reach. */}}
          {{- include "platform-root.overrideValueFile" (dict "component" "cnpg-cluster" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: global.provider
            value: "{{ .Values.global.provider }}"
          - name: global.cnpgBackupRetentionDays
            value: "{{ .Values.global.cnpgBackupRetentionDays }}"
          - name: global.cnpgBackupSchedule
            value: "{{ .Values.global.cnpgBackupSchedule }}"
          {{- if eq .Values.global.provider "azure" }}
          - name: global.storageAccountName
            value: "{{ .Values.global.cnpgStorageAccountName }}"
          - name: global.cnpgBackupContainerName
            value: "{{ .Values.global.cnpgBackupContainerName }}"
          - name: identity.cnpg.clientId
            value: "{{ .Values.identity.cnpg.clientId }}"
          {{- else if eq .Values.global.provider "aws" }}
          - name: global.cnpgBackupBucketName
            value: "{{ .Values.global.cnpgBackupBucketName }}"
          - name: global.region
            value: "{{ .Values.global.region }}"
          - name: identity.cnpg.roleArn
            value: "{{ .Values.identity.cnpg.roleArn }}"
          {{- else if eq .Values.global.provider "digitalocean" }}
          {{- /* No identity parameter: Spaces has no instance roles, so Barman
                 reads a static key from a Secret the deployment's Terraform
                 provisions. Naming it here would put it on this spec. */}}
          - name: global.cnpgBackupBucketName
            value: "{{ .Values.global.cnpgBackupBucketName }}"
          - name: global.spacesEndpoint
            value: "{{ .Values.global.spacesEndpoint }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
