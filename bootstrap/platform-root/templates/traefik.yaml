{{- /* optional: downstream can disable via components.traefik: false.
  Also auto-disabled when global.ingressController is set to something
  other than "traefik" (e.g. "traefik-internal" for ILB-only clusters). */ -}}
{{- $icOverride := index .Values.global "ingressController" | default "" -}}
{{- $trafikDisabledByIC := and (ne $icOverride "") (ne $icOverride "traefik") -}}
{{- if and (ne (index .Values.components "traefik" | toString) "false") (not $trafikDisabledByIC) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "traefik" "default" "39.0.5" "root" $) }}"
      helm:
        valueFiles:
          - $values/values/platform/traefik.yaml
          - $values/values/platform/traefik-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "traefik" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "traefik"))
             "provider" .Values.global.provider
             ) | nindent 10 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # REQUIRED, not defensive. The chart ships the Gateway API CRDs, and
      # httproutes.gateway.networking.k8s.io is 368733 bytes — measured from
      # the rendered manifests of chart 39.0.5, not estimated.
      #
      # A client-side apply writes the whole object into the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which the
      # API server caps at 262144 bytes. Without this the sync fails with
      # "Too long: must have at most 262144 bytes" ON THE CRD, which reads as
      # a Kubernetes limit on the resource rather than as the apply mode being
      # wrong — and the CRD is the one thing an operator cannot make smaller.
      #
      # kyverno, external-secrets, cert-manager and cnpg-operator all carry
      # this already. traefik was the one that did not, and it ships the
      # largest single CRD of any component here.
      - ServerSideApply=true
{{- end }}
