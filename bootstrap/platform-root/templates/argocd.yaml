{{- /* core: this component cannot be disabled — platform depends on it */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "9.4.7"
      helm:
        valueFiles:
          - $values/core/components/argocd/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "argocd" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97). Default: auto. */}}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" (default "auto" (index .Values.scheduling "argocd"))
                "paths" (list "controller" "server" "repoServer" "applicationSet" "notifications" "dex" "redis")
             ) | nindent 10 }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    {{- /* argocd-secret: the chart renders this Secret with `data: {}`
           because `redisSecretInit.enabled = false` (see
           core/components/argocd/values.yaml — disabling that hook avoids
           foregroundDeletion deadlocks on ArgoCD self-manage sync).
           Without ignoreDifferences here, every reconcile of the argocd
           Application would overwrite `/data` via ServerSideApply,
           wiping `server.secretkey`. Terraform pre-populates
           `server.secretkey` via `kubernetes_secret_v1_data` in
           providers/{aws,azure}/argocd-secret.tf — this ignoreDifferences
           keeps it intact across syncs. */}}
    - group: ""
      kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
