{{- /* core: this component cannot be disabled — platform depends on it */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "9.5.6"
      helm:
        valueFiles:
          - $values/core/components/argocd/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "argocd" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97). Default: auto. */}}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" (default "auto" (index .Values.scheduling "argocd"))
                "paths" (list "controller" "server" "repoServer" "applicationSet" "notifications" "dex" "redis")
             "provider" .Values.global.provider
             ) | nindent 10 }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    {{- /* argocd-secret data is owned by argocd-server (admin password,
          server.secretkey, admin.passwordMtime). The argo-cd 9.5.6 chart
          renders the Secret WITHOUT a `data:` block when no optional
          (argocdServerAdminPassword, extra, webhook secrets...) is set —
          so SSA preserves data fine in steady state. The risk is during
          rolling restarts of argocd-server: if the informer cache is
          briefly empty, `InitializeSettings` (util/settings/settings.go)
          regenerates server.secretkey, invalidating every live JWT.
          Pinning data via ignoreDifferences makes the field fully owned
          by argocd-server and immune to spurious reconciliation. Observed
          incident: cortex prd 2026-04-30, "server.secretkey is missing"
          on UI after self-managed sync rotated the Deployment template. */}}
    - group: ""
      kind: Secret
      name: argocd-secret
      jqPathExpressions:
        - .data
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
