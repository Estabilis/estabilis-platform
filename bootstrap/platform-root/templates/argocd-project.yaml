{{- /* core: this component cannot be disabled — platform depends on it */ -}}
# Platform project — restricted to platform namespaces only
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Estabilis Platform core components
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if and .Values.configRepoUrl .Values.configRepoVersion }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    {{- if and .Values.platformGitopsRepoUrl .Values.platformGitopsVersion }}
    - {{ .Values.platformGitopsRepoUrl | quote }}
    {{- end }}
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
    - "https://aquasecurity.github.io/helm-charts"
    - "https://opencost.github.io/opencost-helm-chart"
    - "https://cloudnative-pg.github.io/charts"
    - "https://vmware-tanzu.github.io/helm-charts"
    - "https://prometheus-community.github.io/helm-charts"
    {{- /*
    Platform add-on repos: must match the repoURL emitted by
    platform-addons.yaml. ArgoCD 3.x requires OCI Helm repoURL WITHOUT
    the `oci://` prefix, and the chart path (e.g. `charts`) is part of
    the repoURL, not the chart field. See the upstream docs:
    https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-chart-repositories
    */ -}}
    {{- $acrOciRepo := "" -}}
    {{- if .Values.global.acrLoginServer }}
    {{- $acrOciRepo = printf "%s/charts" .Values.global.acrLoginServer }}
    {{- end }}
    {{- $addonRepos := dict }}
    {{- range $name, $addon := .Values.platformAddons }}
    {{- $repo := $addon.repoURL | default $acrOciRepo }}
    {{- if $repo }}
    {{- $_ := set $addonRepos $repo true }}
    {{- end }}
    {{- end }}
    {{- range $repo, $_ := $addonRepos }}
    - {{ $repo | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: "app-*"
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: grafana
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: trivy-system
    - server: https://kubernetes.default.svc
      namespace: opencost
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: kube-state-metrics
    - server: https://kubernetes.default.svc
      namespace: node-exporter
    - server: https://kubernetes.default.svc
      namespace: policy-reporter
    - server: https://kubernetes.default.svc
      namespace: estabilis-system
    {{- range $name, $addon := .Values.platformAddons }}
    {{- if $addon.namespace }}
    - server: https://kubernetes.default.svc
      namespace: {{ $addon.namespace }}
    {{- end }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: aquasecurity.github.io
      kind: "*"
    - group: networking.k8s.io
      kind: IngressClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: policy
      kind: PodDisruptionBudget
---
# Workload-baseline project — for platform baseline components deployed
# to workload clusters via the workload-bootstrap ApplicationSets.
# Permits all workload cluster destinations + baseline namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform baseline components on workload clusters
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if and .Values.platformGitopsRepoUrl .Values.platformGitopsVersion }}
    - {{ .Values.platformGitopsRepoUrl | quote }}
    {{- end }}
    {{- if and .Values.configRepoUrl .Values.configRepoVersion }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
  destinations:
    # Hub (workload-bootstrap + ApplicationSets live here)
    - server: https://kubernetes.default.svc
      namespace: argocd
    # Workload clusters — permit all namespaces because baseline
    # components (resource-quotas, network-policies) manage resources
    # across every namespace including client-managed ones (kong, etc.)
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: PolicyException
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: networking.k8s.io
      kind: "*"
    - group: policy
      kind: PodDisruptionBudget
---
# Client-infra project — for client-managed infrastructure components
# (e.g. Kong, Envoy Gateway) deployed to workload clusters via the
# client-apps ApplicationSet in workload-bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client-managed infrastructure on workload clusters
  sourceRepos:
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://charts.konghq.com"
    - "*"
  destinations:
    # Hub (client-apps wrapper Applications live here)
    - server: https://kubernetes.default.svc
      namespace: argocd
    # Workload clusters — client can deploy to any namespace
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: gateway.networking.k8s.io
      kind: "*"
    - group: configuration.konghq.com
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- if and .Values.configRepoUrl .Values.configRepoVersion }}
---
# Applications project — for client custom apps in app-* namespaces
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client custom applications (app-* namespaces only)
  sourceRepos:
    - {{ .Values.configRepoUrl | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "app-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
