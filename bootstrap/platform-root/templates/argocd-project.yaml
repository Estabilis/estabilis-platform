apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Estabilis Platform core components
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if and .Values.configRepoUrl .Values.configRepoVersion }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
    - "https://aquasecurity.github.io/helm-charts"
    - "https://opencost.github.io/opencost-helm-chart"
    - "https://cloudnative-pg.github.io/charts"
    - "https://vmware-tanzu.github.io/helm-charts"
    - "https://prometheus-community.github.io/helm-charts"
  # Wildcard destinations — clients can deploy custom apps to any namespace.
  # Security is enforced by Kyverno policies, not AppProject restrictions.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: aquasecurity.github.io
      kind: "*"
    - group: networking.k8s.io
      kind: IngressClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: policy
      kind: PodDisruptionBudget
