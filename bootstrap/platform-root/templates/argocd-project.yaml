{{- /* core: this component cannot be disabled — platform depends on it */ -}}
# Platform project — restricted to platform namespaces only
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Estabilis Platform core components
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if .Values.configRepoUrl }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    {{- if and .Values.platformGitopsRepoUrl .Values.platformGitopsVersion }}
    - {{ .Values.platformGitopsRepoUrl | quote }}
    {{- end }}
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
    - "https://aquasecurity.github.io/helm-charts"
    - "https://opencost.github.io/opencost-helm-chart"
    - "https://cloudnative-pg.github.io/charts"
    - "https://vmware-tanzu.github.io/helm-charts"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://kubernetes-sigs.github.io/metrics-server/"
    - "public.ecr.aws/karpenter"
    - "https://aws.github.io/eks-charts"
    - "https://helm.releases.hashicorp.com"
    {{- /*
    Platform add-on repos: must match the repoURL emitted by
    platform-addons.yaml. ArgoCD 3.x requires OCI Helm repoURL WITHOUT
    the `oci://` prefix, and the chart path (e.g. `charts`) is part of
    the repoURL, not the chart field. See the upstream docs:
    https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-chart-repositories
    */ -}}
    {{- $acrOciRepo := "" -}}
    {{- if .Values.global.acrLoginServer }}
    {{- $acrOciRepo = printf "%s/charts" .Values.global.acrLoginServer }}
    {{- end }}
    {{- $addonRepos := dict }}
    {{- range $name, $addon := .Values.platformAddons }}
    {{- $repo := $addon.repoURL | default $acrOciRepo }}
    {{- if $repo }}
    {{- $_ := set $addonRepos $repo true }}
    {{- end }}
    {{- end }}
    {{- range $repo, $_ := $addonRepos }}
    - {{ $repo | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: "app-*"
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: grafana
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: trivy-system
    - server: https://kubernetes.default.svc
      namespace: opencost
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: kube-state-metrics
    - server: https://kubernetes.default.svc
      namespace: node-exporter
    - server: https://kubernetes.default.svc
      namespace: policy-reporter
    - server: https://kubernetes.default.svc
      namespace: estabilis-system
    - server: https://kubernetes.default.svc
      namespace: metrics-server
    - server: https://kubernetes.default.svc
      namespace: karpenter
    - server: https://kubernetes.default.svc
      namespace: aws-load-balancer-controller
    - server: https://kubernetes.default.svc
      namespace: vault
    {{- range $name, $addon := .Values.platformAddons }}
    {{- if $addon.namespace }}
    - server: https://kubernetes.default.svc
      namespace: {{ $addon.namespace }}
    {{- end }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: aquasecurity.github.io
      kind: "*"
    - group: networking.k8s.io
      kind: IngressClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: policy
      kind: PodDisruptionBudget
    - group: karpenter.sh
      kind: "*"
    - group: karpenter.k8s.aws
      kind: "*"
    - group: elbv2.k8s.aws
      kind: "*"
    - group: apiregistration.k8s.io
      kind: APIService
---
# Workload-baseline project — for platform baseline components deployed
# to workload clusters via the workload-bootstrap ApplicationSets.
# Permits all workload cluster destinations + baseline namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform baseline components on workload clusters
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if and .Values.platformGitopsRepoUrl .Values.platformGitopsVersion }}
    - {{ .Values.platformGitopsRepoUrl | quote }}
    {{- end }}
    {{- if .Values.configRepoUrl }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
  destinations:
    # Hub (workload-bootstrap + ApplicationSets live here)
    - server: https://kubernetes.default.svc
      namespace: argocd
    # Workload clusters — permit all namespaces because baseline
    # components (resource-quotas, network-policies) manage resources
    # across every namespace including client-managed ones (kong, etc.)
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: kyverno.io
      kind: ClusterPolicy
    - group: kyverno.io
      kind: PolicyException
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: networking.k8s.io
      kind: "*"
    - group: policy
      kind: PodDisruptionBudget
---
# Workload-client-infra project — for client-managed infrastructure
# components (Kong, Dapr, Envoy Gateway, sidecar injectors) deployed
# to workload clusters via the client-apps ApplicationSet in
# workload-bootstrap. Pairs with platform-client-infra (hub variant).
# ADR 0027 — was previously named `workload-infra`; renamed to make
# the (cluster, owner, scope) taxonomy uniform: client-infra projects
# are always `<cluster>-client-infra`.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-client-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client-managed infrastructure on workload clusters
  sourceRepos:
    {{- if .Values.clientGitopsRepoUrl }}
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- end }}
    - "https://charts.konghq.com"
    - "*"
  destinations:
    # Hub (client-apps wrapper Applications live here)
    - server: https://kubernetes.default.svc
      namespace: argocd
    # Workload clusters — client can deploy to any namespace
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: gateway.networking.k8s.io
      kind: "*"
    - group: configuration.konghq.com
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- if .Values.clientGitopsRepoUrl }}
---
# ADR 0017 — platform-client-infra project
# For client-authored infrastructure Applications deployed to the HUB
# cluster (not workload clusters). Discovered from the client gitops
# repo at platforms/{deploymentId}/hub-apps/* by the hub-client-apps
# ApplicationSet. Destinations are driven by clientHubAppNamespaces
# (explicit allowlist declared in the wrapper) — no wildcards.
#
# ClusterRole / ClusterRoleBinding / CRD are intentionally allowed
# because legitimate hub-apps (webhook admission controllers,
# operators with cluster-wide reach, CRD providers) need them. Risk is
# audited by the Kyverno catalog, not blocked by the project —
# ADR 0017 "upstream proposes, client disposes".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-client-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client-authored infrastructure Applications on the platform hub (ADR 0017)
  sourceRepos:
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- if .Values.global.sharedAcrLoginServer }}
    - {{ printf "%s/charts" .Values.global.sharedAcrLoginServer | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    {{- range .Values.clientHubAppNamespaces }}
    - server: https://kubernetes.default.svc
      namespace: {{ . | quote }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: kyverno.io
      kind: PolicyException
    - group: networking.k8s.io
      kind: "*"
    {{- /* ADR 0017 extension — client-declared additional cluster-scoped
           kinds their hub-apps need. Appended via wrapper override at
           overrides/platform-root/values.yaml.clientHubAppExtraClusterResources.
           Upstream defines governance classes; client declares specific
           kinds their own hub-apps require. */}}
    {{- range .Values.clientHubAppExtraClusterResources }}
    - group: {{ .group | quote }}
      kind: {{ .kind | quote }}
    {{- end }}
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
{{- if .Values.configRepoUrl }}
---
# Platform-apps project — for client business applications running on
# the platform/hub cluster in app-* namespaces. Mirror image of
# workload-apps (workload-cluster variant). ADR 0027 — was previously
# named `applications`; renamed to make the (cluster, owner, scope)
# taxonomy uniform: business-app projects are always `<cluster>-apps`.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client business applications on the platform cluster (app-* only)
  sourceRepos:
    - {{ .Values.configRepoUrl | quote }}
    {{- /* Operators add upstream chart hosts via wrapper override
           (overrides/platform-root/values.yaml):
             platformAppsExtraSourceRepos:
               - "https://charts.example.com"
               - "oci://my-oci-registry/charts"
           No wildcards — every host must be explicit. */}}
    {{- range .Values.platformAppsExtraSourceRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "app-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
{{- if .Values.clientGitopsRepoUrl }}
---
# Workload-apps project — for client business applications running on
# workload clusters in app-* namespaces. Mirrors platform-apps
# (platform/hub variant) but scoped to workload-cluster destinations.
# ADR 0027 §Part 2 — resolves the RBAC collision documented in §Issue 1
# (business apps no longer inherit cluster-infra permissions from
# workload-client-infra). Inner Applications generated by the
# `client-apps` ApplicationSet in workload-bootstrap declare
# `project: workload-apps` when their target namespace is app-*.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workload-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client business applications on workload clusters (app-* only)
  sourceRepos:
    - {{ .Values.clientGitopsRepoUrl | quote }}
    {{- if .Values.global.sharedAcrLoginServer }}
    - {{ printf "%s/charts" .Values.global.sharedAcrLoginServer | quote }}
    {{- end }}
    {{- /* Operators add upstream chart hosts via wrapper override
           (overrides/platform-root/values.yaml):
             workloadAppsExtraSourceRepos:
               - "https://charts.bitnami.com/bitnami"
               - "oci://my-oci-registry/charts"
           No wildcards — every host must be explicit. */}}
    {{- range .Values.workloadAppsExtraSourceRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    # Hub argocd ns — wrapper Applications live here, the inner
    # Application's destination.name targets the workload cluster.
    - server: https://kubernetes.default.svc
      namespace: argocd
    # Workload clusters — app-* only.
    - server: "*"
      namespace: "app-*"
  clusterResourceWhitelist:
    # Apps may create their own namespace, nothing else cluster-scoped.
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
