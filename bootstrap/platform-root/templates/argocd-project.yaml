{{- /* core: this component cannot be disabled — platform depends on it */ -}}
# Platform project — restricted to platform namespaces only
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Estabilis Platform core components
  sourceRepos:
    - {{ .Values.platformRepoUrl | quote }}
    {{- if and .Values.configRepoUrl .Values.configRepoVersion }}
    - {{ .Values.configRepoUrl | quote }}
    {{- end }}
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.jetstack.io"
    - "https://kyverno.github.io/kyverno"
    - "https://charts.external-secrets.io"
    - "https://kubernetes-sigs.github.io/external-dns"
    - "https://grafana.github.io/helm-charts"
    - "https://traefik.github.io/charts"
    - "https://aquasecurity.github.io/helm-charts"
    - "https://opencost.github.io/opencost-helm-chart"
    - "https://cloudnative-pg.github.io/charts"
    - "https://vmware-tanzu.github.io/helm-charts"
    - "https://prometheus-community.github.io/helm-charts"
    {{- range $name, $addon := .Values.platformAddons }}
    - {{ $addon.repoURL | quote }}
    {{- end }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: "app-*"
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: grafana
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: trivy-system
    - server: https://kubernetes.default.svc
      namespace: opencost
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: kube-state-metrics
    - server: https://kubernetes.default.svc
      namespace: node-exporter
    - server: https://kubernetes.default.svc
      namespace: policy-reporter
    - server: https://kubernetes.default.svc
      namespace: estabilis-system
    {{- range $name, $addon := .Values.platformAddons }}
    {{- if $addon.namespace }}
    - server: https://kubernetes.default.svc
      namespace: {{ $addon.namespace }}
    {{- end }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: "*"
      kind: ClusterRole
    - group: "*"
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: "*"
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: aquasecurity.github.io
      kind: "*"
    - group: networking.k8s.io
      kind: IngressClass
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: policy
      kind: PodDisruptionBudget
{{- if and .Values.configRepoUrl .Values.configRepoVersion }}
---
# Applications project — for client custom apps in app-* namespaces
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Client custom applications (app-* namespaces only)
  sourceRepos:
    - {{ .Values.configRepoUrl | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "app-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- end }}
