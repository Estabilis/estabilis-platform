{{- /* core: consolidated secrets — all ExternalSecrets in a single Application.

The chart itself (core/components/platform-secrets) is provider-agnostic:
it emits ExternalSecrets that reference `platform-secret-store`, a
ClusterSecretStore already wired per provider in cluster-secret-store.yaml.
Only Azure-specific parameters are gated below. */ -}}
{{- if has .Values.global.provider (list "aws" "azure" "digitalocean") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: {{ .Values.platformRepoUrl }}
    targetRevision: {{ .Values.platformVersion }}
    path: core/components/platform-secrets
    helm:
      parameters:
        {{- include "platform-root.provenanceParameters" $ | nindent 8 }}
        {{- if .Values.configRepoUrl }}
        - name: configRepoUrl
          value: {{ .Values.configRepoUrl | quote }}
        {{- end }}
        {{- if .Values.clientGitopsRepoUrl }}
        - name: clientGitopsRepoUrl
          value: {{ .Values.clientGitopsRepoUrl | quote }}
        {{- end }}
        {{- if and (eq .Values.global.provider "azure") .Values.global.acrLoginServer }}
        {{- /* ACR OCI repo-creds ExternalSecret — Azure-only until a
              provider-neutral registry variable lands
              (Estabilis/estabilis-platform-tools#182). On AWS the chart
              emits no ACR secret because `acrLoginServer` stays empty. */}}
        - name: acrLoginServer
          value: {{ .Values.global.acrLoginServer | quote }}
        {{- end }}
        {{- /* Propagate components.opencost to the platform-secrets chart
              so opencost ExternalSecrets don't render into the opencost
              namespace when that component is disabled downstream.

              Gated on the same precondition as bootstrap/platform-root/templates/opencost.yaml:
              both components.opencost!=false AND global.curBucketName!="". If
              CUR isn't provisioned, the upstream AWS Secrets Manager entries
              (opencost-cloud-service-key, opencost-cloud-integration) don't
              exist, so skipping the ExternalSecrets here avoids permanent
              SecretSyncedError state. */}}
        - name: opencostEnabled
          value: "{{ and (ne (index .Values.components "opencost" | toString) "false") (not (empty .Values.global.curBucketName)) }}"
        {{- /* When a GitHub App is configured, the platform module writes
              a cluster-wide repo-creds Secret that covers every repo
              under the org. The per-repo PAT ExternalSecrets in
              platform-secrets.yaml become redundant AND collide with
              repo-creds matching (type: repository outranks
              type: repo-creds). Propagate a flag so the chart skips
              them. */}}
        - name: githubAppEnabled
          value: "{{ ne (.Values.global.githubAppID | toString) "" }}"
        {{- /* OpenAI API key — gates grafana-llm-credentials ExternalSecret
              and the matching grafana-llm-provisioning ConfigMap. The
              providers' platform-outputs.tf compute
              `global.openaiApiKeyEnabled = tostring(var.openai_api_key != "")`
              and write it to the platform-infrastructure ConfigMap. Without
              this gate, deployments that don't populate `openai_api_key`
              (the default) see continuous "Secret does not exist" reconcile
              errors on grafana-llm-credentials because the source AWS SM /
              Azure KV secret was never created (TF gate
              `count = var.openai_api_key != "" ? 1 : 0`). */}}
        - name: openaiApiKeyEnabled
          value: "{{ default false .Values.global.openaiApiKeyEnabled }}"
        {{- if eq .Values.global.provider "aws" }}
        {{- /* AWS Secrets Manager secrets live under
              estabilis/<deploymentId>/* path (the IRSA scope for
              external-secrets). ExternalSecret remoteRef.key must be
              the full SM secret name. Override each kvSecrets entry
              with its prefixed path. Secrets not provisioned by TF
              (configRepoToken, clientGitopsRepoToken, openaiApiKey,
              opencost*) will fail individual SecretSynced reconciliation
              until the operator populates them in SM — consistent with
              how Azure deployments require the corresponding Key Vault
              secrets to exist. */}}
        - name: kvSecrets.argocdRedisPassword
          value: "{{ .Values.global.secretsPathPrefix }}/platform-argocd-redis-password"
        - name: kvSecrets.grafanaAdminPassword
          value: "{{ .Values.global.secretsPathPrefix }}/platform-grafana-admin-password"
        - name: kvSecrets.grafanaDbPassword
          value: "{{ .Values.global.secretsPathPrefix }}/platform-grafana-db-password"
        - name: kvSecrets.configRepoToken
          value: "{{ .Values.global.secretsPathPrefix }}/platform-config-repo-token"
        - name: kvSecrets.clientGitopsRepoToken
          value: "{{ .Values.global.secretsPathPrefix }}/platform-client-gitops-repo-token"
        - name: kvSecrets.openaiApiKey
          value: "{{ .Values.global.secretsPathPrefix }}/platform-openai-api-key"
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
{{- end }}
