{{- /*
  ADR 0014 — ArgoCD UI external ingress. Active when at least one
  profile in global.argocdExposures is enabled. The chart itself
  branches on `ingress_class` (Traefik vs ALB) — no longer gated on
  components.traefik because ALB does not depend on Traefik being
  enabled.
*/ -}}
{{- $raw := index .Values.global "argocdExposures" | default "" -}}
{{- $jsonStr := "{}" -}}
{{- if $raw }}
  {{- if or (hasPrefix "{" $raw) (hasPrefix "[" $raw) }}
    {{- $jsonStr = $raw }}
  {{- else }}
    {{- $jsonStr = b64dec $raw }}
  {{- end }}
{{- end }}
{{- $exposures := fromJson $jsonStr -}}
{{- $hasEnabled := false -}}
{{- $hasTraefikExposure := false -}}
{{- range $_, $exp := $exposures }}{{- if $exp.enabled }}{{- $hasEnabled = true }}{{- if ne $exp.ingress_class "alb" }}{{- $hasTraefikExposure = true }}{{- end }}{{- end }}{{- end }}
{{- /* Require components.traefik only when at least one exposure
       actually targets a Traefik-style class. ALB-only exposures are
       allowed when components.traefik is false. */}}
{{- $traefikGate := or (eq $hasTraefikExposure false) (ne (index .Values.components "traefik" | toString) "false") (eq (index .Values.components "traefik-internal" | default false | toString) "true") (eq (index .Values.global "traefikInternal" | default false | toString) "true") }}
{{- if and $traefikGate $hasEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/argocd-ingress
      helm:
        valueFiles:
          - $values/core/components/argocd-ingress/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "argocd-ingress" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "argocd-ingress" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: exposuresJson
            value: {{ $raw | quote }}
            forceString: true
          {{- /* ALB ingress class consumes these via .Values.global.*
                 in the chart. Ignored on Traefik path. */}}
          - name: global.dnsProvider
            value: "{{ .Values.global.dnsProvider }}"
          - name: global.acmCertificateArn
            value: "{{ .Values.global.acmCertificateArn }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
