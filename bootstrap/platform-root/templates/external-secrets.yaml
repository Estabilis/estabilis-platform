{{- /* core: this component cannot be disabled — platform depends on it */ -}}
{{- /* CRDs are applied by the upstart pipeline before this Application syncs */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.1.0"
      helm:
        valueFiles:
          - $values/values/platform/external-secrets.yaml
          - $values/values/platform/external-secrets-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "external-secrets" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "external-secrets" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — external-secrets has top-level + webhook + certController */}}
          {{- $mode := default "auto" (index .Values.scheduling "external-secrets") }}
          {{- include "platform-root.schedulingValuesTopLevel" (dict "mode" $mode) | nindent 10 }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $mode
                "paths" (list "webhook" "certController")
             ) | nindent 10 }}
        parameters:
          - name: installCRDs
            value: "false"
          {{- if eq .Values.global.provider "azure" }}
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.externalSecrets.clientId }}"
          {{- else if eq .Values.global.provider "aws" }}
          {{- /* AWS IRSA role ARN for the external-secrets controller pod.
                Paired with external-secrets-aws.yaml overlay and
                `module.external_secrets_irsa` in providers/aws/iam.tf.
                The controller assumes this role to read from AWS Secrets
                Manager via the ClusterSecretStore configured in
                cluster-secret-store.yaml. */}}
          - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
            value: "{{ .Values.identity.externalSecrets.roleArn }}"
          {{- end }}
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  ignoreDifferences:
    {{- /*
        cert-manager (or the chart's webhook-self-signing init) injects
        the caBundle into both webhook configurations after install.
        Same pattern as argocd, aws-load-balancer-controller, cert-manager —
        see Estabilis memory `reference_aks_admissionsenforcer_webhook_drift`.
    */}}
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
