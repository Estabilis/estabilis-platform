{{- /*
  ADR 0014 — Loki external ingress Application. Renders when at least one
  exposure profile is enabled in global.lokiExposures (JSON map injected by
  Terraform via platform-root helm parameter). Depends on components.traefik
  being true (shared Traefik CRDs — Middleware type).
*/ -}}
{{- $raw := index .Values.global "lokiExposures" | default "" -}}
{{- $jsonStr := "{}" -}}
{{- if $raw }}
  {{- if or (hasPrefix "{" $raw) (hasPrefix "[" $raw) }}
    {{- $jsonStr = $raw }}
  {{- else }}
    {{- $jsonStr = b64dec $raw }}
  {{- end }}
{{- end }}
{{- $exposures := fromJson $jsonStr -}}
{{- $hasEnabled := false -}}
{{- $hasTraefikExposure := false -}}
{{- range $_, $exp := $exposures }}{{- if $exp.enabled }}{{- $hasEnabled = true }}{{- if ne $exp.ingress_class "alb" }}{{- $hasTraefikExposure = true }}{{- end }}{{- end }}{{- end }}
{{- $traefikGate := or (eq $hasTraefikExposure false) (ne (index .Values.components "traefik" | toString) "false") (eq (index .Values.components "traefik-internal" | default false | toString) "true") }}
{{- if and $traefikGate $hasEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/loki-ingress
      helm:
        valueFiles:
          - $values/core/components/loki-ingress/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "loki-ingress" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: exposuresJson
            value: {{ $raw | quote }}
            forceString: true
          {{- /* ALB ingress class consumes these via .Values.global.* in the chart.
                 Ignored on Traefik path. */}}
          - name: global.dnsProvider
            value: "{{ .Values.global.dnsProvider }}"
          - name: global.acmCertificateArn
            value: "{{ .Values.global.acmCertificateArn }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
