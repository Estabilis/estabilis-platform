{{- /* conditional: enabled via global.lokiExternalIngressEnabled, depends on traefik and loki */ -}}
{{- if or (eq (.Values.global.lokiExternalIngressEnabled | toString) "true") (eq (.Values.global.lokiExternalIngressEnabled | toString) "True") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/loki-ingress
      helm:
        valueFiles:
          - $values/core/components/loki-ingress/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "loki-ingress" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: global.domain
            value: "{{ .Values.global.domain }}"
          - name: global.effectiveDomain
            value: "{{ .Values.global.effectiveDomain }}"
          - name: global.host
            value: {{ include "estabilis.host" (dict "app" "loki" "global" .Values.global) | quote }}
          - name: allowedCidrs
            value: "{{ .Values.global.lokiAllowedCidrs }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
