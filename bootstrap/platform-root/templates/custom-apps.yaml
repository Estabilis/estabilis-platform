{{- /* conditional: downstream custom apps — enabled when configRepoUrl is set */ -}}
{{- if and .Values.configRepoUrl .Values.configRepoVersion }}
{{- range $name, $app := .Values.customApps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-{{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "10" | quote }}
  labels:
    estabilis.io/managed-by: client
    estabilis.io/tier: application
spec:
  project: applications
  source:
    repoURL: {{ $.Values.configRepoUrl }}
    targetRevision: {{ $.Values.configRepoVersion }}
    path: {{ $app.path }}
  destination:
    server: https://kubernetes.default.svc
    namespace: app-{{ $name }}
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        estabilis.io/managed-by: client
        estabilis.io/tier: application
        {{- if $app.owner }}
        estabilis.io/owner: {{ $app.owner | quote }}
        {{- end }}
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
