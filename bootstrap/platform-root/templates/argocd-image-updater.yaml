{{- /* optional: downstream can disable via components.argocd-image-updater: false */ -}}
{{- if ne (index .Values.components "argocd-image-updater") false }}
{{- if .Values.global.sharedAcrLoginServer }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acr-image-updater-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/acr-image-updater-credentials
      helm:
        # ValueFiles pulled from config-repo (`overrides/`) and client-
        # gitops (`overrides/` under `platforms/<deploymentId>/`). Match
        # the pattern used by cluster-secret-store so tenant-level KV
        # separation (e.g. `secretStoreName: shared-infra-secret-store`)
        # can be declared via a simple override file — no upstream bump
        # needed per deployment. Added in estabilis-platform v0.12.4.
        valueFiles:
          - $values/components/acr-image-updater-credentials/values.yaml
          - $values/values/platform/acr-image-updater-credentials.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "acr-image-updater-credentials" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "acr-image-updater-credentials" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        parameters:
          - name: acrLoginServer
            value: "{{ .Values.global.sharedAcrLoginServer }}"
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
    # Platform-gitops $values ref — needed by the `$values/...` paths
    # above. Declared explicitly here because this Application is single-
    # source otherwise; cluster-secret-store declares the same ref.
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    # Chart pinned to the track v0.x (annotation-based).
    # Upstream v1.0.0 (2025-11-11) is a rewrite to CRD-only — it no longer
    # reads `argocd-image-updater.argoproj.io/*` annotations on ArgoCD
    # Applications. Our write-back design (ADR 0016 D3) depends on those
    # annotations. Chart 0.14.0 → app v0.17.0 is the latest annotation-
    # based release. Do NOT bump to 1.x without also migrating every
    # consumer App to the ImageUpdater CRD.
    # See: https://github.com/argoproj-labs/argocd-image-updater/pull/1190
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: "0.14.0"
      helm:
        valueFiles:
          - $values/values/platform/argocd-image-updater.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "argocd-image-updater" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "argocd-image-updater" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          config:
            registries:
              - name: shared-acr
                api_url: "https://{{ .Values.global.sharedAcrLoginServer }}"
                prefix: "{{ .Values.global.sharedAcrLoginServer }}"
                credentials: "pullsecret:argocd/acr-image-updater-credentials"
                credsexpire: 30m
        {{- include "platform-root.provenanceParametersBlock" $ | nindent 8 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- end }}
