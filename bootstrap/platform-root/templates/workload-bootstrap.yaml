{{- /*
  Workload bootstrap — bridges platform-root (this repo) to the
  estabilis-platform-gitops repo, which owns everything the hub
  ArgoCD applies to workload clusters.

  Opt-in: set components.workload-bootstrap=true in the downstream
  override (overrides/platform-root/values.yaml).

  Reference: ADR 0001 — estabilis-platform-tools/docs/adr/0001-workload-bootstrap-strategy.md
*/ -}}
{{- if eq (index .Values.components "workload-bootstrap") true }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: workload-bootstrap
      helm:
        # Pass the estabilis-platform release version down to the
        # workload-bootstrap chart so the namespace annotations on the
        # target workload cluster carry the correct platform-version
        # (distinct from workload-bootstrap-version, which comes from
        # the chart's own Chart.yaml inside estabilis-platform-gitops).
        #
        # Also forward global.provenance.* (ADR 0005 Phase 2b) so the
        # workload-bootstrap chart and every workload-components chart
        # it renders (via nested ApplicationSets) inherit the L1
        # supply-chain annotations from the pipeline that invoked the
        # hub ArgoCD — without this, workload resources would render
        # with empty provenance defaults even when the hub has them set.
        parameters:
          - name: platformVersion
            value: {{ .Values.platformVersion | quote }}
          {{- /*
            Forward clientApps.autoSync from this chart's values into the
            workload-bootstrap chart so the `client-apps` ApplicationSet
            template uses the same gating as `hub-client-apps` (which
            lives in this chart). Cortex's downstream override at
            overrides/platform-root/values.yaml:clientApps.autoSync flips
            both ApplicationSets at once.
          */}}
          - name: clientApps.autoSync
            value: {{ .Values.clientApps.autoSync | quote }}
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
        valueFiles:
          - values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "workload-bootstrap" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}
