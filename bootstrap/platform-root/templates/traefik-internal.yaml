{{- /*
  ADR 0014 — optional second Traefik instance for internal (VNet-only)
  exposures. Produces ingressClass 'traefik-internal' backed by an Azure
  Internal LoadBalancer. Use alongside the public 'traefik' Deployment
  when the cluster needs both public and internal endpoints.

  Gated by components.traefik-internal OR global.traefikInternal (bridge).
*/ -}}
{{- if or (eq (index .Values.components "traefik-internal" | default false | toString) "true") (eq (index .Values.global "traefikInternal" | default false | toString) "true") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-internal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "traefik" "default" "39.0.5" "root" $) }}"
      helm:
        releaseName: traefik-internal
        valueFiles:
          - $values/values/platform/traefik.yaml
          - $values/values/platform/traefik-{{ .Values.global.provider }}.yaml
          - $values/values/platform/traefik-internal.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "traefik-internal" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "traefik-internal"))
             "provider" .Values.global.provider
             ) | nindent 10 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
