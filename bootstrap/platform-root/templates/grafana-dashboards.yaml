{{- /* optional: downstream can disable via components.grafana-dashboards: false */ -}}
{{- if ne (index .Values.components "grafana-dashboards") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  source:
    repoURL: {{ .Values.platformRepoUrl }}
    targetRevision: {{ .Values.platformVersion }}
    path: core/components/grafana-dashboards
    helm:
      parameters:
        # Per-cluster ArgoCD UI URL — substituted into the
        # argocd-application dashboard JSON to make table-panel data
        # links resolve to the correct UI on this cluster.
        #
        # Derived from global.argocdExposures, which this chart already
        # decodes to build the Ingress. global.argocdUrl still wins when
        # supplied. See the helper for why the derived path is preferred.
        # Empty when ArgoCD has no enabled external exposure — links stay
        # broken but the dashboard still renders.
        - name: argocdUrl
          value: "{{ include "platform-root.argocdUrl" . }}"
        {{- /* Gate the opencost dashboard ConfigMaps on the same precondition
              as bootstrap/platform-root/templates/opencost.yaml:
              both components.opencost!=false AND global.curBucketName!="".
              Without CUR, opencost doesn't render — so its dashboards would
              show empty panels that mislead the operator. */}}
        - name: opencostEnabled
          value: "{{ and (ne (index .Values.components "opencost" | toString) "false") (not (empty .Values.global.curBucketName)) }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
