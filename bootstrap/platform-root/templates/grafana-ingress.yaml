{{- /*
  ADR 0014 — Grafana external ingress Application. Same pattern as
  loki-ingress: renders iff at least one exposure is enabled in
  global.grafanaExposures and components.traefik is true.
*/ -}}
{{- $exposures := fromJson (default "{}" (index .Values.global "grafanaExposures" | default "")) -}}
{{- $hasEnabled := false -}}
{{- range $_, $exp := $exposures }}{{- if $exp.enabled }}{{- $hasEnabled = true }}{{- end }}{{- end }}
{{- if and (ne (index .Values.components "traefik") false) $hasEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/grafana-ingress
      helm:
        valueFiles:
          - $values/core/components/grafana-ingress/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "grafana-ingress" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "grafana-ingress" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: exposuresJson
            value: {{ index .Values.global "grafanaExposures" | default "{}" | quote }}
            forceString: true
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
