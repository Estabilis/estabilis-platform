{{- /*
  ADR 0014 — Grafana external ingress Application. Same pattern as
  loki-ingress: renders iff at least one exposure is enabled in
  global.grafanaExposures and components.traefik is true.
*/ -}}
{{- /* CLI (v0.15.2+) base64-encodes JSON helm params so they survive
      helm's --set metachar parsing through both layers (platform-root →
      child App). This template only *inspects* to decide whether to
      render the App; decoding happens in the child chart. */ -}}
{{- $raw := index .Values.global "grafanaExposures" | default "" -}}
{{- $jsonStr := "{}" -}}
{{- if $raw }}
  {{- if or (hasPrefix "{" $raw) (hasPrefix "[" $raw) }}
    {{- $jsonStr = $raw }}
  {{- else }}
    {{- $jsonStr = b64dec $raw }}
  {{- end }}
{{- end }}
{{- $exposures := fromJson $jsonStr -}}
{{- $hasEnabled := false -}}
{{- $hasTraefikExposure := false -}}
{{- range $_, $exp := $exposures }}{{- if $exp.enabled }}{{- $hasEnabled = true }}{{- if ne $exp.ingress_class "alb" }}{{- $hasTraefikExposure = true }}{{- end }}{{- end }}{{- end }}
{{- $traefikGate := or (eq $hasTraefikExposure false) (ne (index .Values.components "traefik" | toString) "false") (eq (index .Values.components "traefik-internal" | default false | toString) "true") (eq (index .Values.global "traefikInternal" | default false | toString) "true") }}
{{- if and $traefikGate $hasEnabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/grafana-ingress
      helm:
        valueFiles:
          - $values/core/components/grafana-ingress/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "grafana-ingress" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "grafana-ingress" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          {{- /* Pass the raw value through (either base64 or JSON). The
                child chart's values.yaml template inspects first char to
                decide whether to b64dec before fromJson. */}}
          - name: exposuresJson
            value: {{ $raw | quote }}
            forceString: true
          {{- /* ALB ingress class consumes these via .Values.global.* in the chart.
                 Ignored on Traefik path. */}}
          - name: global.dnsProvider
            value: "{{ .Values.global.dnsProvider }}"
          - name: global.acmCertificateArn
            value: "{{ .Values.global.acmCertificateArn }}"
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    {{- include "platform-root.autoSyncWhenUndeclared" $ }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
