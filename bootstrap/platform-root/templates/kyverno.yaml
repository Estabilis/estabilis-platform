{{- /* core: this component cannot be disabled — platform depends on it */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: "3.7.1"
      helm:
        valueFiles:
          - $values/values/platform/kyverno.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "kyverno" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "kyverno" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — kyverno has 4 controllers
                plus post-upgrade crds.migration and webhooksCleanup jobs. */}}
          {{- $mode := default "auto" (index .Values.scheduling "kyverno") }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $mode
                "paths" (list "admissionController" "backgroundController" "cleanupController" "reportsController")
                "provider" .Values.global.provider) | nindent 10 }}
          crds:
            migration:
              tolerations:
                {{- include "platform-root.schedulingTolerations" (dict "provider" .Values.global.provider) | nindent 16 }}
              affinity:
                {{- include "platform-root.schedulingAffinity" (dict "mode" $mode) | nindent 16 }}
          webhooksCleanup:
            tolerations:
              {{- include "platform-root.schedulingTolerations" (dict "provider" .Values.global.provider) | nindent 14 }}
            affinity:
              {{- include "platform-root.schedulingAffinity" (dict "mode" $mode) | nindent 14 }}
        {{- include "platform-root.provenanceParametersBlock" $ | nindent 8 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.annotations
        - .metadata.labels
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/kyverno-policies
      helm:
        valueFiles:
          - $values/components/kyverno-policies/values.yaml
          - $values/values/platform/kyverno-policies.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "kyverno-policies" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "kyverno-policies" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        {{- include "platform-root.provenanceParametersBlock" $ | nindent 8 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        # Kyverno admission controller mutates ClusterPolicies after
        # apply, injecting default fields not present in our manifests.
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
    # ADR 0005 L1 provenance annotations (built-at, build-id, etc.)
    # are handled globally via argocd-cm resource.customizations.ignoreDifferences.all
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
