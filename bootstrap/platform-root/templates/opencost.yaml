{{- /* optional: downstream can disable via components.opencost: false

       Precondition: requires cost_export_enabled=true in terraform.tfvars,
       which provisions AWS CUR + Athena tables and populates global.curBucketName
       in the platform-infrastructure ConfigMap. Without that, opencost runs but
       can't compute meaningful costs AND its ExternalSecrets reference AWS
       Secrets Manager paths terraform never created. We gate on both flags to
       prevent half-configured opencost from polluting the cluster with Degraded
       Applications and misleading dashboards.

       Azure deployments don't write global.curBucketName (CUR is an AWS concept),
       so opencost is naturally skipped on Azure even when explicitly enabled. */ -}}
{{- if and (ne (index .Values.components "opencost" | toString) "false") (not (empty .Values.global.curBucketName)) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost-presync
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/opencost-presync
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  sources:
    - repoURL: https://opencost.github.io/opencost-helm-chart
      chart: opencost
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "opencost" "default" "2.3.2" "root" $) }}"
      helm:
        valueFiles:
          - $values/core/components/opencost/values.yaml
          - $values/core/components/opencost/values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "opencost" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — opencost uses opencost.* subchart */}}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" (default "auto" (index .Values.scheduling "opencost"))
                "paths" (list "opencost")
             "provider" .Values.global.provider
             ) | nindent 10 }}
        {{- if eq .Values.global.provider "azure" }}
        parameters:
          - name: opencost.exporter.extraEnv.AZURE_SUBSCRIPTION_ID
            value: "{{ .Values.global.subscriptionId }}"
          - name: opencost.exporter.extraEnv.AZURE_TENANT_ID
            value: "{{ .Values.global.tenantId }}"
          - name: opencost.exporter.extraEnv.AZURE_OFFER_ID
            value: "{{ .Values.global.azureOfferId }}"
        {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
