{{- /* core: Kyverno namespace labels and PolicyException CRDs */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-exceptions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/kyverno-exceptions
      helm:
        valueFiles:
          - $values/components/kyverno-exceptions/values.yaml
          - $values/values/platform/kyverno-exceptions.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "kyverno-exceptions" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "kyverno-exceptions" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        {{- include "platform-root.provenanceParametersBlock" $ | nindent 8 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - jqPathExpressions:
        - .metadata.annotations["estabilis.io/built-at"]
        - .metadata.annotations["estabilis.io/build-id"]
        - .metadata.annotations["estabilis.io/git-revision"]
        - .metadata.annotations["estabilis.io/git-source"]
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
