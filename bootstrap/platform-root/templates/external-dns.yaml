{{- /* optional: downstream can disable via components.external-dns: false */ -}}
{{- if ne (index .Values.components "external-dns") false }}
{{- /* external-dns-config renders a provider-specific Secret
       (azure.json for Azure DNS, api-token for Cloudflare) consumed by the
       external-dns chart. Rendered for any non-empty dnsProvider. */ -}}
{{- $dnsProvider := .Values.global.dnsProvider | default .Values.global.provider -}}
{{- if $dnsProvider }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/external-dns-config
      helm:
        valueFiles:
          - $values/core/components/external-dns-config/values.yaml
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: global.provider
            value: "{{ .Values.global.provider }}"
          - name: global.dnsProvider
            value: "{{ $dnsProvider }}"
          {{- if eq $dnsProvider "azure" }}
          - name: global.tenantId
            value: "{{ .Values.global.tenantId }}"
          - name: global.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: global.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: identity.externalDns.clientId
            value: "{{ .Values.identity.externalDns.clientId }}"
          {{- else if eq $dnsProvider "cloudflare" }}
          - name: global.cloudflareApiToken
            value: "{{ .Values.global.cloudflareApiToken }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "1.20.0"
      helm:
        valueFiles:
          - $values/core/components/external-dns/values.yaml
          - $values/core/components/external-dns/values-{{ $dnsProvider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "external-dns" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "external-dns"))
             ) | nindent 10 }}
        parameters:
          - name: domainFilters[0]
            value: "{{ .Values.global.domain }}"
          - name: txtOwnerId
            value: "{{ .Values.global.clusterName }}"
          {{- if eq $dnsProvider "azure" }}
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.externalDns.clientId }}"
          {{- else if eq $dnsProvider "cloudflare" }}
          # Cloudflare — CF_API_TOKEN is injected via env/secretKeyRef in
          # values-cloudflare.yaml; nothing extra needed here. zoneIdFilters
          # scopes external-dns to a single zone (defence in depth — token
          # is already scoped to that zone).
          {{- if .Values.global.cloudflareZoneId }}
          - name: zoneIdFilters[0]
            value: "{{ .Values.global.cloudflareZoneId }}"
          {{- end }}
          {{- else if eq $dnsProvider "aws" }}
          # AWS — to be implemented
          # - name: aws.zoneType
          #   value: "public"
          # - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
          #   value: "{{ .Values.identity.externalDns.roleArn }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
