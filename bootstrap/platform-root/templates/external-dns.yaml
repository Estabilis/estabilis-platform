apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "1.20.0"
      helm:
        valueFiles:
          - $values/core/components/external-dns/values.yaml
          - $values/core/components/external-dns/values-{{ .Values.global.provider }}.yaml
        parameters:
          - name: domainFilters[0]
            value: "{{ .Values.global.domain }}"
          - name: txtOwnerId
            value: "{{ .Values.global.clusterName }}"
          {{- if eq .Values.global.provider "azure" }}
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.externalDns.clientId }}"
          - name: secretConfiguration.data.azure\.json
            value: '{"tenantId":"{{ .Values.global.tenantId }}"\,"subscriptionId":"{{ .Values.global.subscriptionId }}"\,"resourceGroup":"{{ .Values.global.resourceGroup }}"\,"useManagedIdentityExtension":true\,"userAssignedIdentityID":"{{ .Values.identity.externalDns.clientId }}"}'
            forceString: true
          {{- else if eq .Values.global.provider "aws" }}
          # AWS — to be implemented
          # - name: aws.zoneType
          #   value: "public"
          # - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
          #   value: "{{ .Values.identity.externalDns.roleArn }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
