{{- /* optional: downstream can disable via components.external-dns: false */ -}}
{{- if ne (index .Values.components "external-dns") false }}
{{- /* external-dns-config renders a provider-specific Secret
       (azure.json for Azure DNS, api-token for Cloudflare) consumed by the
       external-dns chart. Rendered for any non-empty dnsProvider. */ -}}
{{- $dnsProvider := .Values.global.dnsProvider | default .Values.global.provider -}}
{{- if $dnsProvider }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/external-dns-config
      helm:
        valueFiles:
          - $values/core/components/external-dns-config/values.yaml
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          - name: global.provider
            value: "{{ .Values.global.provider }}"
          - name: global.dnsProvider
            value: "{{ $dnsProvider }}"
          {{- if eq $dnsProvider "azure" }}
          - name: global.tenantId
            value: "{{ .Values.global.tenantId }}"
          - name: global.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: global.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: identity.externalDns.clientId
            value: "{{ .Values.identity.externalDns.clientId }}"
          {{- else if eq $dnsProvider "cloudflare" }}
          {{- /* Hand the chart the KEY, not the token. Injecting the token as a
                 helm parameter writes it in cleartext onto this Application
                 spec — and an Application is a CRD, so it sits outside the EKS
                 `resources: ["secrets"]` envelope encryption, unlike the Secret
                 it ends up producing.

                 The question is "does this deployment have a store holding the
                 token?", not "is this AWS?". AWS keeps deriving its key from
                 secretsPathPrefix — the estabilis/<deploymentId>/* convention
                 shared with platform-secrets.yaml, which is also the IRSA scope
                 of the external-secrets role. Any other provider supplies the
                 key directly, because store addressing has nothing in common to
                 derive: a Secrets Manager path, a flat Key Vault name and a
                 Google secret id look nothing alike.

                 Requires estabilis-platform-gitops with the configurable
                 remoteRef in external-dns-config. Before that the key was
                 hardcoded and this parameter was silently ignored. */}}
          {{- $tokenKey := "" }}
          {{- if and (eq .Values.global.provider "aws") .Values.global.secretsPathPrefix }}
          {{- $tokenKey = printf "%s/platform-cloudflare-api-token" .Values.global.secretsPathPrefix }}
          {{- else if .Values.global.cloudflareApiTokenSecretKey }}
          {{- $tokenKey = .Values.global.cloudflareApiTokenSecretKey }}
          {{- end }}
          {{- if $tokenKey }}
          - name: kvSecrets.cloudflareApiToken
            value: "{{ $tokenKey }}"
          {{- else }}
          {{- /* No store: the token is injected directly, in cleartext, and the
                 deployment has accepted that. */}}
          - name: global.cloudflareApiToken
            value: "{{ .Values.global.cloudflareApiToken }}"
          {{- end }}
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  ignoreDifferences:
    {{- /* ESO writes these defaults server-side; undeclared they show up as
          permanent OutOfSync drift. Same block as platform-secrets.yaml. */}}
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "external-dns" "default" "1.20.0" "root" $) }}"
      helm:
        valueFiles:
          - $values/core/components/external-dns/values.yaml
          - $values/core/components/external-dns/values-{{ $dnsProvider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "external-dns" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "auto" (index .Values.scheduling "external-dns"))
             "provider" .Values.global.provider
             ) | nindent 10 }}
        parameters:
          - name: domainFilters[0]
            value: "{{ .Values.global.domain }}"
          - name: txtOwnerId
            value: "{{ .Values.global.clusterName }}"
          {{- if eq $dnsProvider "azure" }}
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.externalDns.clientId }}"
          {{- else if eq $dnsProvider "cloudflare" }}
          # Cloudflare — CF_API_TOKEN is injected via env/secretKeyRef in
          # values-cloudflare.yaml; nothing extra needed here. zoneIdFilters
          # scopes external-dns to a single zone (defence in depth — token
          # is already scoped to that zone).
          {{- if .Values.global.cloudflareZoneId }}
          - name: zoneIdFilters[0]
            value: "{{ .Values.global.cloudflareZoneId }}"
          {{- end }}
          {{- else if eq $dnsProvider "aws" }}
          # AWS — to be implemented
          # - name: aws.zoneType
          #   value: "public"
          # - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
          #   value: "{{ .Values.identity.externalDns.roleArn }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  ignoreDifferences:
    {{- /* ESO writes these defaults server-side; undeclared they show up as
          permanent OutOfSync drift. Same block as platform-secrets.yaml. */}}
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/data/0/remoteRef/conversionStrategy
        - /spec/data/0/remoteRef/decodingStrategy
        - /spec/data/0/remoteRef/metadataPolicy
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
