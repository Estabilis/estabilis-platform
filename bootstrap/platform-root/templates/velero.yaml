{{- /* optional: downstream can disable via components.velero: false */ -}}
{{- if ne (index .Values.components "velero") false }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "11.4.0"
      helm:
        valueFiles:
          - $values/core/components/velero/values.yaml
          - $values/core/components/velero/values-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "velero" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97) — default regular-only (backup integrity) */}}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" (default "regular-only" (index .Values.scheduling "velero"))
             ) | nindent 10 }}
        parameters:
          {{- if eq .Values.global.provider "azure" }}
          - name: configuration.backupStorageLocation[0].bucket
            value: "{{ .Values.global.veleroBackupContainerName }}"
          - name: configuration.backupStorageLocation[0].config.storageAccount
            value: "{{ .Values.global.veleroStorageAccountName }}"
          - name: configuration.backupStorageLocation[0].config.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: configuration.backupStorageLocation[0].config.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: configuration.volumeSnapshotLocation[0].config.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: configuration.volumeSnapshotLocation[0].config.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: serviceAccount.server.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.velero.clientId }}"
          - name: schedules.platform-daily.schedule
            value: "{{ .Values.global.veleroBackupSchedule }}"
          - name: schedules.platform-daily.template.ttl
            value: "{{ .Values.global.veleroBackupRetentionHours }}h0m0s"
          {{- else if eq .Values.global.provider "aws" }}
          # AWS — to be implemented
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  source:
    repoURL: {{ .Values.platformRepoUrl }}
    targetRevision: {{ .Values.platformVersion }}
    path: core/components/velero-config
    helm:
      parameters:
        {{- include "platform-root.provenanceParameters" $ | nindent 8 }}
        - name: global.provider
          value: "{{ .Values.global.provider }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
