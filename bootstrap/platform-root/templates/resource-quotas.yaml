{{- /* core: resource quotas for all platform namespaces */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resource-quotas
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/resource-quotas
      helm:
        valueFiles:
          - $values/components/resource-quotas/values.yaml
          - $values/values/platform/resource-quotas.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "resource-quotas" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "resource-quotas" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        {{- /* Forward platform-root components map so the chart only renders
              ResourceQuotas/LimitRanges for namespaces whose component is
              actually deployed. Without this, disabled components
              (opencost=false, traefik=false, etc.) still produce quotas
              targeting their non-existent namespaces and the App stays
              OutOfSync.

              AWS-only entries (aws-load-balancer-controller, karpenter,
              karpenter-resources, metrics-server) are dropped from the
              forwarded map when global.provider != "aws" — the Apps
              themselves are gated on provider, so the namespaces never
              come into existence on Azure. See
              `platform-root.componentsForwarding` in _helpers.tpl. */}}
        valuesObject:
          {{- include "platform-root.componentsForwarding" . | nindent 10 }}
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
