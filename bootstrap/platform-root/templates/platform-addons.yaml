{{- /* Platform Add-ons — private components via OCI Helm charts */ -}}
{{- /*
ArgoCD OCI composition rules (v3.x) — per upstream docs:
https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-chart-repositories

  - repoURL has NO `oci://` prefix (ArgoCD infers OCI from context)
  - repoURL includes the full path to the chart namespace
    (e.g. `acr.azurecr.io/charts`, NOT `oci://acr.azurecr.io`)
  - chart is the bare chart name (e.g. `my-chart`, no path)
  - Internal helm pull becomes: helm pull oci://<repoURL>/<chart>

ACR convention used here: charts live under `<acr>/charts/<name>`, so the
default repoURL is `<acr>/charts` and the chart field is the bare name.

Historical note: a previous fix (commit 102da92) went the opposite
direction with `oci://<acr>` + `charts/<name>`. That was WRONG — it was
based on a sympton-level misdiagnosis and never actually worked
end-to-end. The ArgoCD 3.x docs are explicit that oci:// must not be
in repoURL. See Estabilis/estabilis-platform-tools#46 context and
the investigation that corrected this.
*/ -}}
{{- $acrLoginServer := .Values.global.acrLoginServer -}}
{{- range $name, $addon := .Values.platformAddons }}
{{- $repoURL := $addon.repoURL | default (printf "%s/charts" $acrLoginServer) }}
{{- $chart := $addon.chart }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $addon.syncWave | default "9" | quote }}
  labels:
    estabilis.io/managed-by: platform
    estabilis.io/tier: addon
spec:
  project: platform
  source:
    repoURL: {{ $repoURL }}
    chart: {{ $chart }}
    targetRevision: {{ $addon.targetRevision | quote }}
    {{- if $addon.values }}
    helm:
      valuesObject:
        {{- /* Inject ACR registry into values if not explicitly set */ -}}
        {{- if and $acrLoginServer (not (index ($addon.values) "registry")) }}
        registry: {{ printf "%s/estabilis" $acrLoginServer }}
        {{- end }}
        {{- $addon.values | toYaml | nindent 8 }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $addon.namespace | default "estabilis-system" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
