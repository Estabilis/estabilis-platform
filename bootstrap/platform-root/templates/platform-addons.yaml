{{- /* Platform Add-ons — private components via OCI Helm charts

Two render paths coexist, chosen per addon via `$addon.bridge`:

  1. Plain Application (default) — the common case. The addon receives
     values from `.Values.platformAddons.<name>.values` merged into the
     chart at render time. This is simple and 1:1.

  2. ApplicationSet + clusters generator (`bridge: true`) — used when
     the addon needs Terraform-known values at Helm render time
     (managed identity client IDs, hub Key Vault name, etc.). Values
     flow via annotations on the hub Cluster Secret written by Terraform
     in `estabilis-platform/providers/<cloud>/platform-outputs.tf`.
     See ADR 0010 for the full rationale and the annotation registry.

ArgoCD OCI composition rules (v3.x) — per upstream docs:
https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-chart-repositories

  - repoURL has NO `oci://` prefix (ArgoCD infers OCI from context)
  - repoURL includes the full path to the chart namespace
    (e.g. `acr.azurecr.io/charts`, NOT `oci://acr.azurecr.io`)
  - chart is the bare chart name (e.g. `my-chart`, no path)
  - Internal helm pull becomes: helm pull oci://<repoURL>/<chart>

ACR convention used here: charts live under `<acr>/charts/<name>`, so the
default repoURL is `<acr>/charts` and the chart field is the bare name.

`extraSyncOptions` — APPENDED to `CreateNamespace=true`, never replacing it.
The name says extra because that is what it is: an addon always gets its own
namespace created, and a key that replaced the list would let a caller drop
that by accident while looking like it only added something. The case this
exists for is `ServerSideApply=true`, which a chart shipping large CRDs needs:
client-side apply writes the whole manifest into the
`kubectl.kubernetes.io/last-applied-configuration` annotation, and an
annotation cannot exceed 262144 bytes, so the apply is rejected by the API
server and the Application never syncs. Kyverno hit this first and its
dedicated template hardcodes the option; addons come from downstream values
and cannot.
*/ -}}
{{- $acrLoginServer := .Values.global.acrLoginServer -}}
{{- range $name, $addon := .Values.platformAddons }}
{{- $repoURL := $addon.repoURL | default (printf "%s/charts" $acrLoginServer) }}
{{- $chart := $addon.chart }}
---
{{- if $addon.bridge }}
{{- /* --- Bridge addon: ApplicationSet + clusters generator --- */}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $name }}
  namespace: argocd
  labels:
    estabilis.io/managed-by: platform
    estabilis.io/tier: addon
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            estabilis.io/cluster-type: hub
  template:
    metadata:
      name: {{ `'{{ .name }}-` }}{{ $name }}{{ `'` }}
      annotations:
        argocd.argoproj.io/sync-wave: {{ $addon.syncWave | default "9" | quote }}
      labels:
        estabilis.io/managed-by: platform
        estabilis.io/tier: addon
    spec:
      project: platform
      source:
        repoURL: {{ $repoURL }}
        chart: {{ $chart }}
        targetRevision: {{ $addon.targetRevision | quote }}
        helm:
          {{- if $addon.values }}
          valuesObject:
            {{- if and $acrLoginServer (not (index ($addon.values) "registry")) }}
            registry: {{ printf "%s/estabilis" $acrLoginServer }}
            {{- end }}
            {{- $addon.values | toYaml | nindent 12 }}
          {{- end }}
          parameters:
            {{- /* Per-addon bridge bindings — map Cluster Secret annotations
                   (estabilis.io/bridge.<name>) to chart values. Keep this
                   mapping explicit per addon; see ADR 0010 §Rejected
                   alternatives for why a generic map is not used. */}}
            {{- if eq $name "estabilis-workload-operator" }}
            - name: hubTokenSync.clientId
              value: {{ `'{{ index .metadata.annotations "estabilis.io/bridge.workload-operator-client-id" }}'` }}
            - name: hubTokenSync.tenantId
              value: {{ `'{{ index .metadata.annotations "estabilis.io/bridge.tenant-id" }}'` }}
            - name: hubTokenSync.keyVaultName
              value: {{ `'{{ index .metadata.annotations "estabilis.io/bridge.hub-key-vault-name" }}'` }}
            {{- end }}
      destination:
        server: {{ `'{{ .server }}'` }}
        namespace: {{ $addon.namespace | default "estabilis-system" }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          {{- range $addon.extraSyncOptions }}
          - {{ . }}
          {{- end }}
{{- else }}
{{- /* --- Plain addon: Application (existing path, unchanged) --- */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $addon.syncWave | default "9" | quote }}
  labels:
    estabilis.io/managed-by: platform
    estabilis.io/tier: addon
spec:
  project: platform
  source:
    repoURL: {{ $repoURL }}
    chart: {{ $chart }}
    targetRevision: {{ $addon.targetRevision | quote }}
    {{- if $addon.values }}
    helm:
      valuesObject:
        {{- if and $acrLoginServer (not (index ($addon.values) "registry")) }}
        registry: {{ printf "%s/estabilis" $acrLoginServer }}
        {{- end }}
        {{- $addon.values | toYaml | nindent 8 }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $addon.namespace | default "estabilis-system" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      {{- range $addon.extraSyncOptions }}
      - {{ . }}
      {{- end }}
{{- end }}
{{- end }}
