{{- /* Platform Add-ons — private components via OCI Helm charts */ -}}
{{- /*
ArgoCD OCI composition rules (v3.x):
  - repoURL must be HOST ONLY (no path component), e.g. oci://acr.azurecr.io
  - chart contains the full path including subrepo, e.g. charts/my-chart
  - When ACR fallback is used, we auto-prepend "charts/" to the chart name
    (our ACR convention: oci://<acr>/charts/<name>)
  - Explicit repoURL bypasses the fallback; chart is used as-is
*/ -}}
{{- $acrLoginServer := .Values.global.acrLoginServer -}}
{{- range $name, $addon := .Values.platformAddons }}
{{- $useAcr := and $acrLoginServer (not $addon.repoURL) }}
{{- $repoURL := $addon.repoURL | default (printf "oci://%s" $acrLoginServer) }}
{{- $chart := $addon.chart }}
{{- if $useAcr }}
{{- $chart = printf "charts/%s" $addon.chart }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $addon.syncWave | default "9" | quote }}
  labels:
    estabilis.io/managed-by: platform
    estabilis.io/tier: addon
spec:
  project: platform
  source:
    repoURL: {{ $repoURL }}
    chart: {{ $chart }}
    targetRevision: {{ $addon.targetRevision | quote }}
    {{- if $addon.values }}
    helm:
      valuesObject:
        {{- /* Inject ACR registry into values if not explicitly set */ -}}
        {{- if and $acrLoginServer (not (index ($addon.values) "registry")) }}
        registry: {{ printf "%s/estabilis" $acrLoginServer }}
        {{- end }}
        {{- $addon.values | toYaml | nindent 8 }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $addon.namespace | default "estabilis-system" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
