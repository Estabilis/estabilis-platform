{{- /* Honours components.cert-manager. Covers both Applications in this file:
       cert-manager and cert-manager-config, which is its ClusterIssuers and
       is meaningless without it. */ -}}
{{- if ne (index .Values.components "cert-manager" | toString) "false" }}
{{- /* core: this component cannot be disabled — platform depends on it */ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "{{ include "platform-root.chartVersion" (dict "chart" "cert-manager" "default" "1.20.0" "root" $) }}"
      helm:
        valueFiles:
          - $values/values/platform/cert-manager.yaml
          - $values/values/platform/cert-manager-{{ .Values.global.provider }}.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cert-manager" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "cert-manager" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        valuesObject:
          {{- /* Scheduling (ADR 0012 — issue #97)
                cert-manager controller is top-level (no `controller:` key in chart);
                webhook/cainjector/startupapicheck are nested. */}}
          {{- $mode := default "auto" (index .Values.scheduling "cert-manager") }}
          {{- include "platform-root.schedulingValuesTopLevel" (dict
                "mode" $mode
                "provider" .Values.global.provider) | nindent 10 }}
          {{- include "platform-root.schedulingValuesFor" (dict
                "mode" $mode
                "paths" (list "webhook" "cainjector" "startupapicheck")
                "provider" .Values.global.provider) | nindent 10 }}
        {{- /* The key is emitted only when something goes under it.
               `parameters` is optional in the Application CRD, but an EMPTY one
               is not the same as an absent one: it renders as `parameters:`
               with nothing beneath, the API server reads that as null, and
               rejects the Application with

                 spec.sources[0].helm.parameters in body must be of type array: "null"

               Every entry below is conditional — the provenance helper stays
               silent unless git provenance was injected, and the two provider
               branches cover aws and azure. On any other provider, with no
               provenance, the block is empty. That could not surface while aws
               and azure were the only providers, because each always
               contributed its identity annotation. */}}
        {{- $provenance := include "platform-root.provenanceParameters" $ }}
        {{- if or (trim $provenance) (has .Values.global.provider (list "aws" "azure")) }}
        parameters:
          {{- $provenance | nindent 10 }}
          {{- if eq .Values.global.provider "azure" }}
          {{- /* Azure Workload Identity client-id for the cert-manager
                controller pod — dynamic per-cluster, so injected here. The
                static labels/annotations ("use: true") live in the provider
                overlay values file loaded above (cert-manager-azure.yaml). */}}
          - name: serviceAccount.annotations.azure\.workload\.identity/client-id
            value: "{{ .Values.identity.certManager.clientId }}"
            forceString: true
          {{- else if eq .Values.global.provider "aws" }}
          {{- /* AWS IRSA role ARN for the cert-manager controller pod —
                dynamic per-cluster, injected here. Paired with the
                provider overlay file loaded above (cert-manager-aws.yaml)
                and with `module.cert_manager_irsa` in
                providers/aws/iam.tf (gated on dns_provider = "route53").
                The controller assumes this role to solve Route53 DNS-01
                challenges for the `letsencrypt-production` ClusterIssuer. */}}
          - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
            value: "{{ .Values.identity.certManager.roleArn }}"
            forceString: true
          {{- end }}
        {{- end }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  {{- if eq .Values.global.provider "azure" }}
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].namespaceSelector
  {{- end }}
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      {{- /* cert-manager's CRDs need Established=True before a Sync hook
            declares success. ArgoCD's default apply checks the condition
            synchronously at apply time, which fires before the API server
            finishes promoting CRDs. SkipDryRunOnMissingResource lets
            Sync move past this race. */}}
      - SkipDryRunOnMissingResource=true
      {{- if eq .Values.global.provider "azure" }}
      - RespectIgnoreDifferences=true
      {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      path: components/cert-manager-config
      helm:
        valueFiles:
          - $values/components/cert-manager-config/values.yaml
          - $values/values/platform/cert-manager-config.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cert-manager-config" "root" $) | nindent 10 }}
          {{- include "platform-root.gitopsValueFile" (dict "component" "cert-manager-config" "root" $) | nindent 10 }}
        ignoreMissingValueFiles: true
        parameters:
          {{- include "platform-root.provenanceParameters" $ | nindent 10 }}
          {{- $dnsProvider := .Values.global.dnsProvider | default .Values.global.provider }}
          - name: global.provider
            value: "{{ .Values.global.provider }}"
          - name: global.dnsProvider
            value: "{{ $dnsProvider }}"
          - name: global.letsencryptEmail
            value: "{{ .Values.global.letsencryptEmail }}"
          - name: global.domain
            value: "{{ .Values.global.domain }}"
          {{- if eq $dnsProvider "azure" }}
          - name: global.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: global.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: identity.certManager.clientId
            value: "{{ .Values.identity.certManager.clientId }}"
          {{- else if eq $dnsProvider "cloudflare" }}
          {{- /* The token reaches cert-manager-config one of two ways, and the
                 choice is "is there a store holding it?", NOT "is this AWS?".

                 Passing a KEY makes the chart take its ExternalSecret branch,
                 and the token never appears on this Application spec. Passing
                 the TOKEN renders it in cleartext, readable by anyone with Argo
                 CD access — which is what v0.62.0 stopped for AWS and what any
                 provider with a secret store should also avoid.

                 AWS keeps deriving its key from secretsPathPrefix: that path
                 predates this and nothing about it changes. Every other
                 provider supplies the key directly, because it knows its own
                 store's addressing — a Secrets Manager path, a flat Key Vault
                 name and a Google secret id have nothing in common to derive.

                 Requires estabilis-platform-gitops >= v0.42.11, where that
                 branch reads .Values.kvSecrets.cloudflareApiToken instead of a
                 hardcoded flat Key Vault name. */}}
          {{- $tokenKey := "" }}
          {{- if and (eq .Values.global.provider "aws") .Values.global.secretsPathPrefix }}
          {{- $tokenKey = printf "%s/platform-cloudflare-api-token" .Values.global.secretsPathPrefix }}
          {{- else if .Values.global.cloudflareApiTokenSecretKey }}
          {{- $tokenKey = .Values.global.cloudflareApiTokenSecretKey }}
          {{- end }}
          {{- if $tokenKey }}
          - name: kvSecrets.cloudflareApiToken
            value: "{{ $tokenKey }}"
          {{- else }}
          - name: global.cloudflareApiToken
            value: "{{ .Values.global.cloudflareApiToken }}"
          {{- end }}
          {{- end }}
    - repoURL: {{ .Values.platformGitopsRepoUrl }}
      targetRevision: {{ .Values.platformGitopsVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
    {{- include "platform-root.gitopsSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadataExcluded" . | nindent 4 }}
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
{{- end }}
