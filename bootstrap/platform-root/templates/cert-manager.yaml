apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "1.20.0"
      helm:
        valueFiles:
          - $values/core/components/cert-manager/values.yaml
          {{- include "platform-root.overrideValueFile" (dict "component" "cert-manager" "root" $) | nindent 10 }}
        {{- include "platform-root.ignoreMissingValueFiles" $ | nindent 8 }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
    {{- include "platform-root.overrideSource" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  {{- if eq .Values.global.provider "azure" }}
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].namespaceSelector
  {{- end }}
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      {{- if eq .Values.global.provider "azure" }}
      - RespectIgnoreDifferences=true
      {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      path: core/components/cert-manager-config
      helm:
        valueFiles:
          - $values/core/components/cert-manager-config/values.yaml
        parameters:
          - name: global.provider
            value: "{{ .Values.global.provider }}"
          - name: global.letsencryptEmail
            value: "{{ .Values.global.letsencryptEmail }}"
          - name: global.domain
            value: "{{ .Values.global.domain }}"
          {{- if eq .Values.global.provider "azure" }}
          - name: global.subscriptionId
            value: "{{ .Values.global.subscriptionId }}"
          - name: global.resourceGroup
            value: "{{ .Values.global.resourceGroup }}"
          - name: identity.certManager.clientId
            value: "{{ .Values.identity.certManager.clientId }}"
          {{- end }}
    - repoURL: {{ .Values.platformRepoUrl }}
      targetRevision: {{ .Values.platformVersion }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    {{- include "platform-root.managedNamespaceMetadata" . | nindent 4 }}
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
