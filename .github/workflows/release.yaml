name: release

# Detects `chore(release): vX.Y.Z` commits on main and:
#   1. Creates an annotated git tag `vX.Y.Z` pointing at the commit
#   2. Creates a GitHub Release with the CHANGELOG section extracted
#      between `## [X.Y.Z]` and the next `## [`
#
# Operator workflow:
#   - Merge feature PRs normally (squash or merge, doesn't matter)
#   - When ready to release, create a dedicated commit on main with the
#     subject `chore(release): vX.Y.Z` (via a small PR or direct push —
#     the workflow handles both).
#   - This workflow tags + releases. No manual `git tag` / `git push --tags`
#     required.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needs to push the tag + create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for CHANGELOG extraction

      - name: Detect release commit
        id: detect
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s)
          echo "Last commit subject: $subject"
          if [[ "$subject" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="v${BASH_REMATCH[1]}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Detected release: $version"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit — skipping."
          fi

      - name: Guard against tag drift (idempotent)
        if: steps.detect.outputs.should_release == 'true'
        id: tag_check
        run: |
          set -euo pipefail
          version="${{ steps.detect.outputs.version }}"

          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            tag_sha=$(git rev-parse "refs/tags/${version}^{}")
            head_sha=$(git rev-parse HEAD)
            if [ "$tag_sha" = "$head_sha" ]; then
              # Tag exists and points at the release commit. Possible causes:
              # workflow re-run, operator pre-created the tag, or partial
              # previous run. Either way we can skip tag creation and continue
              # to the Release step (which is itself idempotent below).
              echo "Tag $version already points at HEAD ($head_sha) — skipping tag creation, continuing to Release."
              echo "skip_tag_creation=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag $version exists but points at $tag_sha, not at the release commit $head_sha. Drift detected — refusing to proceed. Resolve by either deleting the tag (if wrong) or pushing a new release commit."
              exit 1
            fi
          else
            echo "skip_tag_creation=false" >> "$GITHUB_OUTPUT"
          fi

      # Single source of truth for module version (v0.30.0+).
      # Modules read this file via `file("${path.module}/../../VERSION")`
      # at apply time so consumers don't have to bump both `main.tf ref`
      # and a `platform_revision` tfvar. The release commit lands first
      # (possibly without VERSION updated), and this step amends it
      # with the bump in the SAME commit so the tag points at a tree
      # where VERSION matches the tag. concurrency:group=release
      # serializes runs, so --force-with-lease is safe.
      - name: Sync VERSION file to release commit
        if: steps.detect.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" > VERSION
          if git diff --quiet VERSION; then
            echo "VERSION already matches $VERSION — no amend needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit --amend --no-edit
          git push --force-with-lease origin main
          echo "VERSION amended into release commit and pushed."

      - name: Extract CHANGELOG section
        if: steps.detect.outputs.should_release == 'true'
        id: changelog
        run: |
          set -euo pipefail
          version_bare="${{ steps.detect.outputs.version }}"
          version_bare="${version_bare#v}"

          # AWK extracts lines between `## [X.Y.Z]` (exclusive of header)
          # and the next `## [` marker. Stops on first match only.
          body=$(awk -v ver="$version_bare" '
            BEGIN { found=0; done=0 }
            /^## \[/ {
              if (found) { done=1 }
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found && !done { print }
          ' CHANGELOG.md)

          if [[ -z "$body" ]]; then
            echo "::warning::No CHANGELOG section found for $version_bare — using a generic message."
            body="Release $version_bare. See CHANGELOG.md for the full list of changes."
          fi

          # Multi-line output via heredoc delimiter
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$body"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.detect.outputs.should_release == 'true' && steps.tag_check.outputs.skip_tag_creation != 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build the tag message in a file — using -m with embedded newlines
          # is brittle inside YAML block scalars.
          printf '%s\n\n%s\n' "$VERSION" "$BODY" > /tmp/tag-message.txt
          git tag -a "$VERSION" -F /tmp/tag-message.txt
          git push origin "$VERSION"
          echo "Tag $VERSION pushed."

      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail
          # Idempotent: if Release already exists (e.g. operator created it
          # manually after a prior failed run), skip with a notice instead
          # of failing the workflow.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $VERSION already exists — skipping creation."
            exit 0
          fi
          # Use post-amend HEAD (not $GITHUB_SHA which is the pre-amend
          # commit when "Sync VERSION file" amended). The tag was already
          # pushed pointing at this same commit; using the explicit SHA
          # keeps the Release page target consistent with the tag.
          target_sha="$(git rev-parse HEAD)"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$BODY" \
            --target "$target_sha"
          echo "GitHub Release $VERSION created at $target_sha."
